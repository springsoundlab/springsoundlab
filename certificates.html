
    <div class="side-panel">
        <div class="certs-dropdown" id="certsDropdown">
            <div class="certs-header" onclick="toggleCerts()">
                <h2>СЕРТИФИКАТЫ</h2>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="certs-content">
                <div class="certs-container" id="certsList"></div>
            </div>
        </div>

        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="session-booking-widget">
            <div class="booking-label">Добавление на будущее</div>
            <div class="booking-row">
                <input type="text" id="bookingTime" class="booking-field" placeholder="00:00" maxlength="5" oninput="formatTimeInput(this)" onkeydown="if(event.key==='Enter') saveSession()">
                <input type="text" id="bookingClient" class="booking-field" placeholder="Имя клиента" onkeydown="if(event.key==='Enter') saveSession()">
            </div>
        </div>

        <div class="future-sessions-widget" id="nextSessionBox">
            <div class="future-title" id="futureTitleLabel">Ближайшая запись</div>
            <div id="futureListContainer">
                <div class="future-item">
                    <div class="future-date" id="nextSessionDate">--</div>
                    <div class="future-client" id="nextSessionClient">Нет записей</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0, fullPriceTotal: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;
    let hoverTimer;
    const hoverDelay = 700;
    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600', blue: '#00ccff' };

    function toggleCerts() { document.getElementById('certsDropdown').classList.toggle('active'); }
    function formatTimeInput(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length >= 2) val = val.slice(0, 2) + ':' + val.slice(2, 4);
        input.value = val;
    }

    function initTooltipLogic() {
        const tableBody = document.getElementById('crmTableBody');
        if(!tableBody) return;
        tableBody.addEventListener('mousemove', (e) => {
            const cell = e.target.closest('.services-cell');
            const allTooltips = document.querySelectorAll('.history-tooltip');
            clearTimeout(hoverTimer);
            allTooltips.forEach(t => t.classList.remove('active'));
            if (cell) {
                const tooltip = cell.querySelector('.history-tooltip');
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = e.clientY + 'px';
                hoverTimer = setTimeout(() => { tooltip.classList.add('active'); }, hoverDelay);
            }
        });
        tableBody.addEventListener('mouseleave', () => {
            clearTimeout(hoverTimer);
            document.querySelectorAll('.history-tooltip').forEach(t => t.classList.remove('active'));
        });
    }

    function openModal(title, type, confirmCallback, defaultValue = '') {
        const modal = document.getElementById('customModal');
        const overlay = document.getElementById('modalOverlay');
        const titleEl = document.getElementById('modalTitle');
        const inputEl = document.getElementById('modalInput');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        titleEl.innerText = title;
        inputEl.value = defaultValue;
        inputEl.style.display = (type === 'confirm-delete') ? 'none' : 'block';
        confirmBtn.className = 'm-btn ' + (type === 'delete' || type === 'confirm-delete' ? 'm-delete' : 'm-confirm');
        confirmBtn.onclick = confirmCallback;
        modal.style.display = 'block'; overlay.style.display = 'block';
        if(type !== 'confirm-delete') inputEl.focus();
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function openPriceModal(name, color, defaultPrice) {
        openModal(`УКАЖИТЕ СТОИМОСТЬ: ${name}`, "price", function() {
            const p = parseInt(document.getElementById('modalInput').value);
            if(!isNaN(p) && p > 0) {
                addToCart(name, p, color);
                closeModal();
            } else { alert('Введите корректную сумму'); }
        }, defaultPrice);
    }

    function checkPrivacyPassword() {
        if(document.body.classList.contains('privacy-active')) return;
        openModal("ВВЕДИТЕ ПАРОЛЬ АДМИНИСТРАТОРА", "password", function() {
            const pass = document.getElementById('modalInput').value;
            if (pass === '123') {
                document.body.classList.add('privacy-active');
                closeModal(); updateTable(); 
            } else { alert("Неверный пароль"); }
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        const monthName = document.getElementById('calMonthName');
        if(!grid || !monthName) return;
        grid.innerHTML = '';
        const now = new Date();
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthName.innerText = `${monthNames[month]} ${year}`;
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        let startingSpace = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startingSpace; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(row => row.date === dateStr);
            const isToday = now.toLocaleDateString('ru-RU') === dateStr;
            let classes = ['day'];
            if (isToday) classes.push('today');
            if (hasData) classes.push('has-data');
            if (selectedDate === dateStr) classes.push('selected-day');
            grid.innerHTML += `<div class="${classes.join(' ')}" onclick="selectCalendarDate('${dateStr}')">${d}</div>`;
        }
        updateMonthTotal();
    }

    function selectCalendarDate(date) {
        selectedDate = date;
        const label = document.getElementById('sessionDateLabel');
        if(label) label.innerText = `ТЕКУЩИЙ ЧЕК (${date}):`;
        renderCalendar(); updateNextSession(date); 
    }

    function changeMonth(dir) { 
        currentCalDate.setMonth(currentCalDate.getMonth() + dir); 
        selectedDate = null; updateTable(); renderCalendar(); 
    }

    function applyPrepaidToggle() {
        const isPrepaid = document.getElementById('prepaidMode').checked;
        currentCart.total = 0;
        currentCart.details.forEach(item => {
            const isForceFull = item.name.includes('ЧАС ЗАПИСИ');
            if (isPrepaid && !isForceFull) {
                item.price = item.basePrice / 2;
                if (!item.name.includes('(50%)')) item.name += ' (50%)';
            } else {
                item.price = item.basePrice;
                item.name = item.name.replace(' (50%)', '');
            }
            currentCart.total += item.price;
        });
        currentCart.items = currentCart.details.map(d => ({ name: d.name, colorClass: d.colorClass }));
        renderCart();
    }

    function addToCart(name, price, colorClass, forceFull = false) {
        const isPrepaid = document.getElementById('prepaidMode').checked;
        let finalPrice = (isPrepaid && !forceFull) ? price / 2 : price;
        let finalName = (isPrepaid && !forceFull) ? name + ' (50%)' : name;
        currentCart.details.push({ name: finalName, price: finalPrice, basePrice: price, colorClass });
        currentCart.items.push({ name: finalName, colorClass });
        currentCart.total += finalPrice;
        currentCart.fullPriceTotal += price;
        renderCart();
    }

    function removeFromCart(index) {
        const item = currentCart.details[index];
        currentCart.total -= item.price;
        currentCart.fullPriceTotal -= item.basePrice;
        currentCart.items.splice(index, 1);
        currentCart.details.splice(index, 1);
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        const total = document.getElementById('cartTotal');
        if(!container || !total) return;
        total.innerText = currentCart.total + ' ₽';
        container.innerHTML = currentCart.items.length === 0 ? 'Пусто...' : '';
        currentCart.items.forEach((item, i) => {
            const tag = document.createElement('div');
            tag.className = `cart-tag tag-${item.colorClass}`;
            tag.innerHTML = `${item.name}<div class="tag-remove" onclick="removeFromCart(${i})">×</div>`;
            container.appendChild(tag);
        });
    }

    function saveSession() {
        if (currentCart.items.length === 0) return alert('Добавьте услуги!');
        const name = document.getElementById('bookingClient').value || 'Без имени';
        let bookingTime = document.getElementById('bookingTime').value;
        const date = selectedDate || new Date().toLocaleDateString('ru-RU');
        crmData.push({ 
            date, client: name, time: bookingTime,
            services: currentCart.items.map(i => i.name).join(', '), 
            details: [...currentCart.details], total: currentCart.total, 
            fullTotal: currentCart.fullPriceTotal, timestamp: Date.now() 
        });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        currentCart = { items: [], details: [], total: 0, fullPriceTotal: 0 };
        document.getElementById('bookingClient').value = '';
        document.getElementById('bookingTime').value = '';
        renderCart(); updateTable(); renderCalendar(); updateNextSession();
    }

    function addPayment(index) {
        const row = crmData[index];
        const full = row.fullTotal || row.total;
        const remaining = full - row.total;
        if (remaining <= 0) return alert('Заказ уже полностью оплачен');
        openModal(`ДОПЛАТА: ${row.client}\nОСТАТОК: ${remaining} ₽`, "pay", function() {
            const amount = parseInt(document.getElementById('modalInput').value);
            if (!isNaN(amount) && amount > 0) {
                row.total += amount;
                localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
                updateTable(); closeModal();
            }
        }, remaining);
    }

    function deleteRow(i) {
        openModal("УДАЛИТЬ ЗАПИСЬ?", "confirm-delete", function() {
            crmData.splice(i, 1);
            localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
            updateTable(); renderCalendar(); updateNextSession(); closeModal();
        });
    }

    function clearFullHistory() {
        openModal("УДАЛИТЬ ВООБЩЕ ВСЮ ИСТОРИЮ?", "confirm-delete", function() {
            crmData = [];
            localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
            updateTable(); renderCalendar(); updateNextSession(); closeModal();
        });
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        if(!body) return;
        body.innerHTML = '';
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        const filteredData = crmData.filter(r => r.date.includes(mKey)).sort((a,b) => {
            const da = a.date.split('.').reverse().join('');
            const db = b.date.split('.').reverse().join('');
            return da !== db ? da.localeCompare(db) : a.timestamp - b.timestamp;
        });
        filteredData.forEach((row, index) => {
            const full = row.fullTotal || row.total;
            const paid = row.total;
            const perc = Math.min((paid / full) * 100, 100);
            const isComplete = perc >= 100;
            const realIndex = crmData.indexOf(row);
            const tooltipClass = (index < 4) ? 'pos-down' : 'pos-up';
            let tooltipHTML = `<div class="history-tooltip ${tooltipClass}"><div style="color:#888; font-family:Orbitron; font-size:9px; border-bottom:1px solid #222; padding-bottom:5px; margin-bottom:10px;">ДЕТАЛИЗАЦИЯ:</div>`;
            row.details.forEach(d => {
                tooltipHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:11px; border-left:2px solid ${colorMap[d.colorClass]}; padding-left:8px;"><span style="color:${colorMap[d.colorClass]}">${d.name}</span><span class="tooltip-sum" style="font-family:Rajdhani; font-weight:700;">${d.price} ₽</span></div>`;
            });
            tooltipHTML += `<div class="summary-line"><span>ИТОГО ЧЕК</span><span class="tooltip-sum">${full} ₽</span></div><div class="summary-line"><span>ВНЕСЕНО</span><span class="tooltip-sum" style="color:var(--status-green)">${paid} ₽</span></div><div class="summary-line"><span>ОСТАТОК</span><span class="tooltip-sum" style="color:var(--artist-red)">${Math.max(0, full-paid)} ₽</span></div></div>`;
            let timeDisplay = row.time ? `<span class="table-time-inline">${row.time}</span>` : '';
            const tr = document.createElement('tr');
            tr.innerHTML = `<td data-label="ДАТА">${row.date}</td><td data-label="КЛИЕНТ"><div style="display:flex; align-items:center;"><div style="font-weight:600;">${row.client}</div>${timeDisplay}</div><div class="progress-container"><div class="progress-bar ${isComplete ? 'complete' : ''}" style="width:${perc}%"></div></div></td><td class="services-cell" style="position:relative;" data-label="УСЛУГИ">${row.services}${tooltipHTML}</td><td class="price-cell privacy-blur" data-label="ВНЕСЕНО">${paid} ₽</td><td data-label="ДЕЙСТВИЯ"><div class="action-icons-wrap"><div class="icon-btn-box" onclick="addPayment(${realIndex})"><span>доплата</span><i class="fas fa-wallet"></i></div><div class="icon-btn-box icon-delete" onclick="deleteRow(${realIndex})"><span>удалить</span><i class="fas fa-trash"></i></div></div></td>`;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function updateMonthTotal() {
        const el = document.getElementById('monthTotal');
        if(!el) return;
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        const sum = crmData.filter(r => r.date.includes(mKey)).reduce((a, b) => a + b.total, 0);
        el.innerText = sum.toLocaleString() + ' ₽';
    }

    function updateCerts() {
        const list = document.getElementById('certsList');
        const saved = JSON.parse(localStorage.getItem('spring_certs')) || {};
        if(!list) return;
        list.innerHTML = '';
        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0');
            const d = saved[id] || { active: false, name: '' };
            const div = document.createElement('div');
            div.className = 'cert-row';
            div.innerHTML = `<span class="cert-id">${id}</span>${d.active ? `<span style="font-size:10px; color:#555">${d.name}</span>` : `<input type="text" id="in-${id}" style="background:#111; border:1px solid #222; color:#fff; padding:4px; font-size:10px; width:90px; outline:none;" placeholder="Имя">`}${d.active ? `<span style="font-size:8px; color:#00ff66; border:1px solid #00ff66; padding:2px 5px; border-radius:3px;">OK</span>` : `<button onclick="activateCert('${id}')" style="background:var(--neon-purple); border:none; color:#fff; font-size:8px; padding:4px 8px; border-radius:3px; cursor:pointer;">АКТИВ</button>`}`;
            list.appendChild(div);
        }
    }

    function activateCert(id) {
        const n = document.getElementById('in-' + id).value;
        if (!n) return alert('Имя!');
        const s = JSON.parse(localStorage.getItem('spring_certs')) || {};
        s[id] = { active: true, name: n };
        localStorage.setItem('spring_certs', JSON.stringify(s));
        updateCerts();
    }

    function updateNextSession(clickedDate = null) {
        const container = document.getElementById('futureListContainer');
        const titleEl = document.getElementById('futureTitleLabel');
        if (!container) return;
        const now = new Date();
        const todayStr = now.toLocaleDateString('ru-RU');
        const tomorrowStr = new Date(now.getTime() + 86400000).toLocaleDateString('ru-RU');
        let targetDate = clickedDate || (crmData.some(r => r.date === todayStr && r.time) ? todayStr : tomorrowStr);
        const sessions = crmData.filter(r => r.date === targetDate && r.time).sort((a, b) => a.time.localeCompare(b.time));
        container.innerHTML = ''; 
        if (sessions.length > 0) {
            titleEl.innerText = (targetDate === todayStr) ? "Записи на сегодня" : (targetDate === tomorrowStr ? "Записи на завтра" : `Записи на ${targetDate}`);
            sessions.forEach(next => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'future-item';
                itemDiv.innerHTML = `<div class="future-date">${next.time}</div><div class="future-client">${next.client}</div>`;
                container.appendChild(itemDiv);
            });
            document.getElementById('nextSessionBox').style.borderColor = 'var(--neon-purple)';
        } else {
            titleEl.innerText = "Ближайшая запись";
            container.innerHTML = `<div class="future-item"><div class="future-date">--</div><div class="future-client">Нет записей</div></div>`;
            document.getElementById('nextSessionBox').style.borderColor = '#111';
        }
    }

    renderCalendar(); updateTable(); updateCerts(); initTooltipLogic(); updateNextSession();
</script>
</body>
</html>
