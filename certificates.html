<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --text-gray: #b0b0b0;
        }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        /* ОБНОВЛЕННАЯ ШАПКА (ОСТАВИЛ КАК ПОНРАВИЛОСЬ) */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0 20px 0; 
            border-bottom: 1px solid #111; 
            flex-shrink: 0; 
        }

        .header-left-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .logo { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-purple); 
            letter-spacing: 2px; 
            font-size: 24px; 
            text-transform: uppercase;
            line-height: 1.2;
        }

        .header-datetime {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: 'Rajdhani', sans-serif;
            color: #555;
            font-size: 16px; 
            letter-spacing: 1px;
            font-weight: 600;
        }

        .header-clock {
            color: #999;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; 
            min-width: 90px;
        }
        
        .header-right-zone {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .total-box { 
            background: var(--neon-purple); 
            height: 70px;
            border-radius: 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(191, 0, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .income-amount { 
            font-family: 'Rajdhani'; 
            font-weight: 700; 
            font-size: 32px; 
            color: #fff; 
            line-height: 1;
        }

        #totalLabel { 
            font-size: 9px; 
            display: block; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: rgba(255,255,255,0.8); 
            margin-top: 5px; 
            font-weight: 600; 
            font-family: 'Orbitron';
        }

        .unlock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 4px;
            color: #fff;
            background: rgba(191, 0, 255, 0.1);
            pointer-events: none;
            z-index: 2;
            transition: 0.3s;
        }

        .privacy-blur { 
            filter: blur(15px); 
            opacity: 0.6; 
            transition: 0.3s;
        }
        
        .privacy-active .privacy-blur { 
            filter: blur(0) !important; 
            opacity: 1 !important; 
        }
        .privacy-active .unlock-overlay { 
            opacity: 0; 
            visibility: hidden; 
        }

        .back-btn { 
            color: #555; 
            text-decoration: none; 
            font-size: 9px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border: 1px solid #1a1a1a; 
            padding: 12px; 
            border-radius: 8px; 
            transition: 0.3s; 
            text-align: center;
            font-family: 'Orbitron';
            background: rgba(255,255,255,0.02);
        }

        .admin-grid { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            flex-grow: 1; 
            overflow: hidden; 
            margin-top: 20px;
        }

        .crm-panel, .side-panel { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #111; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        .table-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        /* КАЛЕНДАРЬ И НОВОЕ ПОЛЕ ВРЕМЕНИ */
        .calendar-widget { flex-shrink: 0; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; margin-bottom: 10px; }
        .time-picker-box { 
            background: #000; border: 1px solid #222; border-radius: 10px; padding: 12px; 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        }
        .time-picker-label { font-family: 'Orbitron'; font-size: 9px; color: #666; text-transform: uppercase; }
        .time-input-styled { 
            background: #111; border: 1px solid var(--neon-purple); color: #fff; 
            font-family: 'Rajdhani'; font-size: 16px; font-weight: 700; width: 80px; 
            text-align: center; border-radius: 4px; padding: 5px; outline: none;
        }

        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; text-transform: uppercase; font-size: 13px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; color: #fff; font-family: 'Rajdhani'; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green); }
        .day.selected-day { border: 1px solid #fff; background: rgba(255,255,255,0.1); }

        /* БЛИЖАЙШАЯ ЗАПИСЬ */
        .next-session-widget {
            background: rgba(191, 0, 255, 0.05); border: 1px solid rgba(191, 0, 255, 0.2); 
            border-radius: 10px; padding: 15px; margin-bottom: 20px;
        }
        .next-session-title { font-family: 'Orbitron'; font-size: 9px; color: #666; margin-bottom: 10px; text-transform: uppercase; }
        .next-session-info { display: flex; flex-direction: column; gap: 5px; }
        .next-session-row { display: flex; align-items: baseline; gap: 10px; }
        .next-session-date { font-family: 'Rajdhani'; font-weight: 700; font-size: 18px; color: var(--neon-purple); }
        .next-session-client { font-family: 'Inter'; font-weight: 600; font-size: 14px; color: #888; }

        /* КНОПКИ УСЛУГ (ВЕРНУЛ ВИЗУАЛ) */
        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; }
        .action-btn { 
            background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; 
            font-size: 9px; font-family: 'Orbitron', sans-serif; border: 1px solid #222; transition: 0.3s;
        }
        .action-btn:hover { border-color: var(--neon-purple); }

        /* КОРЗИНА И ЧЕК */
        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px solid var(--neon-purple); 
            padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; 
            justify-content: space-between; align-items: flex-start;
        }
        .cart-tag { 
            font-size: 10px; font-family: 'Orbitron'; padding: 6px 10px; border-radius: 4px; 
            display: inline-flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid #444; margin: 0 5px 5px 0;
        }
        .total-display-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 34px; color: #fff; text-align: right; }
        .input-mini { 
            background: #000; border: 1px solid #333; color: #fff; padding: 10px; 
            border-radius: 6px; font-size: 13px; font-family: 'Orbitron'; outline: none; width: 150px;
        }
        .save-btn { 
            background: var(--status-green); color: #fff; border: none; padding: 12px 20px; 
            border-radius: 6px; font-family: 'Orbitron'; font-size: 11px; cursor: pointer; text-transform: uppercase;
        }

        /* ТАБЛИЦА */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff; }
        .price-cell { font-weight: 700; font-size: 15px; text-align: right; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; }
        .custom-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0a0a; border: 1px solid var(--neon-purple); padding: 25px; border-radius: 15px; z-index: 100000; width: 320px; text-align: center; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }
    </style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="customModal" class="custom-modal">
    <div id="modalTitle" class="modal-title" style="font-family:'Orbitron'; font-size:11px; color:#fff; margin-bottom:15px;">ПАРОЛЬ</div>
    <input type="password" id="modalInput" style="width:100%; background:#000; border:1px solid #222; color:#fff; padding:12px; margin-bottom:20px; border-radius:6px; text-align:center;">
    <button class="save-btn" id="modalConfirmBtn">ПОДТВЕРДИТЬ</button>
</div>

<header>
    <div class="header-left-info">
        <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
        <div class="header-datetime">
            <span id="headerDate">--.--.----</span>
            <span class="header-clock" id="headerClock">00:00:00</span>
        </div>
    </div>
    <div class="header-right-zone">
        <div class="total-box" onclick="checkPrivacyPassword()">
            <div class="unlock-overlay">CLICK TO UNLOCK</div>
            <span id="monthTotal" class="income-amount privacy-blur">0 ₽</span>
            <span id="totalLabel">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <button class="action-btn" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white', true)">+ 1 ЧАС</button>
            <button class="action-btn" onclick="addToCart('START EDITION', 3500, 'purple')">START</button>
            <button class="action-btn" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST</button>
            <button class="action-btn" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ</button>
            <div style="border-left: 1px solid #222; padding-left: 10px;">
                <input type="number" id="platPrice" style="background:#000; border:1px solid #222; color:var(--platinum-gold); width:60px; padding:8px; border-radius:4px;" placeholder="Цена">
                <button class="action-btn" style="color:var(--platinum-gold)" onclick="addPlatToCart()">PLATINUM</button>
            </div>
        </div>

        <div class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron';">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>

        <div class="table-scroll-container">
            <table>
                <thead><tr><th>ДАТА / ВРЕМЯ</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th style="text-align:right">ВНЕСЕНО</th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="time-picker-box">
            <span class="time-picker-label">Время записи:</span>
            <input type="text" id="selectedTime" class="time-input-styled" placeholder="14:00" oninput="updateNextSession()">
        </div>

        <div class="next-session-widget">
            <div class="next-session-title">Ближайшая запись</div>
            <div class="next-session-info">
                <div class="next-session-row">
                    <span class="next-session-date" id="nextSessionDate">--</span>
                    <span id="nextSessionTime" style="font-family:'Orbitron'; font-size:12px; color:#fff;">--:--</span>
                </div>
                <div class="next-session-client" id="nextSessionClient">Нет записей</div>
            </div>
        </div>

        <div style="flex-grow:1; overflow-y:auto; border-top:1px solid #111; padding-top:15px;">
            <h3 style="font-family:'Orbitron'; font-size:10px; color:#444; margin-bottom:10px;">СЕРТИФИКАТЫ</h3>
            <div id="certsList"></div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0 };
    let currentCalDate = new Date();
    let selectedDate = new Date().toLocaleDateString('ru-RU');

    function startHeaderClock() {
        const clockEl = document.getElementById('headerClock');
        const dateEl = document.getElementById('headerDate');
        setInterval(() => {
            const now = new Date();
            clockEl.innerText = now.toLocaleTimeString('ru-RU');
            dateEl.innerText = now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase();
        }, 1000);
    }

    function checkPrivacyPassword() {
        if(document.body.classList.contains('privacy-active')) return;
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('customModal').style.display = 'block';
        document.getElementById('modalConfirmBtn').onclick = () => {
            if(document.getElementById('modalInput').value === '123') {
                document.body.classList.add('privacy-active');
                closeModal();
            }
        };
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('customModal').style.display = 'none';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        grid.innerHTML = '';
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = (new Date(year, month, 1).getDay() || 7) - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        document.getElementById('calMonthName').innerText = new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(currentCalDate);
        
        for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const isSelected = selectedDate === dateStr;
            grid.innerHTML += `<div class="day ${isSelected ? 'selected-day' : ''}" onclick="selectDate('${dateStr}')">${d}</div>`;
        }
    }

    function selectDate(date) {
        selectedDate = date;
        document.getElementById('sessionDateLabel').innerText = `ТЕКУЩИЙ ЧЕК (${date}):`;
        renderCalendar();
        updateNextSession();
    }

    function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); renderCalendar(); }

    function addToCart(name, price, color) {
        currentCart.items.push({ name, color });
        currentCart.total += price;
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        container.innerHTML = currentCart.items.length ? '' : 'Пусто...';
        currentCart.items.forEach(it => {
            container.innerHTML += `<div class="cart-tag">${it.name}</div>`;
        });
        document.getElementById('cartTotal').innerText = currentCart.total + ' ₽';
    }

    function saveSession() {
        const time = document.getElementById('selectedTime').value || '00:00';
        crmData.push({
            date: selectedDate,
            time: time,
            client: document.getElementById('clientName').value || 'Клиент',
            services: currentCart.items.map(i => i.name).join(', '),
            total: currentCart.total,
            timestamp: Date.now()
        });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        currentCart = { items: [], details: [], total: 0 };
        renderCart(); updateTable(); updateNextSession();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        body.innerHTML = '';
        crmData.sort((a,b) => b.timestamp - a.timestamp).forEach(row => {
            body.innerHTML += `<tr>
                <td>${row.date}<br><small style="color:#444">${row.time}</small></td>
                <td>${row.client}</td>
                <td>${row.services}</td>
                <td class="price-cell privacy-blur">${row.total} ₽</td>
            </tr>`;
        });
        const mTotal = crmData.reduce((s, r) => s + r.total, 0);
        document.getElementById('monthTotal').innerText = mTotal.toLocaleString() + ' ₽';
    }

    function updateNextSession() {
        const timeInput = document.getElementById('selectedTime').value;
        const clientInput = document.getElementById('clientName').value;
        
        // Показываем в виджете то, что сейчас выбрано в календаре/поле времени
        document.getElementById('nextSessionDate').innerText = selectedDate;
        document.getElementById('nextSessionTime').innerText = timeInput || '--:--';
        document.getElementById('nextSessionClient').innerText = clientInput || 'Новая запись...';
    }

    startHeaderClock(); renderCalendar(); updateTable(); updateNextSession();
</script>
</body>
</html>
