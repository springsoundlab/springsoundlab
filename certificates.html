<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --text-gray: #b0b0b0;
        }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        /* ШАПКА ОБЫЧНОЙ ВЫСОТЫ */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0 20px 0; 
            border-bottom: 1px solid #111; 
            flex-shrink: 0; 
        }

        /* УВЕЛИЧЕННЫЕ ВИДЖЕТЫ ВНУТРИ ШАПКИ */
        .header-left-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .logo { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-purple); 
            letter-spacing: 2px; 
            font-size: 24px; /* Увеличенный логотип */
            text-transform: uppercase;
            line-height: 1.2;
        }

        .header-datetime {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: 'Rajdhani', sans-serif;
            color: #555;
            font-size: 16px; /* Увеличенная дата */
            letter-spacing: 1px;
            font-weight: 600;
        }

        .header-clock {
            color: #999;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px; /* Увеличенные часы */
            min-width: 90px;
        }
        
        .header-right-zone {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .total-box { 
            background: var(--neon-purple); 
            height: 70px;
            border-radius: 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(191, 0, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .income-amount { 
            font-family: 'Rajdhani'; 
            font-weight: 700; 
            font-size: 32px; 
            color: #fff; 
            line-height: 1;
        }
        #totalLabel { 
            font-size: 9px; 
            display: block; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: rgba(255,255,255,0.8); 
            margin-top: 5px; 
            font-weight: 600; 
            font-family: 'Orbitron';
        }

        .unlock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 4px;
            color: #fff;
            background: rgba(191, 0, 255, 0.1);
            pointer-events: none;
            z-index: 2;
            transition: 0.3s;
        }

        .privacy-blur { 
            filter: blur(15px); 
            opacity: 0.6; 
            transition: 0.3s;
        }
        
        .privacy-active .privacy-blur { 
            filter: blur(0) !important; 
            opacity: 1 !important; 
        }
        .privacy-active .unlock-overlay { 
            opacity: 0; 
            visibility: hidden; 
        }

        .back-btn { 
            color: #555; 
            text-decoration: none; 
            font-size: 9px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border: 1px solid #1a1a1a; 
            padding: 12px; 
            border-radius: 8px; 
            transition: 0.3s; 
            text-align: center;
            font-family: 'Orbitron';
            background: rgba(255,255,255,0.02);
        }
        .back-btn:hover { 
            color: #fff; 
            border-color: var(--neon-purple); 
        }

        .admin-grid { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            flex-grow: 1; 
            overflow: hidden; 
            margin-top: 20px;
        }

        .crm-panel, .side-panel { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #111; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        .table-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 99999; backdrop-filter: blur(5px);
        }
        .custom-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0a0a; border: 1px solid var(--neon-purple); padding: 25px; border-radius: 15px;
            z-index: 100000; box-shadow: 0 0 40px rgba(191, 0, 255, 0.3); width: 320px; text-align: center;
        }
        .modal-title { font-family: 'Orbitron'; font-size: 11px; margin-bottom: 15px; color: #fff; letter-spacing: 1px; }
        .modal-input {
            width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 12px;
            margin-bottom: 20px; border-radius: 6px; font-family: 'Rajdhani'; font-size: 20px; text-align: center; outline: none; box-sizing: border-box;
        }
        .m-btn { padding: 10px 15px; border-radius: 6px; font-family: 'Orbitron'; font-size: 9px; cursor: pointer; text-transform: uppercase; border: none; flex: 1; transition: 0.2s; }
        .m-confirm { background: var(--status-green); color: #fff; }
        .m-cancel { background: #222; color: #888; }

        .calendar-widget { flex-shrink: 0; margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 9px; color: #666; font-weight: bold; padding-bottom: 5px; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green) !important; }
        .day.selected-day { border: 1px solid #fff; background: rgba(255,255,255,0.1); }
        .day:hover { background: #111; }

        /* ВИДЖЕТ БЛИЖАЙШЕЙ ЗАПИСИ */
        .next-session-widget {
            background: rgba(191, 0, 255, 0.05); border: 1px solid rgba(191, 0, 255, 0.2); border-radius: 10px; padding: 15px; margin-bottom: 20px; flex-shrink: 0;
        }
        .next-session-title { font-family: 'Orbitron'; font-size: 9px; color: #666; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        .next-session-info { display: flex; flex-direction: column; gap: 5px; }
        .next-session-row { display: flex; align-items: baseline; gap: 10px; }
        .next-session-date { font-family: 'Rajdhani'; font-weight: 700; font-size: 18px; color: var(--neon-purple); }
        .next-session-time { font-family: 'Orbitron'; font-size: 12px; color: #fff; }
        .next-session-client { font-family: 'Inter'; font-weight: 600; font-size: 14px; color: #888; }

        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; flex-shrink: 0; }
        .btn-wrapper { position: relative; display: inline-block; }
        .action-btn { background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; transition: 0.3s; position: relative; border: 1px solid #222; }
        .action-btn:hover { border-color: var(--neon-purple); }

        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px solid var(--neon-purple); 
            padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; 
            justify-content: space-between; min-height: 140px; align-items: flex-start; position: relative; flex-shrink: 0;
        }
        .cart-info { flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; }
        #cartItems { display: flex; flex-wrap: wrap; gap: 8px; }
        .cart-tag { font-size: 10px; font-family: 'Orbitron'; padding: 6px 30px 6px 10px; border-radius: 4px; display: inline-flex; align-items: center; position: relative; background: rgba(0,0,0,0.3); border: 1px solid #444; }
        .tag-remove { position: absolute; right: 0; top: 0; bottom: 0; width: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.5; }
        
        .cart-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; align-self: flex-end; }
        .total-display-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 34px; color: #fff; height: 42px; width: 170px; margin-bottom: 8px; text-align: right; }
        
        /* НОВОЕ ПОЛЕ ВРЕМЕНИ */
        .session-inputs-grid { display: grid; grid-template-columns: 100px 170px; gap: 10px; }
        .input-mini { background: #000; border: 1px solid #333; color: #fff; padding: 0 10px; height: 42px; border-radius: 6px; font-size: 13px; font-family: 'Orbitron'; text-align: center; outline: none; width: 100%; box-sizing: border-box; }
        .save-btn { background: var(--status-green); color: #fff; border: none; height: 42px; width: 100%; grid-column: span 2; border-radius: 6px; font-family: 'Orbitron'; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff !important; }
        
        .price-cell { color: #fff !important; font-weight: 700; font-size: 15px; text-align: right; padding-right: 12px; }

        .history-tooltip { 
            visibility: hidden; opacity: 0; position: fixed; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 9999; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            pointer-events: none; transition: opacity 0.4s ease;
        }
        .history-tooltip.active { visibility: visible; opacity: 1; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

        .prepaid-toggle { display: flex; align-items: center; gap: 10px; margin-right: 15px; padding: 5px 12px; border-right: 1px solid #222; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon-purple); }
        input:checked + .slider:before { transform: translateX(16px); }

        .action-icons-wrap { display: flex; align-items: center; gap: 15px; justify-content: flex-end; }
        .icon-btn-box { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .icon-btn-box i { font-size: 12px; color: #444; }
        .icon-btn-box span { font-family: 'Orbitron'; font-size: 7px; color: #444; text-transform: uppercase; }

        @media (max-width: 992px) {
            .admin-grid { display: flex; flex-direction: column; height: auto; overflow: visible; }
            header { flex-direction: column; align-items: center; text-align: center; }
            .header-right-zone { width: 100%; }
        }
    </style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="customModal" class="custom-modal">
    <div id="modalTitle" class="modal-title">ДОПЛАТА</div>
    <input type="number" id="modalInput" class="modal-input" placeholder="0">
    <div style="display:flex; gap:10px;">
        <button class="m-btn m-cancel" onclick="closeModal()">ОТМЕНА</button>
        <button id="modalConfirmBtn" class="m-btn m-confirm">ГОТОВО</button>
    </div>
</div>

<header>
    <div class="header-left-info">
        <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
        <div class="header-datetime">
            <span id="headerDate">--.--.----</span>
            <span class="header-clock" id="headerClock">00:00:00</span>
        </div>
    </div>
    <div class="header-right-zone">
        <div class="total-box" onclick="checkPrivacyPassword()">
            <div class="unlock-overlay">CLICK TO UNLOCK</div>
            <span id="monthTotal" class="income-amount privacy-blur">0 ₽</span>
            <span id="totalLabel">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="prepaid-toggle">
                <span style="font-family:'Orbitron'; font-size:9px; color:var(--neon-purple)">50%</span>
                <label class="switch">
                    <input type="checkbox" id="prepaidMode" onchange="applyPrepaidToggle()">
                    <span class="slider"></span>
                </label>
            </div>
            <button class="action-btn" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white', true)">+ 1 ЧАС</button>
            <button class="action-btn" onclick="addToCart('START EDITION', 3500, 'purple')">START</button>
            <button class="action-btn" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST</button>
            <button class="action-btn" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ</button>
            <button class="action-btn" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП</button>
            <div style="border-left: 1px solid #222; padding-left: 10px; display: flex; gap: 5px;">
                <input type="number" id="platPrice" style="background:#000; border:1px solid #222; color:var(--platinum-gold); width:60px; padding:5px; border-radius:4px; font-family:'Rajdhani'; font-size:12px;" placeholder="Цена">
                <button class="action-btn" style="color:var(--platinum-gold)" onclick="addPlatToCart()">PLATINUM</button>
            </div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron';">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <div class="session-inputs-grid">
                    <input type="text" id="sessionTime" class="input-mini" placeholder="00:00">
                    <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>

        <div class="table-scroll-container">
            <table>
                <thead><tr><th>ДАТА / ВРЕМЯ</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th style="text-align:right">ВНЕСЕНО</th><th style="text-align:right">ДЕЙСТВИЯ</th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="next-session-widget" id="nextSessionBox">
            <div class="next-session-title">Ближайшая запись</div>
            <div id="nextSessionContainer">
                <div class="next-session-info">
                    <div class="next-session-row">
                        <span class="next-session-date" id="nextSessionDate">--</span>
                        <span class="next-session-time" id="nextSessionTimeDisplay">--:--</span>
                    </div>
                    <div class="next-session-client" id="nextSessionClient">Нет записей</div>
                </div>
            </div>
        </div>

        <div class="certs-section" style="flex-grow:1; overflow:hidden;">
            <h2 style="font-family:'Orbitron'; font-size:14px; margin-bottom:10px;">СЕРТИФИКАТЫ</h2>
            <div id="certsList" style="overflow-y:auto; height:100%;"></div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0, fullPriceTotal: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;
    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600' };

    function startHeaderClock() {
        const clockEl = document.getElementById('headerClock');
        const dateEl = document.getElementById('headerDate');
        function update() {
            const now = new Date();
            clockEl.innerText = now.toLocaleTimeString('ru-RU', { hour12: false });
            dateEl.innerText = now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' }).replace(' г.', '').toUpperCase();
        }
        update(); setInterval(update, 1000);
    }

    function checkPrivacyPassword() {
        if(document.body.classList.contains('privacy-active')) return;
        openModal("ПАРОЛЬ АДМИНИСТРАТОРА", "password", function() {
            if (document.getElementById('modalInput').value === '123') {
                document.body.classList.add('privacy-active');
                closeModal();
            } else { alert("Неверно"); }
        });
    }

    function openModal(title, type, callback, val = '') {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalInput').value = val;
        document.getElementById('modalConfirmBtn').onclick = callback;
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('customModal').style.display = 'block';
        document.getElementById('modalInput').focus();
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('customModal').style.display = 'none';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        const monthName = document.getElementById('calMonthName');
        grid.innerHTML = '';
        const now = new Date();
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = (new Date(year, month, 1).getDay() || 7) - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const months = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthName.innerText = `${months[month]} ${year}`;
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        for(let i=0; i<firstDay; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(row => row.date === dateStr);
            let classes = ['day'];
            if (now.toLocaleDateString('ru-RU') === dateStr) classes.push('today');
            if (hasData) classes.push('has-data');
            if (selectedDate === dateStr) classes.push('selected-day');
            grid.innerHTML += `<div class="${classes.join(' ')}" onclick="selectedDate='${dateStr}'; renderCalendar(); document.getElementById('sessionDateLabel').innerText='ТЕКУЩИЙ ЧЕК (${dateStr}):'">${d}</div>`;
        }
    }

    function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); renderCalendar(); }

    function addToCart(name, price, color, force = false) {
        const isPrepaid = document.getElementById('prepaidMode').checked;
        let p = (isPrepaid && !force) ? price/2 : price;
        let n = (isPrepaid && !force) ? name + ' (50%)' : name;
        currentCart.details.push({ name: n, price: p, basePrice: price, colorClass: color });
        currentCart.items.push({ name: n, colorClass: color });
        currentCart.total += p;
        currentCart.fullPriceTotal += price;
        renderCart();
    }

    function addPlatToCart() {
        const p = parseInt(document.getElementById('platPrice').value) || 10000;
        addToCart('PLATINUM EDITION', p, 'gold');
        document.getElementById('platPrice').value = '';
    }

    function removeFromCart(i) {
        currentCart.total -= currentCart.details[i].price;
        currentCart.fullPriceTotal -= currentCart.details[i].basePrice;
        currentCart.items.splice(i, 1);
        currentCart.details.splice(i, 1);
        renderCart();
    }

    function renderCart() {
        const c = document.getElementById('cartItems');
        document.getElementById('cartTotal').innerText = currentCart.total + ' ₽';
        c.innerHTML = currentCart.items.length ? '' : 'Пусто...';
        currentCart.items.forEach((it, i) => {
            c.innerHTML += `<div class="cart-tag" style="border-color:${colorMap[it.colorClass]}; color:${colorMap[it.colorClass]}">${it.name}<div class="tag-remove" onclick="removeFromCart(${i})">×</div></div>`;
        });
    }

    function saveSession() {
        const name = document.getElementById('clientName').value || 'Без имени';
        const time = document.getElementById('sessionTime').value || '00:00';
        const date = selectedDate || new Date().toLocaleDateString('ru-RU');
        crmData.push({ 
            date, time, client: name, 
            services: currentCart.items.map(i => i.name).join(', '), 
            details: [...currentCart.details], 
            total: currentCart.total, 
            fullTotal: currentCart.fullPriceTotal,
            timestamp: Date.now() 
        });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        currentCart = { items: [], details: [], total: 0, fullPriceTotal: 0 };
        document.getElementById('clientName').value = '';
        document.getElementById('sessionTime').value = '';
        renderCart(); updateTable(); renderCalendar(); updateNextSession();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        body.innerHTML = '';
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        crmData.filter(r => r.date.includes(mKey)).sort((a,b) => a.date.split('.').reverse().join('') - b.date.split('.').reverse().join('')).forEach((row, i) => {
            const tr = document.createElement('tr');
            const perc = Math.min((row.total / (row.fullTotal || row.total)) * 100, 100);
            tr.innerHTML = `
                <td>${row.date}<br><small style="color:#444">${row.time || '00:00'}</small></td>
                <td>${row.client}<div style="width:100%; height:2px; background:#111; margin-top:4px;"><div style="width:${perc}%; height:100%; background:var(--neon-purple)"></div></div></td>
                <td>${row.services}</td>
                <td class="price-cell privacy-blur">${row.total} ₽</td>
                <td style="text-align:right">
                    <div class="action-icons-wrap">
                        <div class="icon-btn-box" onclick="deleteRow(${crmData.indexOf(row)})"><i class="fas fa-trash"></i><span>Удалить</span></div>
                    </div>
                </td>
            `;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function deleteRow(i) {
        if(confirm("Удалить?")) { crmData.splice(i, 1); localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); updateNextSession(); }
    }

    function updateMonthTotal() {
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        const sum = crmData.filter(r => r.date.includes(mKey)).reduce((a, b) => a + b.total, 0);
        document.getElementById('monthTotal').innerText = sum.toLocaleString() + ' ₽';
    }

    function updateNextSession() {
        const dateEl = document.getElementById('nextSessionDate');
        const timeEl = document.getElementById('nextSessionTimeDisplay');
        const clientEl = document.getElementById('nextSessionClient');
        
        const now = new Date();
        now.setHours(0,0,0,0);

        // Фильтруем только сегодняшние и будущие записи
        const upcoming = crmData.filter(r => {
            const [d, m, y] = r.date.split('.');
            const sessionDate = new Date(y, m-1, d);
            return sessionDate >= now;
        });

        if (upcoming.length > 0) {
            // Сортируем по дате и времени
            upcoming.sort((a, b) => {
                const dateA = new Date(a.date.split('.').reverse().join('-') + 'T' + (a.time || '00:00'));
                const dateB = new Date(b.date.split('.').reverse().join('-') + 'T' + (b.time || '00:00'));
                return dateA - dateB;
            });

            const next = upcoming[0];
            const todayStr = new Date().toLocaleDateString('ru-RU');
            dateEl.innerText = next.date === todayStr ? 'СЕГОДНЯ' : next.date;
            timeEl.innerText = next.time || '00:00';
            clientEl.innerText = next.client;
        } else {
            dateEl.innerText = '--';
            timeEl.innerText = '--:--';
            clientEl.innerText = 'Нет записей';
        }
    }

    startHeaderClock(); renderCalendar(); updateTable(); updateNextSession();
</script>
</body>
</html>
