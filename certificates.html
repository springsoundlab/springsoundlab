<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ULTRA-DEBUG | SPRING SOUND LAB</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; padding: 20px; }
        .card { 
            background: #111; 
            border: 2px solid #333; 
            padding: 20px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }
        .btn-pay { 
            background: #008f39; 
            color: white; 
            padding: 15px 25px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            pointer-events: all !important; /* Принудительный клик */
        }
        .btn-del { 
            background: #cc0000; 
            color: white; 
            padding: 15px 25px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            margin-left: 10px;
            pointer-events: all !important;
        }
        button:active { background: yellow !important; color: black !important; } /* Вспышка при нажатии */
    </style>
</head>
<body>

    <h2>ПРОВЕРКА КНОПОК (ПРЯМАЯ ЛОГИКА)</h2>
    <div id="debugList"></div>

    <script>
        // Данные берем напрямую из памяти
        let data = JSON.parse(localStorage.getItem('spring_crm_v3')) || [
            {client: "ТЕСТОВЫЙ КЛИЕНТ", total: 1000, services: "Запись"}
        ];

        function refresh() {
            const list = document.getElementById('debugList');
            list.innerHTML = '';
            
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div>
                        <strong>${item.client}</strong> — ${item.total} ₽
                    </div>
                    <div>
                        <button class="btn-pay" onclick="
                            const add = prompt('Сколько добавить?');
                            if(add) {
                                data[${i}].total += parseInt(add);
                                localStorage.setItem('spring_crm_v3', JSON.stringify(data));
                                refresh();
                            }
                        ">ДОПЛАТА</button>
                        
                        <button class="btn-del" onclick="
                            if(confirm('Удалить?')) {
                                data.splice(${i}, 1);
                                localStorage.setItem('spring_crm_v3', JSON.stringify(data));
                                refresh();
                            }
                        ">УДАЛИТЬ</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        refresh();
    </script>
</body>
</html>
