<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Sound Lab · Студия звукозаписи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://res.smartwidgets.ru/app.js" async></script>
    <style>
        /* === СБРОС И БАЗОВЫЕ СТИЛИ (В СТИЛЕ HOTBOX) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Абсолютно чёрный фон */
            color: #ffffff;
            line-height: 1.3;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px; /* Чуть больше воздуха по бокам */
        }

        /* === НАВИГАЦИЯ (МИНИМАЛИСТИЧНАЯ) === */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid #333; /* Тонкая серая линия */
            position: sticky;
            top: 0;
            background-color: #000;
            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.8rem;
            font-weight: 800; /* Максимальная жирность */
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            line-height: 1;
        }

        .logo-image {
            height: 50px; /* Логотип стал крупнее */
            width: auto;
            display: block;
            filter: invert(1); /* Если логотип тёмный, на чёрном фоне он станет белым */
        }

        .address-block {
            display: flex;
            flex-direction: column;
        }

        .header-address, .work-hours {
            color: #888; /* Серый цвет для второстепенного текста */
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: color 0.2s;
        }
         .header-address i {
            color: #fff; /* Белая иконка */
            margin-right: 5px;
        }
        .header-address:hover {
            color: #fff;
        }

        .work-hours {
            margin-top: 4px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-links > a, .nav-links > .dropdown > a {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-links > a:hover, .nav-links > .dropdown > a:hover {
            color: #fff;
        }

        .nav-links .active-link {
            color: #fff !important; /* Активный пункт — белый */
        }

        /* Выпадающее меню (строгое, чёрное) */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            opacity: 0;
            visibility: hidden;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;
            background-color: #111; /* Чуть светлее фона */
            min-width: 180px;
            padding: 8px 0;
            z-index: 100;
            border: 1px solid #333;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .dropdown:hover .dropdown-content {
            opacity: 1;
            visibility: visible;
        }

        .dropdown-content a, .dropdown-content .phone-number {
            display: block;
            color: #aaa;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-align: left;
            border-bottom: 1px solid #222;
        }
        .dropdown-content a:last-child, .dropdown-content .phone-number:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: #222;
            color: #fff;
        }

        .header-phone {
            color: #fff; /* Белый, так как это важный элемент */
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .header-phone i {
            margin-right: 5px;
        }

        /* === ОСНОВНОЙ КОНТЕНТ (ГРАФИЧНЫЙ) === */

        .page {
            display: none;
        }
        .page.active-page {
            display: block;
        }

        /* --- ГЛАВНАЯ --- */
        .hero {
            margin: 80px 0 120px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Две колонки */
            gap: 40px;
            align-items: end;
        }

        .hero-content {
            padding-right: 40px;
        }

        .hero-pre {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #666;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 5.5rem; /* Огромный заголовок */
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 30px;
        }

        .hero-title .hero-title-secondary {
            color: #fff; /* Без цветного акцента */
            display: block; /* Чтобы вторая часть была на новой строке */
        }

        .hero-desc {
            font-size: 1.2rem;
            line-height: 1.4;
            color: #aaa;
            max-width: 90%;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .hero-btn {
            display: inline-block;
            background-color: transparent;
            color: #fff;
            text-decoration: none;
            padding: 15px 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #fff;
            transition: all 0.2s;
            cursor: pointer;
        }

        .hero-btn:hover {
            background-color: #fff;
            color: #000;
        }

        .hero-slider {
            background-color: #111; /* Серый прямоугольник вместо фото */
            aspect-ratio: 4 / 5;
            width: 100%;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 1rem;
            text-transform: uppercase;
        }
        /* Убираем изображения, оставляем плашки */
        .slider-image {
            display: none;
        }


        /* Заголовки секций */
        .section-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            color: #fff;
            border-top: 1px solid #333;
            padding-top: 40px;
        }

        /* Сетка артистов (как блоки в HOTBOX) */
        .artist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-bottom: 100px;
        }

        .artist-card {
            background-color: #111;
            border: 1px solid #222;
            transition: border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .artist-card:hover {
            border-color: #444;
        }

        .artist-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #1a1a1a; /* Тёмно-серый фон */
            background-size: cover;
            background-position: center;
            filter: grayscale(100%); /* Ч/Б изображения */
        }
        /* Убираем конкретные изображения, оставляем фон */
        .artist-image.one { background-color: #222; }
        .artist-image.two { background-color: #1f1f1f; }
        .artist-image.three { background-color: #242424; }
        .artist-image.four { background-color: #2a2a2a; }


        .artist-info {
            padding: 20px;
            border-top: 1px solid #222;
        }

        .artist-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #fff;
        }

        .artist-role {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Аудиоплеер (ч/б стилизация) */
        .artist-card audio {
            width: 100%;
            margin-top: auto;
            filter: invert(1) grayscale(1) contrast(1.5);
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .artist-card audio:hover {
            opacity: 1;
        }

        /* Сетка для аранжировок */
        .events-list {
            margin-bottom: 100px;
        }

        .event-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 30px;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid #222;
        }

        .event-item audio {
            width: 200px;
            filter: invert(1) grayscale(1) contrast(1.5);
        }

        .event-details {
        }

        .event-title {
            font-weight: 600;
            font-size: 1.3rem;
            color: #fff;
        }

        .event-location {
            color: #666;
            font-size: 0.95rem;
        }

        .event-ticket {
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 35px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .event-ticket:hover {
            background-color: #fff;
            color: #000;
        }

        /* === СТРАНИЦЫ (все в ч/б стиле) === */
        .studio-prices-title,
        .vocal-prices-title,
        .guitar-prices-title,
        .reviews-title,
        .about-studio-title,
        .equipment-title,
        .space-title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 40px;
        }
        .studio-prices-title span,
        .vocal-prices-title span,
        .guitar-prices-title span,
        .reviews-title span,
        .about-studio-title span,
        .equipment-title span,
        .space-title span {
            color: #fff; /* Без цветного акцента */
        }

        /* Карточки цен (минимализм) */
        .price-grid,
        .vocal-prices-grid,
        .guitar-prices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .price-card,
        .vocal-price-card,
        .guitar-price-card {
            background-color: #111;
            border: 1px solid #222;
            padding: 40px 30px;
            transition: border-color 0.2s;
        }
        .price-card:hover,
        .vocal-price-card:hover,
        .guitar-price-card:hover {
            border-color: #444;
        }

        .price-name,
        .vocal-price-name,
        .guitar-price-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #fff;
        }

        .price-value,
        .vocal-price-value,
        .guitar-price-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
        }
        .price-value span {
            font-size: 1rem;
            color: #666;
        }

        .price-description,
        .vocal-price-description,
        .guitar-price-description {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .price-order,
        .vocal-price-order,
        .guitar-price-order {
            display: inline-block;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 35px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .price-order:hover,
        .vocal-price-order:hover,
        .guitar-price-order:hover {
            background: #fff;
            color: #000;
        }

        /* Страницы "О студии", "Оборудование", "Пространство" (графичные блоки) */
        .studio-grid,
        .equipment-grid,
        .space-grid {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .studio-row,
        .equipment-row,
        .space-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .studio-row.reverse,
        .equipment-row.reverse,
        .space-row.reverse {
            direction: rtl; /* Меняем направление текста в ряду */
        }
        .studio-row.reverse .studio-text-block,
        .equipment-row.reverse .equipment-text-block,
        .space-row.reverse .space-text-block {
            direction: ltr; /* Возвращаем нормальное направление тексту */
        }


        .studio-image,
        .equipment-image,
        .space-image {
            background-color: #1a1a1a;
            aspect-ratio: 1 / 1;
            border: 1px solid #333;
            transition: border-color 0.2s;
        }
        .studio-image:hover,
        .equipment-image:hover,
        .space-image:hover {
            border-color: #666;
        }

        .studio-text-block,
        .equipment-text-block,
        .space-text-block {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #ccc;
            font-weight: 300;
        }
        .studio-text-block p,
        .equipment-text-block p,
        .space-text-block p {
            margin-bottom: 20px;
        }
        .studio-text-block strong,
        .equipment-text-block strong,
        .space-text-block strong {
            color: #fff;
            font-weight: 600;
        }

        /* Карточка преподавателя */
        .teacher-card {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            background-color: #111;
            border: 1px solid #222;
            padding: 40px;
        }
        .teacher-photo {
            background-color: #1a1a1a;
            aspect-ratio: 1 / 1;
            border: 1px solid #333;
        }
        .teacher-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }
        .teacher-experience {
            font-size: 1.2rem;
            color: #666;
            margin: 10px 0 20px;
        }
        .teacher-bio {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #aaa;
        }

        /* === ПОДВАЛ (СТРОГИЙ) === */
        .footer {
            border-top: 1px solid #222;
            padding: 40px 0;
            margin-top: 100px;
        }

        .footer-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .footer-info {
            display: flex;
            gap: 40px;
        }

        .footer-logo {
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
        }

        .footer-info-item {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }
        .footer-info-item i {
            color: #fff;
        }
        .footer-info-item:hover {
            color: #fff;
        }

        .footer-social {
            text-align: right;
        }
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .social-icons a {
            color: #666;
            font-size: 1.2rem;
            transition: color 0.2s;
        }
        .social-icons a:hover {
            color: #fff;
        }

        .login-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .login-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .copyright {
            margin-top: 40px;
            color: #444;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        /* === МОДАЛЬНЫЕ ОКНА (Ч/Б) === */
        .vocal-modal-overlay,
        .modal-overlay {
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(3px);
        }

        .vocal-modal-panel,
        .modal-panel {
            background: #111;
            border: 1px solid #333;
            box-shadow: none;
            border-radius: 0; /* Прямые углы */
        }

        .vocal-modal-title,
        .modal-title {
            color: #fff;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .vocal-modal-phone {
            background: #222;
            color: #fff;
            border-radius: 0;
        }
        .vocal-modal-phone:hover {
            background: #333;
        }

        .vocal-modal-form input,
        .vocal-modal-form textarea,
        .modal-input {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 0;
            padding: 15px;
        }
        .vocal-modal-form input:focus,
        .vocal-modal-form textarea:focus,
        .modal-input:focus {
            border-color: #666;
            outline: none;
        }

        .vocal-modal-submit,
        .modal-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 0;
            font-weight: 700;
            padding: 16px;
            transition: 0.2s;
        }
        .vocal-modal-submit:hover,
        .modal-btn:hover {
            background: #ddd;
        }

        .vocal-modal-social-icons a {
            color: #666;
        }
        .vocal-modal-social-icons a:hover {
            color: #fff;
        }

        .vocal-modal-close,
        .modal-close {
            color: #444;
        }

        /* === ПЛАШКА COOKIE === */
        .cookie-consent {
            background: #111;
            border: 1px solid #333;
            border-radius: 0;
            color: #aaa;
        }
        .cookie-consent button {
            background: #fff;
            color: #000;
            border-radius: 0;
            border: none;
        }

        /* === ПЛАВАЮЩАЯ КНОПКА === */
        .social-float-button {
            background-color: #fff;
            border-radius: 0;
            box-shadow: none;
            animation: none;
        }
        .social-float-button i {
            color: #000;
        }
        .social-float-menu {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 0;
        }

        /* === АДАПТАЦИЯ === */
        @media (max-width: 1000px) {
            .container { padding: 0 30px; }
            .navbar { flex-direction: column; align-items: flex-start; gap: 20px; }
            .navbar-left { width: 100%; justify-content: space-between; }
            .nav-links { flex-wrap: wrap; }
            .hero { grid-template-columns: 1fr; }
            .hero-title { font-size: 4rem; }
            .artist-grid { grid-template-columns: repeat(2, 1fr); }
            .studio-row,
            .equipment-row,
            .space-row {
                grid-template-columns: 1fr;
                direction: ltr !important;
            }
            .teacher-card { grid-template-columns: 1fr; }
            .footer-main { flex-direction: column; align-items: flex-start; }
            .footer-info { flex-wrap: wrap; }
        }

        @media (max-width: 600px) {
            .container { padding: 0 20px; }
            .hero-title { font-size: 3rem; }
            .artist-grid { grid-template-columns: 1fr; }
            .event-item { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ВАЖНО: Изменения коснутся только CSS, структура страниц и скрипты останутся теми же. -->

        <!-- Здесь всё ваше меню, страницы, модалки, футер -->

    </script>
</body>
</html>
