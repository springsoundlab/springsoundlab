<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --text-gray: #b0b0b0;
        }
        body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #111; margin-bottom: 20px; }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--neon-purple); letter-spacing: 2px; font-size: 14px; }
        .back-btn { color: #888; text-decoration: none; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #222; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .back-btn:hover { color: #fff; border-color: var(--neon-purple); }

        /* ———— ВЕРХНЯЯ ПАНЕЛЬ (ДОХОД) ———— */
        .income-block {
            background: rgba(191, 0, 255, 0.05);
            border: 1px solid var(--neon-purple); 
            padding: 10px 20px;
            border-radius: 8px;
            text-align: right;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.2);
        }
        .income-label {
            font-family: 'Orbitron';
            font-size: 9px;
            color: var(--neon-purple);
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .income-amount {
            font-family: 'Rajdhani'; 
            font-weight: 700;
            font-size: 24px;
            color: #fff;
        }

        .admin-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: stretch; }
        .crm-panel, .side-panel { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #111; display: flex; flex-direction: column; }

        /* Календарь */
        .calendar-widget { margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 9px; color: #666; font-weight: bold; padding-bottom: 5px; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green) !important; color: #fff !important; }
        .day.selected-day { border: 1px solid #fff; background: rgba(255,255,255,0.1); }
        .day:hover { background: #111; }

        /* Кнопки услуг */
        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; }
        .btn-wrapper { position: relative; display: inline-block; }
        .action-btn { background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; transition: 0.3s; position: relative; }
        
        .btn-tooltip, .history-tooltip { 
            visibility: hidden; opacity: 0; position: absolute; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 1000; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            transition: opacity 0.3s ease; pointer-events: none; 
        }

        .btn-wrapper:hover .btn-tooltip, 
        .history-row:hover .history-tooltip { 
            visibility: visible; opacity: 1; transition-delay: 0.5s; 
        }

        .btn-tooltip { bottom: 120%; left: 50%; transform: translateX(-50%); width: auto; padding: 5px 10px; }

        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .btn-dashed-green { border: 1px dashed var(--status-green) !important; }
        .btn-dashed-gold { border: 1px dashed var(--platinum-gold) !important; }

        .platinum-group { display: flex; align-items: center; gap: 10px; border-left: 1px solid #222; padding-left: 10px; }
        .plat-input { background: #000; border: 1px solid #222; color: var(--platinum-gold); width: 75px; padding: 8px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; outline: none; text-align: center; }

        /* ———— БЛОК ТЕКУЩИЙ ЧЕК ———— */
        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); 
            border: 1px dashed var(--neon-purple); 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between;
            min-height: 175px; 
            align-items: flex-start; 
            box-sizing: border-box;
            position: relative;
        }
        
        .cart-info { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }
        
        #cartItems { display: flex; flex-wrap: wrap; gap: 8px; }

        .cart-tag { 
            font-size: 10px; font-family: 'Orbitron'; padding: 6px 30px 6px 10px; 
            border-radius: 4px; display: inline-flex; align-items: center; 
            position: relative; background: rgba(0,0,0,0.3);
        }
        .tag-white { border: 1px solid #fff; color: #fff; }
        .tag-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .tag-red { border: 1px solid var(--artist-red); color: var(--artist-red); }
        .tag-green { border: 1px solid var(--status-green); color: var(--status-green); }
        .tag-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }

        .tag-remove { 
            position: absolute; right: 0; top: 0; bottom: 0; width: 25px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; opacity: 0.5; transition: 0.3s;
        }
        .tag-remove:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        .cart-actions { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 10px; 
            align-self: flex-end;
        }
        
        .total-display-pc { 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 700; 
            font-size: 34px; 
            color: #fff; 
            display: flex;
            justify-content: flex-end;
            align-items: center; 
            height: 42px; 
            width: 155px; 
            margin-bottom: 8px;
            letter-spacing: 1px;
            margin-left: auto; 
            padding-right: 2px;
            box-sizing: border-box;
            line-height: 1;
        }

        .session-controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 320px;
        }

        .input-mini { 
            background: #000; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 0 10px; 
            height: 42px; 
            border-radius: 6px; 
            width: 155px; 
            font-size: 13px; 
            font-family: 'Orbitron';
            outline: none; 
            box-sizing: border-box;
            text-align: center;
        }
        .input-mini::placeholder { color: #444; font-size: 9px; }

        .save-btn { 
            background: var(--status-green); 
            color: #fff; 
            border: none; 
            height: 42px; 
            width: 155px; 
            border-radius: 6px; 
            font-family: 'Orbitron'; 
            font-size: 11px; 
            font-weight: 600;
            cursor: pointer; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .save-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(0, 143, 57, 0.2); }

        /* Таблица отчёта */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff !important; }
        
        .client-name-cell { color: #fff !important; font-weight: 600; font-size: 13px; }
        .services-cell { color: #fff !important; font-size: 11px; }
        .num-cell { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
        .price-cell { color: var(--neon-purple) !important; font-weight: 700; font-size: 15px; }

        .certs-container { flex-grow: 1; height: 300px; overflow-y: auto; padding-right: 15px; }
        .cert-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #111; }
        .cert-id { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--neon-purple); font-size: 14px; letter-spacing: 1px; }

        .filter-info { font-size: 10px; color: #888; margin: 15px 0 10px 0; display: flex; justify-content: space-between; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .reset-link { cursor: pointer; color: #fff; transition: 0.3s; }
        .reset-link:hover { color: var(--neon-purple); }

        /* Аккордеон для мобилы */
        .mobile-details { display: none; padding: 10px; background: #000; border-top: 1px solid #222; }
        .history-row.active .mobile-details { display: block; }

        /* ———— АДАПТИВ ПОД IPHONE SE / МОБИЛКИ ———— */
        @media (max-width: 992px) {
            body { padding: 10px; }
            header { flex-direction: column; gap: 15px; }
            .admin-grid { display: flex; flex-direction: column; }
            
            /* ПОРЯДОК: Календарь -> Услуги -> Чек -> Таблица -> Сертификаты */
            .side-panel { order: 1; width: 100%; }
            .side-panel .calendar-widget { order: 1; }
            .side-panel .certs-section { order: 5; margin-top: 30px; }
            
            .crm-panel { order: 2; width: 100%; background: none; border: none; padding: 0; }
            
            /* Сетка услуг: 2 в ряд */
            .controls-row { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 8px; 
                padding: 10px; 
                order: 2;
            }
            .action-btn { height: 60px; font-size: 10px; width: 100%; box-sizing: border-box; }
            .platinum-group { grid-column: 1/-1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border: none; padding: 0; }
            .plat-input { width: 100%; height: 60px; font-size: 16px; }

            /* Чек */
            .current-session-box { order: 3; flex-direction: column; min-height: auto; padding: 15px; }
            .cart-actions { width: 100%; margin-top: 15px; }
            .total-display-pc { width: 100%; font-size: 40px; height: auto; text-align: center; justify-content: center; }
            .session-controls-row { width: 100%; flex-direction: column; }
            .input-mini, .save-btn { width: 100%; height: 55px; font-size: 14px; }

            /* Таблица как карточки */
            .table-container { order: 4; margin-top: 20px; }
            thead { display: none; }
            .history-row { 
                display: flex; flex-direction: column; 
                background: #0a0a0a; border: 1px solid #222; 
                margin-bottom: 10px; border-radius: 8px; overflow: hidden;
            }
            .history-row td { border: none; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
            .history-row td:nth-child(1) { order: 1; background: #111; font-size: 11px; } /* Дата */
            .history-row td:nth-child(2) { order: 2; font-size: 16px; font-weight: 700; } /* Имя */
            .history-row td:nth-child(4) { order: 3; font-size: 20px; color: var(--neon-purple); border-top: 1px solid #111; } /* Итого */
            .history-row td:nth-child(3) { display: none; } /* Услуги прячем в мобиле (будут в раскрывашке) */
            .history-row td:nth-child(5) { order: 5; justify-content: flex-end; padding-top: 0; } /* Корзина */
            
            /* Кнопка "Развернуть" для мобилы */
            .history-row::after {
                content: 'ПОСМОТРЕТЬ УСЛУГИ ▼';
                display: block; text-align: center; font-size: 9px; color: #444; 
                padding: 10px; background: #050505; cursor: pointer; font-family: 'Orbitron';
            }
            .history-row.active::after { content: 'СВЕРНУТЬ ▲'; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="total-box" style="padding: 5px 15px; text-align: right;">
            <span id="monthTotal" class="income-amount" style="font-size: 20px; display: block;">0 ₽</span>
            <span id="totalLabel" style="font-size:8px; color:#666; display:block; letter-spacing: 1px; text-transform: uppercase;">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="btn-wrapper">
                <button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white')">+ 1 ЧАС</button>
                <div class="btn-tooltip">900 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button>
                <div class="btn-tooltip">3500 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button>
                <div class="btn-tooltip">6000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button>
                <div class="btn-tooltip">1000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green btn-dashed-green" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП. ДОРОЖКА</button>
                <div class="btn-tooltip">500 ₽</div>
            </div>
            
            <div class="platinum-group">
                <input type="number" id="platPrice" class="plat-input" placeholder="Цена">
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold" onclick="addPlatToCart()">+ PLATINUM EDITION</button>
                </div>
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold btn-dashed-gold" onclick="addToCart('ПЛАТ. ДОРОЖКА', 300, 'gold')">+ ПЛАТ. ДОРОЖКА</button>
                    <div class="btn-tooltip">300 ₽</div>
                </div>
            </div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron'; letter-spacing: 1px;">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <div class="session-controls-row">
                    <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>

        <div class="filter-info">
            <span id="currentViewText">ОТЧЕТ ЗА ФЕВРАЛЬ 2026</span>
            <span class="reset-link" onclick="resetFilter()">СБРОСИТЬ</span>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>ДАТА</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th>ИТОГО</th><th></th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
        <button onclick="clearFullHistory()" style="margin-top:40px; background:none; border:none; color:#222; font-size:8px; cursor:pointer; text-transform:uppercase;">Удалить всю историю</button>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName" onclick="filterByMonth()">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="certs-section">
            <h2 style="font-family:'Orbitron'; font-size:14px; margin-bottom:15px; color:#fff;">СЕРТИФИКАТЫ</h2>
            <div class="certs-container" id="certsList"></div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;

    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600' };

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        const monthName = document.getElementById('calMonthName');
        if(!grid || !monthName) return;
        grid.innerHTML = '';
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthName.innerText = `${monthNames[month]} ${year}`;
        
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        let startingSpace = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startingSpace; i++) grid.innerHTML += '<div></div>';
        
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(row => row.date === dateStr);
            let classes = ['day'];
            if (new Date().toLocaleDateString('ru-RU') === dateStr) classes.push('today');
            if (hasData) classes.push('has-data');
            if (selectedDate === dateStr) classes.push('selected-day');
            grid.innerHTML += `<div class="${classes.join(' ')}" onclick="selectCalendarDate('${dateStr}')">${d}</div>`;
        }
        updateMonthTotal();
    }

    function selectCalendarDate(date) {
        selectedDate = date;
        document.getElementById('sessionDateLabel').innerText = `ТЕКУЩИЙ ЧЕК (${date}):`;
        renderCalendar();
        updateTable();
    }

    function changeMonth(dir) { 
        currentCalDate.setMonth(currentCalDate.getMonth() + dir); 
        selectedDate = null;
        updateTable(); 
        renderCalendar(); 
    }

    function resetFilter() { 
        selectedDate = null; 
        currentCalDate = new Date();
        updateTable(); 
        renderCalendar(); 
    }

    function addToCart(name, price, colorClass) {
        currentCart.items.push({ name, colorClass });
        currentCart.details.push({ name, price, colorClass });
        currentCart.total += price;
        renderCart();
    }

    function removeFromCart(index) {
        currentCart.total -= currentCart.details[index].price;
        currentCart.items.splice(index, 1);
        currentCart.details.splice(index, 1);
        renderCart();
    }

    function addPlatToCart() {
        const val = document.getElementById('platPrice').value;
        addToCart('PLATINUM EDITION', parseInt(val) || 10000, 'gold');
        document.getElementById('platPrice').value = '';
    }

    function renderCart() {
        const itemsContainer = document.getElementById('cartItems');
        const totalDisplay = document.getElementById('cartTotal');
        totalDisplay.innerText = currentCart.total + ' ₽';
        itemsContainer.innerHTML = currentCart.items.length === 0 ? 'Пусто...' : '';
        currentCart.items.forEach((item, index) => {
            const tag = document.createElement('div');
            tag.className = `cart-tag tag-${item.colorClass}`;
            tag.innerHTML = `${item.name} <div class="tag-remove" onclick="removeFromCart(${index})">×</div>`;
            itemsContainer.appendChild(tag);
        });
    }

    function saveSession() {
        if (currentCart.items.length === 0) return alert('Добавьте услуги!');
        const name = document.getElementById('clientName').value || 'Без имени';
        crmData.push({ 
            date: selectedDate || new Date().toLocaleDateString('ru-RU'), 
            client: name, 
            services: currentCart.items.map(i => i.name).join(', '), 
            details: [...currentCart.details], 
            total: currentCart.total,
            timestamp: Date.now()
        });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        currentCart = { items: [], details: [], total: 0 };
        document.getElementById('clientName').value = '';
        renderCart(); updateTable(); renderCalendar();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        body.innerHTML = ''; 
        const m = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const monthKey = `.${m}.${currentCalDate.getFullYear()}`;
        
        crmData.sort((a,b) => b.timestamp - a.timestamp).forEach((row) => {
            if (selectedDate && row.date !== selectedDate) return;
            if (!selectedDate && !row.date.includes(monthKey)) return;

            const tr = document.createElement('tr');
            tr.className = 'history-row';
            tr.onclick = function() { this.classList.toggle('active'); };

            let detailsHtml = '<div class="mobile-details">';
            row.details.forEach(d => {
                detailsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px;">
                    <span style="color:${colorMap[d.colorClass]}">${d.name}</span>
                    <span>${d.price} ₽</span>
                </div>`;
            });
            detailsHtml += '</div>';

            tr.innerHTML = `
                <td class="num-cell"><span>ДАТА:</span> ${row.date}</td>
                <td class="client-name-cell"><span>КЛИЕНТ:</span> ${row.client}</td>
                <td class="services-cell">${row.services}${detailsHtml}</td>
                <td class="num-cell price-cell"><span>ИТОГО:</span> ${row.total} ₽</td>
                <td><i class="fas fa-trash" style="color:#333;" onclick="event.stopPropagation(); deleteRow(${crmData.indexOf(row)})"></i></td>
            `;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function updateMonthTotal() {
        const m = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const monthKey = `.${m}.${currentCalDate.getFullYear()}`;
        let total = 0;
        crmData.forEach(row => { if (row.date.includes(monthKey)) total += row.total; });
        document.getElementById('monthTotal').innerText = total.toLocaleString() + ' ₽';
    }

    function deleteRow(index) { if(confirm('Удалить?')) { crmData.splice(index, 1); localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }
    function clearFullHistory() { if(confirm('Удалить всё?')) { crmData = []; localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }

    function updateCerts() {
        const list = document.getElementById('certsList');
        const saved = JSON.parse(localStorage.getItem('spring_certs')) || {};
        list.innerHTML = '';
        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0');
            const data = saved[id] || { active: false, name: '' };
            const div = document.createElement('div');
            div.className = 'cert-row';
            div.innerHTML = `<span class="cert-id">${id}</span>
                ${data.active ? `<span style="font-size:10px; color:#555">${data.name}</span>` : `<input type="text" id="in-${id}" placeholder="Имя" style="width:80px; background:#111; border:1px solid #333; color:#fff; font-size:10px;">`}
                ${data.active ? `<span style="color:#00ff66; border:1px solid #00ff66; padding:2px 5px; font-size:8px;">OK</span>` : `<button onclick="activateCert('${id}')" style="background:var(--neon-purple); border:none; color:#fff; font-size:8px; padding:5px 10px; border-radius:3px;">АКТИВ</button>`}`;
            list.appendChild(div);
        }
    }

    function activateCert(id) {
        const name = document.getElementById('in-' + id).value;
        if (!name) return alert('Имя!');
        const saved = JSON.parse(localStorage.getItem('spring_certs')) || {};
        saved[id] = { active: true, name };
        localStorage.setItem('spring_certs', JSON.stringify(saved));
        updateCerts();
    }

    renderCalendar(); updateTable(); updateCerts();
</script>
</body>
</html>
