<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --text-gray: #b0b0b0;
        }
        body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #111; margin-bottom: 20px; }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--neon-purple); letter-spacing: 2px; font-size: 14px; }
        
        .back-btn { color: #888; text-decoration: none; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #222; padding: 5px 10px; border-radius: 4px; transition: 0.3s; margin-left: 20px; }
        .back-btn:hover { color: #fff; border-color: var(--neon-purple); }

        /* ЕДИНЫЙ СТИЛЬ ДОХОДА (ПК И МОБИЛКА) */
        .total-box { 
            background: var(--neon-purple); 
            padding: 5px 15px; 
            border-radius: 6px; 
            text-align: center;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            min-width: 120px;
            box-shadow: 0 4px 15px rgba(191, 0, 255, 0.2);
        }
        .income-amount { font-family: 'Rajdhani'; font-weight: 700; font-size: 18px; color: #fff; line-height: 1.1; }
        #totalLabel { font-size: 7px; display: block; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.9); margin-top: 1px; font-weight: 600; }

        .admin-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: stretch; }
        .crm-panel, .side-panel { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #111; display: flex; flex-direction: column; }

        /* Календарь */
        .calendar-widget { margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 9px; color: #666; font-weight: bold; padding-bottom: 5px; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green) !important; color: #fff !important; }
        .day.selected-day { border: 1px solid #fff; background: rgba(255,255,255,0.1); }
        .day:hover { background: #111; }

        /* Кнопки услуг */
        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; }
        .btn-wrapper { position: relative; display: inline-block; }
        .action-btn { background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; transition: 0.3s; position: relative; }
        
        .btn-tooltip { 
            visibility: hidden; opacity: 0; position: absolute; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 8px 12px; border-radius: 8px; z-index: 1000; width: auto; white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); transition: opacity 0.3s ease; pointer-events: none;
            font-family: 'Rajdhani'; font-weight: 700; font-size: 14px; bottom: 120%; left: 50%; transform: translateX(-50%);
        }
        .btn-wrapper:hover .btn-tooltip { visibility: visible; opacity: 1; }

        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .btn-dashed-green { border: 1px dashed var(--status-green) !important; }
        .btn-dashed-gold { border: 1px dashed var(--platinum-gold) !important; }

        .platinum-group { display: flex; align-items: center; gap: 10px; border-left: 1px solid #222; padding-left: 10px; }
        .plat-input { background: #000; border: 1px solid #222; color: var(--platinum-gold); width: 75px; padding: 8px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; outline: none; text-align: center; }

        /* Чек */
        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px solid var(--neon-purple); 
            padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; 
            justify-content: space-between; min-height: 175px; align-items: flex-start; position: relative;
        }
        .cart-info { flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; }
        #cartItems { display: flex; flex-wrap: wrap; gap: 8px; }
        .cart-tag { font-size: 10px; font-family: 'Orbitron'; padding: 6px 30px 6px 10px; border-radius: 4px; display: inline-flex; align-items: center; position: relative; background: rgba(0,0,0,0.3); }
        .tag-white { border: 1px solid #fff; color: #fff; }
        .tag-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .tag-red { border: 1px solid var(--artist-red); color: var(--artist-red); }
        .tag-green { border: 1px solid var(--status-green); color: var(--status-green); }
        .tag-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .tag-remove { position: absolute; right: 0; top: 0; bottom: 0; width: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.5; }
        .cart-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; align-self: flex-end; }
        .total-display-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 34px; color: #fff; height: 42px; width: 155px; margin-bottom: 8px; text-align: right; }
        .session-controls-row { display: flex; align-items: center; gap: 10px; width: 320px; }
        .input-mini { background: #000; border: 1px solid #333; color: #fff; padding: 0 10px; height: 42px; border-radius: 6px; width: 155px; font-size: 13px; font-family: 'Orbitron'; text-align: center; outline: none; }
        .save-btn { background: var(--status-green); color: #fff; border: none; height: 42px; width: 155px; border-radius: 6px; font-family: 'Orbitron'; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }

        /* Таблица */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff !important; }
        .price-cell { color: #fff !important; font-weight: 700; font-size: 15px; }

        /* Сертификаты */
        .certs-container { flex-grow: 1; height: 300px; overflow-y: auto; padding-right: 15px; }
        .cert-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #111; }
        .cert-id { font-family: 'Rajdhani'; font-weight: 700; color: var(--neon-purple); font-size: 14px; }

        .filter-info { font-size: 10px; color: #888; margin: 15px 0 10px 0; display: flex; justify-content: space-between; font-weight: 600; text-transform: uppercase; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

        .history-tooltip { 
            visibility: hidden; opacity: 0; position: absolute; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 1000; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); transition: opacity 0.3s ease; pointer-events: none; top: 0; left: 100%;
        }
        .history-row:hover .history-tooltip { visibility: visible; opacity: 1; }

/* ———— МОБИЛЬНАЯ АДАПТАЦИЯ ———— */
        @media (max-width: 992px) {
            body { padding: 10px; }
            header { flex-direction: column; gap: 15px; align-items: center; border-bottom: none; }
            .logo { text-align: center; font-size: 16px; width: 100%; margin-bottom: 5px; }
            
            /* Контейнер для дохода и кнопки на мобилке */
            header div[style*="display: flex"] { 
                flex-direction: column !important; 
                align-items: center !important; 
                gap: 12px !important; 
                width: 100%;
            }

            /* Фиолетовый бокс на мобилке (центровка) */
            .total-box { 
                width: 140px; 
                margin: 0 auto !important; 
            }

            /* Кнопка "Выйти на сайт" строго под доходом */
            .back-btn { 
                margin-left: 0 !important; 
                width: fit-content; 
                text-align: center; 
                margin-top: 0;
            }

            .admin-grid { display: flex !important; flex-direction: column !important; }
            .side-panel { order: 1 !important; width: 100% !important; box-sizing: border-box; }
            .calendar-widget { margin-bottom: 15px; }
            .crm-panel { order: 2 !important; width: 100% !important; background: none; border: none; padding: 0; }
            
            .controls-row { 
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr) !important; 
                gap: 8px !important; 
                padding: 10px !important; 
                margin-bottom: 15px !important; 
                order: 1 !important;
            }
            .btn-wrapper { width: 100%; display: block; }
            .action-btn { width: 100% !important; height: 55px !important; font-size: 9px !important; display: flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
            
            .platinum-group { 
                grid-column: 1 / -1 !important; 
                display: grid !important; 
                grid-template-columns: repeat(2, 1fr) !important; 
                border: none !important; 
                padding: 0 !important; 
                gap: 8px !important; 
                margin-top: 2px;
            }
            .platinum-group .btn-wrapper:last-child { grid-column: 1 / -1 !important; }
            .plat-input { width: 100% !important; height: 55px !important; box-sizing: border-box; }

            .current-session-box { order: 2 !important; flex-direction: column !important; min-height: auto !important; padding: 15px !important; margin-bottom: 15px !important; border: 1px solid var(--neon-purple) !important; }
            .cart-actions { width: 100% !important; margin-top: 15px !important; }
            .total-display-pc { width: 100% !important; text-align: center !important; font-size: 40px !important; margin-bottom: 10px !important; color: #fff !important; }
            .session-controls-row { width: 100% !important; flex-direction: column !important; }
            .input-mini, .save-btn { width: 100% !important; height: 50px !important; }

            .table-container { order: 3 !important; }
            thead { display: none !important; }
            .history-row { display: block !important; border: 1px solid #222 !important; margin-bottom: 10px !important; background: #0a0a0a !important; }
            .history-row td { display: flex !important; justify-content: space-between !important; padding: 10px !important; border-bottom: 1px solid #111 !important; }
            .history-row td::before { content: attr(data-label); font-family: 'Orbitron'; font-size: 8px; color: #555; }
            .services-cell { display: none !important; }
            .history-tooltip { display: none !important; }

            .certs-section { order: 4 !important; height: 350px !important; margin-top: 20px !important; }
            .certs-container { height: 100% !important; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div style="display: flex; align-items: center;">
        <div class="total-box">
            <span id="monthTotal" class="income-amount">0 ₽</span>
            <span id="totalLabel">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="btn-wrapper">
                <button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white')">+ 1 ЧАС</button>
                <div class="btn-tooltip">900 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button>
                <div class="btn-tooltip">3500 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button>
                <div class="btn-tooltip">6000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button>
                <div class="btn-tooltip">1000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green btn-dashed-green" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП. ДОРОЖКА</button>
                <div class="btn-tooltip">500 ₽</div>
            </div>
            
            <div class="platinum-group">
                <input type="number" id="platPrice" class="plat-input" placeholder="Цена">
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold" onclick="addPlatToCart()">+ PLATINUM EDITION</button>
                    <div class="btn-tooltip">База (по умолч. 10к)</div>
                </div>
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold btn-dashed-gold" onclick="addToCart('ПЛАТ. ДОРОЖКА', 300, 'gold')">+ ПЛАТ. ДОРОЖКА</button>
                    <div class="btn-tooltip">300 ₽</div>
                </div>
            </div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron'; letter-spacing: 1px;">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <div class="session-controls-row">
                    <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>

        <div class="filter-info">
            <span id="currentViewText">ОТЧЕТ ЗА ФЕВРАЛЬ 2026</span>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>ДАТА</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th>ИТОГО</th><th></th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
        <button onclick="clearFullHistory()" style="margin-top:40px; background:none; border:none; color:#222; font-size:8px; cursor:pointer; text-transform:uppercase;">Удалить всю историю</button>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName" onclick="filterByMonth()">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="certs-section" style="display:flex; flex-direction:column; flex-grow:1;">
            <h2 style="font-family:'Orbitron'; font-size:14px; margin-bottom:15px; color:#fff;">СЕРТИФИКАТЫ</h2>
            <div class="certs-container" id="certsList"></div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;

    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600' };

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        const monthName = document.getElementById('calMonthName');
        if(!grid || !monthName) return;
        grid.innerHTML = '';
        const now = new Date();
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthName.innerText = `${monthNames[month]} ${year}`;
        
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        let startingSpace = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startingSpace; i++) grid.innerHTML += '<div></div>';
        
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(row => row.date === dateStr);
            const isToday = now.toLocaleDateString('ru-RU') === dateStr;
            let classes = ['day'];
            if (isToday) classes.push('today');
            if (hasData) classes.push('has-data');
            if (selectedDate === dateStr) classes.push('selected-day');
            grid.innerHTML += `<div class="${classes.join(' ')}" onclick="selectCalendarDate('${dateStr}')">${d}</div>`;
        }
        updateMonthTotal();
    }

    function selectCalendarDate(date) {
        selectedDate = date;
        const label = document.getElementById('sessionDateLabel');
        if(label) label.innerText = `ТЕКУЩИЙ ЧЕК (${date}):`;
        renderCalendar();
    }

    function changeMonth(dir) { 
        currentCalDate.setMonth(currentCalDate.getMonth() + dir); 
        selectedDate = null;
        updateTable(); 
        renderCalendar(); 
    }

    function resetFilter() { 
        selectedDate = null; 
        currentCalDate = new Date();
        const label = document.getElementById('sessionDateLabel');
        if(label) label.innerText = `ТЕКУЩИЙ ЧЕК (СЕГОДНЯ):`;
        updateTable(); 
        renderCalendar(); 
    }

    function addToCart(name, price, colorClass) {
        currentCart.items.push({ name, colorClass });
        currentCart.details.push({ name, price, colorClass });
        currentCart.total += price;
        renderCart();
    }

    function removeFromCart(index) {
        currentCart.total -= currentCart.details[index].price;
        currentCart.items.splice(index, 1);
        currentCart.details.splice(index, 1);
        renderCart();
    }

    function addPlatToCart() {
        const val = document.getElementById('platPrice').value;
        const p = parseInt(val) || 10000;
        addToCart('PLATINUM EDITION', p, 'gold');
        document.getElementById('platPrice').value = '';
    }

    function renderCart() {
        const itemsContainer = document.getElementById('cartItems');
        const totalDisplay = document.getElementById('cartTotal');
        if(!itemsContainer || !totalDisplay) return;
        totalDisplay.innerText = currentCart.total + ' ₽';
        itemsContainer.innerHTML = '';
        if (currentCart.items.length === 0) { itemsContainer.innerHTML = 'Пусто...'; return; }
        currentCart.items.forEach((item, index) => {
            const tag = document.createElement('div');
            tag.className = `cart-tag tag-${item.colorClass}`;
            tag.innerHTML = `${item.name}<div class="tag-remove" onclick="removeFromCart(${index})">×</div>`;
            itemsContainer.appendChild(tag);
        });
    }

    function clearCart() {
        currentCart = { items: [], details: [], total: 0 };
        const nameInput = document.getElementById('clientName');
        if (nameInput) nameInput.value = '';
        renderCart();
    }

    function saveSession() {
        if (currentCart.items.length === 0) return alert('Добавьте услуги!');
        const nameInput = document.getElementById('clientName');
        const name = (nameInput && nameInput.value) ? nameInput.value : 'Без имени';
        const dateToSave = selectedDate || new Date().toLocaleDateString('ru-RU');
        crmData.push({ date: dateToSave, client: name, services: currentCart.items.map(i => i.name).join(', '), details: [...currentCart.details], total: currentCart.total, timestamp: Date.now() });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        clearCart(); updateTable(); renderCalendar();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        if(!body) return;
        body.innerHTML = ''; 
        const m = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const y = currentCalDate.getFullYear();
        const monthKey = `.${m}.${y}`;
        const viewText = document.getElementById('currentViewText');
        const calMonthName = document.getElementById('calMonthName');
        if(viewText && calMonthName) viewText.innerText = `ОТЧЕТ ЗА ${calMonthName.innerText}`;

        const sortedData = [...crmData].sort((a,b) => {
            const dateA = a.date.split('.').reverse().join('');
            const dateB = b.date.split('.').reverse().join('');
            return dateA !== dateB ? dateA.localeCompare(dateB) : a.timestamp - b.timestamp;
        });

        sortedData.forEach((row) => {
            if (!row.date.includes(monthKey)) return;
            const tr = document.createElement('tr');
            tr.className = 'history-row';
            let historyTooltipHtml = '<div class="history-tooltip"><div style="color:#888; font-family:Orbitron; font-size:9px; margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:5px;">ДЕТАЛИЗАЦИЯ ЗАКАЗА:</div>';
            if (row.details) {
                row.details.forEach(item => {
                    const sColor = colorMap[item.colorClass] || '#fff';
                    historyTooltipHtml += `<div class="tooltip-item" style="border-left: 2px solid ${sColor}; margin-bottom:5px; padding-left:8px; display:flex; justify-content:space-between;"><span style="color: ${sColor}; font-size:11px; font-weight:600;">${item.name}</span><span style="color:#fff; font-family:Rajdhani; font-weight:700; font-size:13px;">${item.price} ₽</span></div>`;
                });
            }
            historyTooltipHtml += `<div style="text-align:right; margin-top:10px; font-family:Rajdhani; font-weight:700; font-size:16px; color:var(--neon-purple);">ИТОГО: ${row.total} ₽</div></div>`;

            tr.innerHTML = `
                <td class="num-cell" data-label="ДАТА">${row.date}</td>
                <td class="client-name-cell" data-label="КЛИЕНТ">${row.client}</td>
                <td class="services-cell" style="position:relative;">${row.services}${historyTooltipHtml}</td>
                <td class="num-cell price-cell" data-label="ИТОГО">${row.total} ₽</td>
                <td data-label="ДЕЙСТВИЕ"><i class="fas fa-trash" style="color:#222; cursor:pointer; font-size:10px;" onclick="deleteRow(${crmData.indexOf(row)})"></i></td>
            `;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function updateMonthTotal() {
        const monthTotal = document.getElementById('monthTotal');
        if(!monthTotal) return;
        const m = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const y = currentCalDate.getFullYear();
        const monthKey = `.${m}.${y}`;
        let total = crmData.filter(row => row.date.includes(monthKey)).reduce((acc, curr) => acc + curr.total, 0);
        monthTotal.innerText = total.toLocaleString() + ' ₽';
    }

    function deleteRow(index) { if(confirm('Удалить запись?')) { crmData.splice(index, 1); localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }
    function clearFullHistory() { if(confirm('Удалить ВСЕ данные?')) { crmData = []; localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }

    function updateCerts() {
        const list = document.getElementById('certsList');
        if(!list) return;
        const savedCerts = JSON.parse(localStorage.getItem('spring_certs')) || {};
        list.innerHTML = '';
        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0');
            const data = savedCerts[id] || { active: false, name: '' };
            const div = document.createElement('div');
            div.className = 'cert-row';
            div.innerHTML = `<span class="cert-id">${id}</span>${data.active ? `<span style="font-size:10px; color:#555">${data.name}</span>` : `<input type="text" id="in-${id}" style="background:#111; border:1px solid #222; color:#fff; padding:4px; font-size:10px; width:90px; outline:none;" placeholder="Имя">`}${data.active ? `<span style="font-size:8px; color:#00ff66; border:1px solid #00ff66; padding:2px 5px; border-radius:3px;">OK</span>` : `<button onclick="activateCert('${id}')" style="background:var(--neon-purple); border:none; color:#fff; font-size:8px; padding:4px 8px; border-radius:3px; cursor:pointer;">АКТИВ</button>`}`;
            list.appendChild(div);
        }
    }

    function activateCert(id) {
        const input = document.getElementById('in-' + id);
        const name = input ? input.value : '';
        if (!name) return alert('Введите имя!');
        const savedCerts = JSON.parse(localStorage.getItem('spring_certs')) || {};
        savedCerts[id] = { active: true, name: name };
        localStorage.setItem('spring_certs', JSON.stringify(savedCerts));
        updateCerts();
    }

    renderCalendar(); updateTable(); updateCerts();
</script>
</body>
</html>
