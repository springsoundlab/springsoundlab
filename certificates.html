<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --text-gray: #b0b0b0;
        }
        body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #111; margin-bottom: 20px; }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--neon-purple); letter-spacing: 2px; font-size: 14px; }
        .back-btn { color: #888; text-decoration: none; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #222; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .back-btn:hover { color: #fff; border-color: var(--neon-purple); }

        .admin-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: start; }
        .crm-panel, .side-panel { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #111; }

        /* Календарь - Цвета обновлены */
        .calendar-widget { margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 9px; color: #666; font-weight: bold; padding-bottom: 5px; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        
        .day.today { background: var(--neon-purple) !important; color: #fff !important; }
        .day.has-data { background: var(--status-green); color: #fff; }
        .day.active-filter { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .day:hover { background: #111; color: #fff; }

        /* Кнопки услуг */
        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; }
        .btn-wrapper { position: relative; display: inline-block; }
        .action-btn { background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; transition: 0.3s; position: relative; }
        
        /* Задержка появления для всех тултипов */
        .btn-tooltip, .session-tooltip, .history-tooltip { 
            visibility: hidden; opacity: 0; position: absolute; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 1000; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            transition: opacity 0.3s ease; pointer-events: none; 
        }

        .btn-wrapper:hover .btn-tooltip, 
        .current-session-box:hover .session-tooltip,
        .history-row:hover .history-tooltip { 
            visibility: visible; opacity: 1; transition-delay: 0.6s; 
        }

        .btn-tooltip { bottom: 120%; left: 50%; transform: translateX(-50%); width: auto; padding: 5px 10px; }

        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .btn-dashed-green { border: 1px dashed var(--status-green) !important; }
        .btn-dashed-gold { border: 1px dashed var(--platinum-gold) !important; }

        .platinum-group { display: flex; align-items: center; gap: 10px; border-left: 1px solid #222; padding-left: 10px; }
        .plat-input { background: #000; border: 1px solid #222; color: var(--platinum-gold); width: 75px; padding: 8px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; outline: none; text-align: center; }

        /* ЧЕК */
        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px dashed var(--neon-purple); padding: 15px; border-radius: 8px; 
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;
        }
        .session-tooltip { top: 100%; left: 20px; }

        /* История и Таблица */
        .history-row { position: relative; }
        .history-tooltip { top: 10%; right: 100%; margin-right: 20px; }

        .cart-tag { font-size: 8px; font-family: 'Orbitron'; padding: 2px 6px; border-radius: 3px; margin-right: 5px; display: inline-block; }
        .tag-white { border: 1px solid #fff; color: #fff; }
        .tag-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .tag-red { border: 1px solid var(--artist-red); color: var(--artist-red); }
        .tag-green { border: 1px solid var(--status-green); color: var(--status-green); }
        .tag-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }

        .tooltip-item { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; border-bottom: 1px solid #1a1a1a; padding: 4px 0 4px 8px; }

        .total-box { background: rgba(191, 0, 255, 0.1); padding: 10px 20px; border: 1px solid var(--neon-purple); border-radius: 8px; text-align: right; }
        .month-total-text { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: var(--neon-purple); font-size: 26px; display: block; line-height: 1; }

        .table-container { min-height: 400px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #888; font-family: 'Orbitron', sans-serif; font-size: 10px; padding: 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #ffffff !important; font-family: 'Inter', sans-serif; }
        
        .num-cell { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
        .price-cell { color: #ffffff !important; font-weight: 700; font-size: 15px; }

        .input-mini { background: #111; border: 1px solid #222; color: #fff; padding: 8px; font-size: 11px; width: 150px; outline: none; border-radius: 4px; }
        .save-btn { background: var(--status-green); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; font-family: 'Orbitron'; transition: 0.3s; }
        
        .certs-container { height: 300px; overflow-y: auto; padding-top: 10px; padding-right: 15px; }
        .cert-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #111; }
        .cert-id { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #fff; font-size: 14px; letter-spacing: 1px; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }
        
        .filter-info { font-size: 10px; color: #888; margin-bottom: 10px; display: flex; justify-content: space-between; font-weight: 600; }
        .reset-link { cursor: pointer; color: #fff; transition: 0.3s; }
        .reset-link:hover { color: var(--neon-purple); }
    </style>
</head>
<body>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="total-box" style="padding: 5px 15px;">
            <span id="monthTotal" class="month-total-text">0 ₽</span>
            <span id="totalLabel" style="font-size:8px; color:#666; display:block; letter-spacing: 1px;">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="btn-wrapper">
                <button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white')">+ 1 ЧАС</button>
                <div class="btn-tooltip">900 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button>
                <div class="btn-tooltip">3500 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button>
                <div class="btn-tooltip">6000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button>
                <div class="btn-tooltip">1000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green btn-dashed-green" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП. ДОРОЖКА</button>
                <div class="btn-tooltip">500 ₽</div>
            </div>
            
            <div class="platinum-group">
                <input type="number" id="platPrice" class="plat-input" placeholder="Цена">
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold" onclick="addPlatToCart()">+ PLATINUM EDITION</button>
                    <div class="btn-tooltip">База (по умолч. 10к)</div>
                </div>
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold btn-dashed-gold" onclick="addToCart('ПЛАТ. ДОРОЖКА', 300, 'gold')">+ ПЛАТ. ДОРОЖКА</button>
                    <div class="btn-tooltip">300 ₽</div>
                </div>
            </div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div id="sessionTooltip" class="session-tooltip"></div>
            <div>
                <div style="font-size: 9px; color: #fff; margin-bottom: 7px; font-family:'Orbitron'">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems" style="display:flex; align-items:center; flex-wrap:nowrap; gap:2px; overflow:hidden;">Пусто...</div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                <div style="text-align:right">
                    <span id="cartTotal" style="font-family:'Rajdhani'; font-weight:700; font-size:24px; color:#fff; display:block; line-height:1;">0 ₽</span>
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                </div>
                <i class="fas fa-times" style="cursor:pointer; color:#444; padding: 10px;" onclick="clearCart()"></i>
            </div>
        </div>

        <div class="filter-info">
            <span id="currentViewText">ЗАПИСИ ЗА ФЕВРАЛЬ 2026</span>
            <span class="reset-link" onclick="resetFilter()">СБРОСИТЬ ФИЛЬТР</span>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>ДАТА</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th>ИТОГО</th><th></th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
        <button onclick="clearFullHistory()" style="margin-top:40px; background:none; border:none; color:#222; font-size:8px; cursor:pointer; text-transform:uppercase;">Удалить всю историю</button>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName" onclick="filterByMonth()">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="certs-section">
            <h2 style="font-family:'Orbitron'; font-size:14px; margin-bottom:15px; color:#fff;">СЕРТИФИКАТЫ</h2>
            <div class="certs-container" id="certsList"></div>
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0 };
    let currentCalDate = new Date();
    let filterDate = null; // null = весь текущий месяц

    const colorMap = {
        white: '#fff',
        purple: '#bf00ff',
        red: '#cc0000',
        green: '#008f39',
        gold: '#b89600'
    };

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        const monthName = document.getElementById('calMonthName');
        grid.innerHTML = '';
        const now = new Date();
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        monthName.innerText = `${monthNames[month]} ${year}`;
        
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        
        let startingSpace = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startingSpace; i++) grid.innerHTML += '<div></div>';
        
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(row => row.date === dateStr);
            const isToday = now.toLocaleDateString('ru-RU') === dateStr;
            let classes = ['day'];
            if (isToday) classes.push('today');
            if (hasData) classes.push('has-data');
            if (filterDate === dateStr) classes.push('active-filter');
            grid.innerHTML += `<div class="${classes.join(' ')}" onclick="filterByDay('${dateStr}')">${d}</div>`;
        }
        updateMonthTotal();
    }

    function changeMonth(dir) { 
        currentCalDate.setMonth(currentCalDate.getMonth() + dir); 
        filterDate = null; // Сбрасываем фильтр по дню при смене месяца
        updateTable(); 
        renderCalendar(); 
    }

    function filterByDay(date) { 
        filterDate = date; 
        document.getElementById('currentViewText').innerText = `ЗАПИСИ ЗА ${date}`; 
        updateTable(); 
        renderCalendar(); 
    }

    function filterByMonth() {
        filterDate = null;
        updateTable();
        renderCalendar();
    }

    function resetFilter() { 
        filterDate = null; 
        currentCalDate = new Date();
        updateTable(); 
        renderCalendar(); 
    }

    function addToCart(name, price, colorClass) {
        currentCart.items.push({ name, colorClass });
        currentCart.details.push({ name, price, colorClass });
        currentCart.total += price;
        renderCart();
    }

    function addPlatToCart() {
        const val = document.getElementById('platPrice').value;
        const p = parseInt(val) || 10000;
        addToCart('PLATINUM EDITION', p, 'gold');
        document.getElementById('platPrice').value = '';
    }

    function renderCart() {
        const tooltip = document.getElementById('sessionTooltip');
        const itemsContainer = document.getElementById('cartItems');
        
        if (currentCart.items.length > 0) {
            itemsContainer.innerHTML = '';
            currentCart.items.forEach(item => {
                itemsContainer.innerHTML += `<span class="cart-tag tag-${item.colorClass}">${item.name}</span>`;
            });

            document.getElementById('cartTotal').innerText = currentCart.total + ' ₽';
            
            tooltip.innerHTML = '<div style="color:#fff; font-family:Orbitron; font-size:10px; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">ДЕТАЛИЗАЦИЯ:</div>';
            currentCart.details.forEach(item => {
                tooltip.innerHTML += `
                <div class="tooltip-item" style="border-left: 2px solid ${colorMap[item.colorClass]}">
                    <span style="color: ${colorMap[item.colorClass]}">${item.name}</span>
                    <span style="color:#fff; font-family:Rajdhani; font-weight:700; font-size:14px;">${item.price} ₽</span>
                </div>`;
            });
            tooltip.innerHTML += `<div style="text-align:right; margin-top:10px; font-family:Rajdhani; font-weight:700; font-size:16px; color:#fff;">СУММА: ${currentCart.total} ₽</div>`;
        } else {
            itemsContainer.innerText = 'Пусто...';
            document.getElementById('cartTotal').innerText = '0 ₽';
            tooltip.innerHTML = '';
        }
    }

    function clearCart() {
        currentCart = { items: [], details: [], total: 0 };
        document.getElementById('clientName').value = '';
        renderCart();
    }

    function saveSession() {
        if (currentCart.items.length === 0) return alert('Добавьте услуги!');
        const name = document.getElementById('clientName').value || 'Без имени';
        const date = new Date().toLocaleDateString('ru-RU');
        const servicesText = currentCart.items.map(i => i.name).join(', ');
        
        crmData.unshift({ 
            date, 
            client: name, 
            services: servicesText, 
            details: [...currentCart.details], // Копируем детали для истории
            total: currentCart.total 
        });
        
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        clearCart(); updateTable(); renderCalendar();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        body.innerHTML = ''; 
        
        // Определяем фильтр месяца/года
        const m = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const y = currentCalDate.getFullYear();
        const monthKey = `.${m}.${y}`;
        
        if (!filterDate) {
            document.getElementById('currentViewText').innerText = `ЗАПИСИ ЗА ${document.getElementById('calMonthName').innerText}`;
        }

        crmData.forEach((row, index) => {
            // Если выбран конкретный день
            if (filterDate && row.date !== filterDate) return;
            // Если выбран месяц (по умолчанию)
            if (!filterDate && !row.date.includes(monthKey)) return;

            const tr = document.createElement('tr');
            tr.className = 'history-row';
            
            // Формируем тултип для истории
            let historyTooltipHtml = '<div class="history-tooltip">';
            historyTooltipHtml += '<div style="color:#fff; font-family:Orbitron; font-size:10px; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">ДЕТАЛИЗАЦИЯ ЗАКАЗА:</div>';
            
            if (row.details) {
                row.details.forEach(item => {
                    historyTooltipHtml += `
                    <div class="tooltip-item" style="border-left: 2px solid ${colorMap[item.colorClass] || '#fff'}">
                        <span style="color: ${colorMap[item.colorClass] || '#fff'}">${item.name}</span>
                        <span style="color:#fff; font-family:Rajdhani; font-weight:700; font-size:14px;">${item.price} ₽</span>
                    </div>`;
                });
            } else {
                historyTooltipHtml += '<div style="font-size:10px; color:#666">Старая запись (без деталей)</div>';
            }
            historyTooltipHtml += `<div style="text-align:right; margin-top:10px; font-family:Rajdhani; font-weight:700; font-size:16px; color:#fff;">ИТОГО: ${row.total} ₽</div></div>`;

            tr.innerHTML = `
                <td class="num-cell">${row.date}</td>
                <td style="font-weight:600">${row.client}</td>
                <td style="font-size:11px; color:#ccc; position:relative;">${row.services}${historyTooltipHtml}</td>
                <td class="num-cell price-cell">${row.total} ₽</td>
                <td><i class="fas fa-trash" style="color:#222; cursor:pointer; font-size:10px;" onclick="deleteRow(${index})"></i></td>
            `;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function updateMonthTotal() {
        const monthTotal = document.getElementById('monthTotal');
        const month = String(currentCalDate.getMonth() + 1).padStart(2, '0');
        const year = currentCalDate.getFullYear();
        const monthKey = `.${month}.${year}`;
        let totalForMonth = 0;
        crmData.forEach(row => { if (row.date.includes(monthKey)) { totalForMonth += row.total; } });
        monthTotal.innerText = totalForMonth.toLocaleString() + ' ₽';
    }

    function deleteRow(index) { if(confirm('Удалить?')) { crmData.splice(index, 1); localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }
    function clearFullHistory() { if(confirm('Удалить ВСЕ данные?')) { crmData = []; localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }

    function updateCerts() {
        const list = document.getElementById('certsList');
        const savedCerts = JSON.parse(localStorage.getItem('spring_certs')) || {};
        list.innerHTML = '';
        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0');
            const data = savedCerts[id] || { active: false, name: '' };
            const div = document.createElement('div');
            div.className = 'cert-row';
            div.innerHTML = `<span class="cert-id">${id}</span>${data.active ? `<span style="font-size:10px; color:#555">${data.name}</span>` : `<input type="text" id="in-${id}" style="background:#111; border:1px solid #222; color:#fff; padding:4px; font-size:10px; width:90px; outline:none;" placeholder="Имя">`}${data.active ? `<span style="font-size:8px; color:#00ff66; border:1px solid #00ff66; padding:2px 5px; border-radius:3px;">OK</span>` : `<button onclick="activateCert('${id}')" style="background:var(--neon-purple); border:none; color:#fff; font-size:8px; padding:4px 8px; border-radius:3px; cursor:pointer;">АКТИВ</button>`}`;
            list.appendChild(div);
        }
    }

    function activateCert(id) {
        const name = document.getElementById('in-' + id).value;
        if (!name) return alert('Имя!');
        const savedCerts = JSON.parse(localStorage.getItem('spring_certs')) || {};
        savedCerts[id] = { active: true, name: name };
        localStorage.setItem('spring_certs', JSON.stringify(savedCerts));
        updateCerts();
    }

    renderCalendar(); updateTable(); updateCerts();
</script>
</body>
</html>
