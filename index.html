<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WEYTON Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 40px;
        }

        /* Твоя неизменная подсветка пакетов услуг */
        .service-package {
            padding: 20px;
            margin: 10px 0;
            border: 1px solid #444;
            background-color: #252525;
            transition: 0.3s;
        }
        .service-package:hover {
            background-color: #333;
            border-color: #666;
        }

        /* Подсветка номера телефона при наведении */
        .phone-number {
            display: inline-block;
            transition: color 0.3s ease;
            cursor: pointer;
            font-weight: bold;
        }
        .phone-number:hover {
            color: #ffcc00; /* Цвет подсветки номера */
        }

        /* НОВОЕ: Анимация для Локации и Связи */
        .location-link, .contact-link {
            display: inline-block;
            transition: all 0.3s ease;
            cursor: pointer;
            color: #ffffff;
            text-decoration: none;
        }

        .location-link:hover, .contact-link:hover {
            color: #00e5ff; /* Прикольный неоновый голубой */
            transform: translateY(-3px) scale(1.05); /* Легкое всплытие */
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6); /* Мягкое свечение */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Проект: WEYTON</h1>

    <div class="service-package">
        <h3>Пакет услуг "Стандарт"</h3>
        <p>Описание тарифа с твоей постоянной подсветкой.</p>
    </div>

    <p>Где мы находимся: <span class="location-link">Локация</span></p>
    <p>Как нас найти: <span class="contact-link">Связь</span></p>

    <p>Наш телефон: <span class="phone-number">+7 (999) 000-00-00</span></p>
</div>

</body>
</html>
