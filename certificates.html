<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA-FIX | SPRING SOUND LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #bf00ff; --red: #ff4d4d; --green: #00ff88; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        
        .history-card { 
            background: #0a0a0a; border: 1px solid #222; padding: 20px; 
            margin-bottom: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .client-info { display: flex; flex-direction: column; gap: 5px; }
        .client-name { font-family: 'Orbitron'; color: var(--neon); }

        .btn-group { display: flex; gap: 10px; }

        /* Кнопки теперь БЕЗ системных окон */
        .btn { 
            padding: 12px 20px; border-radius: 8px; border: none; 
            font-family: 'Orbitron'; font-size: 10px; cursor: pointer; 
            transition: 0.2s; text-transform: uppercase;
        }
        .btn-pay { background: var(--green); color: #000; font-weight: bold; }
        .btn-del { background: var(--red); color: white; }
        .btn:active { transform: scale(0.9); background: white; color: black; }

        /* МОДАЛЬНОЕ ОКНО (Встроенное в страницу) */
        #customModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111; border: 2px solid var(--neon); padding: 30px; border-radius: 15px;
            z-index: 10000; box-shadow: 0 0 50px rgba(191, 0, 255, 0.5); width: 300px; text-align: center;
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999;
        }
        .modal-input {
            width: 100%; background: #000; border: 1px solid #444; color: white;
            padding: 12px; margin: 15px 0; border-radius: 5px; text-align: center; font-size: 18px;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

    <h2 style="font-family:'Orbitron'; text-align:center;">БЕЗОПАСНЫЙ РЕЖИМ УПРАВЛЕНИЯ</h2>
    <div id="historyContainer"></div>

    <div id="modalOverlay" class="modal-overlay"></div>
    <div id="customModal">
        <h3 id="modalTitle" style="margin-top:0; font-family:'Orbitron'; font-size:14px;">ВНЕСТИ ДОПЛАТУ</h3>
        <input type="number" id="modalInput" class="modal-input" placeholder="Сумма">
        <div class="modal-actions">
            <button class="btn" style="background:#333; color:white;" onclick="closeModal()">ОТМЕНА</button>
            <button id="modalConfirmBtn" class="btn btn-pay">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <script>
        let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [
            {client: "ТЕСТ ГЕЙМ", total: 1500, services: "START EDITION", date: "13.02.2026", id: 1}
        ];
        let currentEditingIndex = -1;

        function render() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';
            
            crmData.forEach((row, index) => {
                const div = document.createElement('div');
                div.className = 'history-card';
                div.innerHTML = `
                    <div class="client-info">
                        <span class="client-name">${row.client}</span>
                        <span style="font-size:12px; color:#666;">${row.services} | ${row.date}</span>
                        <span style="font-size:18px; font-weight:bold;">${row.total} ₽</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-pay" onclick="openPayModal(${index})">ДОПЛАТА</button>
                        <button class="btn btn-del" onclick="handleDelete(${index})">УДАЛИТЬ</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Логика доплаты через НАШЕ окно
        function openPayModal(index) {
            currentEditingIndex = index;
            document.getElementById('modalTitle').innerText = "ДОПЛАТА ДЛЯ: " + crmData[index].client;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('customModal').style.display = 'block';
            
            // Назначаем действие кнопке сохранения
            document.getElementById('modalConfirmBtn').onclick = function() {
                const amount = parseInt(document.getElementById('modalInput').value);
                if(amount > 0) {
                    crmData[currentEditingIndex].total += amount;
                    saveAndRefresh();
                    closeModal();
                } else {
                    alert("Введите сумму!");
                }
            };
        }

        // Логика удаления (пока сделаем прямое удаление без подтверждения, чтобы точно работало)
        function handleDelete(index) {
            // Если даже тут не сработает - значит скрипт падает на ошибке
            crmData.splice(index, 1);
            saveAndRefresh();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('customModal').style.display = 'none';
        }

        function saveAndRefresh() {
            localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
            render();
        }

        // Старт
        render();
    </script>
</body>
</html>
