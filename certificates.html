<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; 
            --bg-dark: #050505; 
            --card-bg: #0a0a0a; 
            --status-green: #008f39; 
            --artist-red: #cc0000; 
            --platinum-gold: #b89600;
            --azure-blue: #00ccff; 
            --text-gray: #b0b0b0;
        }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            padding: 0 0 20px 0; 
            border-bottom: 1px solid #111; 
            flex-shrink: 0; 
        }

        .logo { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-purple); 
            letter-spacing: 2px; 
            font-size: 14px; 
            padding-top: 15px;
        }
        
        .header-right-zone {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .total-box { 
            background: var(--neon-purple); 
            height: 70px;
            border-radius: 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(191, 0, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .income-amount { 
            font-family: 'Rajdhani'; 
            font-weight: 700; 
            font-size: 32px; 
            color: #fff; 
            line-height: 1;
            transition: 0.3s;
        }
        #totalLabel { 
            font-size: 9px; 
            display: block; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: rgba(255,255,255,0.8); 
            margin-top: 5px; 
            font-weight: 600; 
            font-family: 'Orbitron';
        }

        .unlock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 4px;
            color: #fff;
            background: rgba(191, 0, 255, 0.1);
            pointer-events: none;
            z-index: 2;
            transition: 0.3s;
        }

        .privacy-blur { filter: blur(15px); opacity: 0.3; }
        .privacy-active .privacy-blur { filter: blur(0); opacity: 1; }
        .privacy-active .unlock-overlay { opacity: 0; visibility: hidden; }

        .back-btn { 
            color: #555; 
            text-decoration: none; 
            font-size: 9px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border: 1px solid #1a1a1a; 
            padding: 12px; 
            border-radius: 8px; 
            transition: 0.3s; 
            text-align: center;
            font-family: 'Orbitron';
            background: rgba(255,255,255,0.02);
        }

        .admin-grid { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            flex-grow: 1; 
            overflow: hidden; 
            margin-top: 20px;
        }

        .crm-panel, .side-panel { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #111; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        .table-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 99999; backdrop-filter: blur(5px);
        }
        .custom-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0a0a; border: 1px solid var(--neon-purple); padding: 25px; border-radius: 15px;
            z-index: 100000; box-shadow: 0 0 40px rgba(191, 0, 255, 0.3); width: 320px; text-align: center;
        }
        .modal-title { font-family: 'Orbitron'; font-size: 11px; margin-bottom: 15px; color: #fff; letter-spacing: 1px; }
        .modal-input {
            width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 12px;
            margin-bottom: 20px; border-radius: 6px; font-family: 'Rajdhani'; font-size: 20px; text-align: center; outline: none; box-sizing: border-box;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .m-btn { padding: 10px 15px; border-radius: 6px; font-family: 'Orbitron'; font-size: 9px; cursor: pointer; text-transform: uppercase; border: none; flex: 1; }
        .m-confirm { background: var(--status-green); color: #fff; }
        .m-cancel { background: #222; color: #888; }
        .m-delete { background: var(--artist-red); color: #fff; }

        .certs-dropdown {
            margin-bottom: 20px; border: 1px solid #222; border-radius: 10px; overflow: hidden;
            flex-shrink: 0; background: #000;
        }
        .certs-header {
            background: #000; padding: 12px 15px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer;
        }
        .certs-header h2 {
            font-family: 'Orbitron'; font-size: 11px; margin: 0; color: var(--neon-purple);
            letter-spacing: 2px; text-transform: uppercase;
        }
        .certs-content { display: none; max-height: 350px; overflow-y: auto; padding: 0 15px 15px 15px; border-top: 1px solid #111; }
        .certs-dropdown.active .certs-content { display: block; }

        .calendar-widget { flex-shrink: 0; margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; color: #fff; font-family: 'Rajdhani'; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green); }

        .controls-row { 
            display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; 
            border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-shrink: 0; overflow-x: auto;
        }
        
        .action-btn { 
            background: transparent; color: #fff; padding: 10px 15px; border-radius: 6px; 
            cursor: pointer; font-size: 9px; font-family: 'Orbitron'; transition: 0.3s; white-space: nowrap;
        }
        
        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); }
        .btn-blue { border: 1px solid var(--azure-blue); color: var(--azure-blue); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }

        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px solid var(--neon-purple); 
            padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; 
            justify-content: space-between; align-items: flex-start; flex-shrink: 0;
        }

        /* --- ВЕРНУЛ ВИЗУАЛ ТАБЛИЦЫ ДЛЯ ПК --- */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 13px; table-layout: fixed; }
        th { text-align: left; color: #444; font-family: 'Orbitron'; font-size: 9px; padding: 10px 15px; text-transform: uppercase; letter-spacing: 1px; }
        td { background: rgba(255,255,255,0.02); padding: 15px; color: #fff; border-top: 1px solid rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.03); }
        td:first-child { border-left: 1px solid rgba(255,255,255,0.03); border-radius: 8px 0 0 8px; }
        td:last-child { border-right: 1px solid rgba(255,255,255,0.03); border-radius: 0 8px 8px 0; }

        .row-date-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 16px; color: var(--neon-purple); }
        .row-client-pc { font-weight: 600; font-size: 14px; }
        .row-price-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 18px; text-align: right; }

        .history-tooltip { 
            visibility: hidden; opacity: 0; position: fixed; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 9999; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            pointer-events: none; transition: opacity 0.4s ease;
        }
        .history-tooltip.active { visibility: visible; opacity: 1; }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ (ОБНОВЛЕННАЯ) --- */
        @media (max-width: 992px) {
            body { overflow-y: auto; height: auto; padding: 10px; }
            .admin-grid { display: flex !important; flex-direction: column !important; }
            .side-panel { order: 1 !important; width: 100% !important; }
            .crm-panel { order: 2 !important; width: 100% !important; background: none; border: none; padding: 0; }
            
            table, thead, tbody, th, td, tr { display: block; width: 100% !important; }
            thead { display: none; }
            
            tr { 
                background: #0a0a0a; border: 1px solid #111; margin-bottom: 12px; 
                border-radius: 12px; padding: 15px; box-sizing: border-box;
            }
            
            td { 
                background: none; border: none !important; padding: 0 !important; 
                margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; 
            }

            /* ДАТА БЕЛЫМ (ТЕЛЕФОН) */
            .row-date { 
                font-family: 'Rajdhani'; font-weight: 700; font-size: 24px !important; 
                color: #ffffff !important; border-bottom: 1px solid #222 !important; 
                padding-bottom: 8px !important; margin-bottom: 10px !important; width: 100%;
            }

            /* ИМЯ КЛИЕНТА */
            .row-client { 
                font-family: 'Inter'; font-weight: 600; font-size: 20px !important; 
                color: #fff !important; margin-bottom: 8px;
            }
            
            /* ВРЕМЯ БЕЛЫМ НАД ШКАЛОЙ */
            .row-time-progress { display: block !important; margin-bottom: 0px !important; }
            .row-time-progress .time-val { 
                font-family: 'Rajdhani'; font-weight: 700; font-size: 16px; 
                color: #ffffff !important; margin-bottom: 2px; display: block; 
            }
            .progress-container { margin-top: 2px; height: 3px; margin-bottom: 5px; }

            /* УСЛУГИ */
            .services-cell { 
                display: block !important; font-size: 11px !important; 
                color: #888 !important; margin-bottom: 0 !important;
                padding-bottom: 0 !important;
            }
            
            .row-price { font-size: 18px; font-family: 'Rajdhani'; font-weight: 700; padding-top: 5px !important; }

            /* КНОПКИ ПРИЖАТЫ МАКСИМАЛЬНО БЛИЗКО К УСЛУГАМ */
            .action-icons-wrap { 
                display: flex !important; gap: 8px !important; 
                margin-top: 5px !important; /* Минимальный отступ */
                padding-top: 5px !important; 
                border-top: 1px solid #111 !important; 
            }
            .icon-btn-box { 
                flex: 1 !important; flex-direction: row !important; background: #080808 !important; 
                padding: 10px !important; border-radius: 6px !important; 
                justify-content: center !important; gap: 8px !important; border: 1px solid #1a1a1a !important; 
            }
        }
    </style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="customModal" class="custom-modal">
    <div id="modalTitle" class="modal-title">ДОПЛАТА</div>
    <input type="number" id="modalInput" class="modal-input" placeholder="0">
    <div class="modal-btns">
        <button class="m-btn m-cancel" onclick="closeModal()">ОТМЕНА</button>
        <button id="modalConfirmBtn" class="m-btn m-confirm">ГОТОВО</button>
    </div>
</div>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div class="header-right-zone">
        <div class="total-box" onclick="checkPrivacyPassword()">
            <div class="unlock-overlay">CLICK TO UNLOCK</div>
            <span id="monthTotal" class="income-amount privacy-blur">0 ₽</span>
            <span id="totalLabel">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="btn-wrapper"><button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white', true)">+ 1 ЧАС</button></div>
            <div class="btn-wrapper"><button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button></div>
            <div class="btn-wrapper"><button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button></div>
            <div class="btn-wrapper"><button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button></div>
            <div class="btn-wrapper"><button class="action-btn btn-blue" onclick="openPriceModal('АРАНЖИРОВКА', 'blue', 10000)">АРАНЖИРОВКА</button></div>
            <div class="btn-wrapper"><button class="action-btn btn-gold" onclick="openPriceModal('PLATINUM EDITION', 'gold', 10000)">PLATINUM EDITION</button></div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron';">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div id="cartTotal" style="font-family:'Rajdhani'; font-size:34px; font-weight:700; margin-bottom:10px;">0 ₽</div>
                <button class="save-btn" style="background:var(--status-green); color:#fff; border:none; padding:10px 30px; border-radius:6px; font-family:'Orbitron'; cursor:pointer;" onclick="saveSession()">СОХРАНИТЬ</button>
            </div>
        </div>

        <div class="table-scroll-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:100px">Дата</th>
                        <th style="width:180px">Клиент</th>
                        <th>Услуги</th>
                        <th style="width:120px; text-align:right">Внесено</th>
                        <th style="width:130px; text-align:right">Действия</th>
                    </tr>
                </thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" onclick="changeMonth(-1)" style="cursor:pointer"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" onclick="changeMonth(1)" style="cursor:pointer"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>
        <div class="certs-dropdown" id="certsDropdown">
            <div class="certs-header" onclick="toggleCerts()"><h2>СЕРТИФИКАТЫ</h2><i class="fas fa-chevron-down"></i></div>
            <div class="certs-content" id="certsList"></div>
        </div>
        <div style="background:#000; border:1px solid #222; border-radius:10px; padding:15px;">
            <input type="text" id="bookingTime" style="width:45%; background:#080808; border:1px solid #222; color:#fff; padding:8px; border-radius:6px; font-family:'Orbitron'; font-size:11px;" placeholder="00:00">
            <input type="text" id="bookingClient" style="width:45%; background:#080808; border:1px solid #222; color:#fff; padding:8px; border-radius:6px; font-family:'Orbitron'; font-size:11px;" placeholder="ИМЯ">
        </div>
    </div>
</div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0, fullPriceTotal: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;
    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600', blue: '#00ccff' };

    function toggleCerts() { document.getElementById('certsDropdown').classList.toggle('active'); }

    function openModal(title, type, confirmCallback, defaultValue = '') {
        const modal = document.getElementById('customModal');
        const overlay = document.getElementById('modalOverlay');
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalInput').value = defaultValue;
        document.getElementById('modalConfirmBtn').onclick = confirmCallback;
        modal.style.display = 'block'; overlay.style.display = 'block';
    }

    function closeModal() { document.getElementById('customModal').style.display = 'none'; document.getElementById('modalOverlay').style.display = 'none'; }

    function openPriceModal(name, color, defaultPrice) {
        openModal(`СТОИМОСТЬ: ${name}`, "price", function() {
            const p = parseInt(document.getElementById('modalInput').value);
            if(!isNaN(p)) { addToCart(name, p, color); closeModal(); }
        }, defaultPrice);
    }

    function checkPrivacyPassword() {
        openModal("ПАРОЛЬ", "pass", function() {
            if(document.getElementById('modalInput').value === '123') {
                document.body.classList.add('privacy-active'); updateTable(); closeModal();
            }
        });
    }

    function addToCart(name, price, colorClass) {
        currentCart.details.push({ name, price, basePrice: price, colorClass });
        currentCart.items.push({ name, colorClass });
        currentCart.total += price;
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        container.innerHTML = currentCart.items.map((item, i) => `<div class="cart-tag tag-${item.colorClass}">${item.name}</div>`).join('');
        document.getElementById('cartTotal').innerText = currentCart.total + ' ₽';
    }

    function saveSession() {
        const date = selectedDate || new Date().toLocaleDateString('ru-RU');
        crmData.push({ 
            date, client: document.getElementById('bookingClient').value || 'БЕЗ ИМЕНИ', 
            time: document.getElementById('bookingTime').value || '00:00',
            services: currentCart.items.map(i => i.name).join(', '), 
            details: [...currentCart.details], total: currentCart.total, timestamp: Date.now() 
        });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        currentCart = { items: [], details: [], total: 0 }; renderCart(); updateTable();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody');
        body.innerHTML = '';
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        const filtered = crmData.filter(r => r.date.includes(mKey));
        
        filtered.forEach((row, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="row-date">${row.date}</td>
                <td class="row-client">${row.client}</td>
                <td class="row-time-progress">
                    <span class="time-val">${row.time}</span>
                    <div class="progress-container"><div class="progress-bar" style="width:100%"></div></div>
                    <div class="services-cell">${row.services}</div>
                </td>
                <td class="row-price privacy-blur">${row.total} ₽</td>
                <td class="row-actions">
                    <div class="action-icons-wrap">
                        <div class="icon-btn-box" onclick="addPayment(${crmData.indexOf(row)})"><span>ДОПЛАТА</span><i class="fas fa-wallet"></i></div>
                        <div class="icon-btn-box" onclick="deleteRow(${crmData.indexOf(row)})"><span>УДАЛИТЬ</span><i class="fas fa-trash"></i></div>
                    </div>
                </td>
            `;
            body.appendChild(tr);
        });
        updateMonthTotal();
    }

    function updateMonthTotal() {
        const mKey = `.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
        const sum = crmData.filter(r => r.date.includes(mKey)).reduce((a, b) => a + b.total, 0);
        document.getElementById('monthTotal').innerText = sum.toLocaleString() + ' ₽';
    }

    function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); updateTable(); renderCalendar(); }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        grid.innerHTML = '';
        const daysInMonth = new Date(currentCalDate.getFullYear(), currentCalDate.getMonth() + 1, 0).getDate();
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${String(d).padStart(2,'0')}.${String(currentCalDate.getMonth()+1).padStart(2,'0')}.${currentCalDate.getFullYear()}`;
            const hasData = crmData.some(r => r.date === dateStr);
            grid.innerHTML += `<div class="day ${hasData?'has-data':''}" onclick="selectedDate='${dateStr}'; renderCalendar()">${d}</div>`;
        }
    }

    renderCalendar(); updateTable();
</script>
</body>
</html>
