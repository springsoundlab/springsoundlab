<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>SPRING SOUND LAB — профессиональная студия звукозаписи</title>
<meta name="description" content="SPRING SOUND LAB — профессиональная студия звукозаписи. Запись, сведение, мастеринг. Создайте звук мирового уровня.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ========== ОСНОВНЫЕ СТИЛИ САЙТА (из файла index.html) ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#060d1f;
  --navy2:#0a1428;
  --navy3:#0f1d38;
  --navy4:#152244;
  --blue:#1a6fff;
  --blue2:#3d8bff;
  --blue-glow:rgba(26,111,255,0.18);
  --white:#ffffff;
  --white80:rgba(255,255,255,0.8);
  --white50:rgba(255,255,255,0.5);
  --white15:rgba(255,255,255,0.15);
  --white08:rgba(255,255,255,0.08);
  --white04:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.1);
  --border2:rgba(26,111,255,0.4);
  --r:16px;
  --r2:24px;
  --r3:12px;
  --sans:'Poppins', sans-serif;
  --display:'Poppins', sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--navy);color:var(--white);line-height:1.7;overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.4;
}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:0 5%;height:72px;background:rgba(6,13,31,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-cta-wrap{position:absolute;right:5%;display:flex;align-items:center;gap:12px}
.nav-logo{font-family:var(--display);font-size:1.9rem;color:var(--white);text-decoration:none;font-weight:800;letter-spacing:-0.02em;white-space:nowrap}
.nav-logo span{color:var(--blue2)}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{color:var(--white50);text-decoration:none;font-size:0.875rem;font-weight:700;transition:color 0.2s}
.nav-links a:hover{color:var(--white)}
.nav-cta{padding:0.55rem 1.4rem;background:var(--blue);color:var(--white);border:none;border-radius:50px;font-family:var(--sans);font-size:0.85rem;font-weight:800;text-decoration:none;cursor:pointer;transition:all 0.2s;box-shadow:0 0 20px rgba(26,111,255,0.35);}
.nav-cta:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 0 30px rgba(26,111,255,0.5)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none}
.nav-hamburger span{display:block;width:22px;height:1.5px;background:var(--white);border-radius:2px}
.mobile-nav{display:none;flex-direction:column;position:fixed;top:72px;left:0;right:0;background:rgba(6,13,31,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:99;padding:1.5rem 5%;gap:0;}
.mobile-nav.open{display:flex}
.mobile-nav a{color:var(--white80);text-decoration:none;font-size:1rem;font-weight:600;padding:1rem 0;border-bottom:1px solid var(--border);transition:color 0.2s}
.mobile-nav a:hover{color:var(--blue2)}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:120px 5% 80px;position:relative;overflow:hidden;}
.hero-orb1,.hero-orb2{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.hero-orb1{width:600px;height:600px;background:rgba(26,111,255,0.12);top:-100px;left:50%;transform:translateX(-50%)}
.hero-orb2{width:400px;height:400px;background:rgba(26,111,255,0.07);bottom:0;right:10%}
.hero-content{position:relative;z-index:1;max-width:1100px}
.hero-logo{width:280px;height:auto;margin-bottom:3rem;display:block;margin-left:auto;margin-right:auto;}
.hero h1{font-family:var(--display);font-size:clamp(2.5rem, 7vw, 7rem);font-weight:900;line-height:1.05;letter-spacing:-0.03em;margin-bottom:1.5rem;color:var(--white);white-space:nowrap;}
.hero h1 span{color:var(--blue2);}
.hero p{font-size:1.1rem;color:var(--white50);max-width:560px;margin:0 auto 2.5rem;font-weight:500;line-height:1.8}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:var(--blue);color:var(--white);border-radius:50px;border:none;font-family:var(--sans);font-size:0.9rem;font-weight:800;text-decoration:none;cursor:pointer;transition:all 0.2s;box-shadow:0 0 24px rgba(26,111,255,0.4);}
.btn-primary:hover{background:var(--blue2);transform:translateY(-2px);box-shadow:0 0 36px rgba(26,111,255,0.55)}
.btn-ghost{display:inline-flex;align-items:center;gap:0.5rem;padding:0.85rem 2rem;background:transparent;color:var(--white80);border-radius:50px;border:1px solid var(--border);font-family:var(--sans);font-size:0.9rem;font-weight:700;text-decoration:none;cursor:pointer;transition:all 0.2s;}
.btn-ghost:hover{border-color:var(--white15);color:var(--white);background:var(--white04)}
section{padding:100px 5%}
.section-inner{max-width:1200px;margin:0 auto}
.section-eyebrow{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.78rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue2);margin-bottom:1.2rem;}
.section-eyebrow::before{content:'';width:20px;height:1px;background:var(--blue2)}
.section-title{font-family:var(--display);font-size:clamp(2rem,4vw,3rem);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin-bottom:1.2rem}
.section-sub{font-size:1rem;color:var(--white50);max-width:560px;font-weight:500;line-height:1.8}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;margin-top:60px}
.about-img{border-radius:var(--r2);overflow:hidden;aspect-ratio:4/5;background:var(--navy3);position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.4);}
.about-img img{width:100%;height:100%;object-fit:cover;opacity:0.85}
.about-img-badge{position:absolute;bottom:24px;left:24px;background:rgba(6,13,31,0.85);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;display:flex;align-items:center;gap:0.75rem;}
.about-img-badge .num{font-family:var(--display);font-size:1.6rem;font-weight:800;color:var(--blue2)}
.about-img-badge .lbl{font-size:0.8rem;color:var(--white50);font-weight:600}
.about-feats{display:flex;flex-direction:column;gap:1.5rem;margin-top:2.5rem}
.about-feat{display:flex;gap:1rem;align-items:flex-start;background:var(--white04);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;transition:border-color 0.2s,background 0.2s;}
.about-feat:hover{border-color:var(--border2);background:var(--white08)}
.feat-icon{width:40px;height:40px;border-radius:10px;background:var(--blue-glow);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;color:var(--blue2)}
.feat-title{font-size:0.95rem;font-weight:800;margin-bottom:0.2rem}
.feat-text{font-size:0.85rem;color:var(--white50);line-height:1.6;font-weight:500}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:50px;}
.service-card{background:var(--white04);border:1px solid var(--border);border-radius:var(--r2);padding:2rem 1.75rem;transition:all 0.3s;cursor:default;position:relative;overflow:hidden;}
.service-card::after{content:'';position:absolute;inset:0;border-radius:var(--r2);background:linear-gradient(135deg,var(--blue-glow) 0%,transparent 60%);opacity:0;transition:opacity 0.3s;}
.service-card:hover{border-color:var(--border2);background:var(--white08);transform:translateY(-3px)}
.service-card:hover::after{opacity:1}
.svc-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--navy3),var(--navy4));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:1.25rem;position:relative;z-index:1;}
.svc-title{font-family:var(--display);font-size:1.1rem;font-weight:800;margin-bottom:0.6rem;position:relative;z-index:1}
.svc-text{font-size:0.85rem;color:var(--white50);line-height:1.7;position:relative;z-index:1;font-weight:500}
.svc-price{margin-top:1.25rem;font-size:1rem;color:var(--blue2);font-weight:800;position:relative;z-index:1}
.team-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;flex-wrap:wrap;gap:1rem}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.team-card{border-radius:var(--r2);overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--navy3);cursor:pointer;}
.team-card img{width:100%;height:100%;object-fit:cover;opacity:0.85;transition:opacity 0.6s ease,transform 0.6s ease;}
.team-card:hover img{opacity:0.25;transform:scale(1.04);}
.team-overlay{position:absolute;inset:0;padding:1.5rem;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:linear-gradient(to top,rgba(6,13,31,0.75) 0%,rgba(6,13,31,0.0) 55%);transition:background 0.6s ease,justify-content 0.1s,backdrop-filter 0.6s ease;}
.team-card:hover .team-overlay{background:rgba(6,13,31,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);justify-content:center;text-align:center;}
.team-name{font-family:var(--display);font-size:1rem;font-weight:800;margin-bottom:0.2rem;color:var(--white);transition:font-size 0.4s ease,letter-spacing 0.4s ease;}
.team-role{font-size:0.75rem;color:var(--blue2);font-weight:700;transition:font-size 0.4s ease;}
.team-card:hover .team-name{font-size:1.1rem;letter-spacing:-0.01em;}
.team-card:hover .team-role{font-size:0.8rem;}
.team-desc{font-size:0.82rem;color:var(--white80);line-height:1.6;font-weight:500;width:100%;max-height:0;opacity:0;overflow:hidden;margin-top:0;transition:max-height 0.55s ease,opacity 0.55s ease,margin-top 0.4s ease;}
.team-card:hover .team-desc{max-height:200px;opacity:1;margin-top:0.85rem;}
.blog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.blog-card{border-radius:var(--r2);overflow:hidden;background:var(--white04);border:1px solid var(--border);transition:all 0.3s;cursor:pointer}
.blog-card:hover{border-color:var(--border2);transform:translateY(-3px)}
.blog-img{aspect-ratio:4/3;overflow:hidden}
.blog-img img{width:100%;height:100%;object-fit:cover;opacity:0.8;transition:transform 0.4s}
.blog-card:hover .blog-img img{transform:scale(1.05)}
.blog-body{padding:1.25rem}
.blog-date{font-size:0.75rem;color:var(--white50);margin-bottom:0.5rem;font-weight:600}
.blog-title{font-family:var(--display);font-size:1rem;font-weight:800;line-height:1.3;margin-bottom:0.5rem}
.blog-text{font-size:0.82rem;color:var(--white50);line-height:1.6;font-weight:500}
.video-section{position:relative;min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.video-bg{position:absolute;inset:0;background:var(--navy2);overflow:hidden}
.video-bg iframe{width:100%;height:100%;border:none;opacity:0.2}
.video-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,13,31,0.7),rgba(6,13,31,0.85))}
.video-content{position:relative;z-index:2;padding:100px 5%}
.play-btn{width:80px;height:80px;border-radius:50%;background:rgba(26,111,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(26,111,255,0.4);display:flex;align-items:center;justify-content:center;margin:0 auto 2rem;cursor:pointer;transition:all 0.3s;text-decoration:none;}
.play-btn:hover{background:rgba(26,111,255,0.3);transform:scale(1.1);border-color:var(--blue2);box-shadow:0 0 40px rgba(26,111,255,0.4)}
.play-btn svg{fill:var(--white);margin-left:4px}
.releases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.release-card{background:var(--white04);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;transition:all 0.3s;cursor:pointer}
.release-card:hover{border-color:var(--border2);transform:translateY(-3px)}
.release-cover{aspect-ratio:1;border-radius:var(--r);overflow:hidden;margin-bottom:1.25rem;background:var(--navy3);position:relative;cursor:pointer;}
.release-cover img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
.release-cover:hover img{transform:scale(1.04)}
.release-type{font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--blue2);font-weight:800;margin-bottom:0.4rem}
.release-title{font-family:var(--display);font-size:1.2rem;font-weight:800;margin-bottom:0.3rem}
.release-sub{font-size:0.85rem;color:var(--white50);margin-bottom:1.2rem;font-weight:500}
.tabs-nav{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:30px;overflow-x:auto;scrollbar-width:none}
.tabs-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:0.75rem 1.5rem;background:transparent;border:none;color:var(--white50);font-family:var(--sans);font-size:0.82rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab-btn.active{color:var(--blue2);border-bottom-color:var(--blue2)}
.tab-btn:hover{color:var(--white)}
.tab-panel{display:none}.tab-panel.active{display:block}
.works-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.work-item{background:var(--white04);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;display:flex;gap:1.25rem;align-items:center;cursor:pointer;transition:all 0.2s;}
.work-item:hover{border-color:var(--border2);background:var(--white08)}
.work-cover{width:56px;height:56px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--navy3);position:relative;}
.work-cover img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
.work-item:hover .work-cover img{transform:scale(1.08)}
.work-cover-play-overlay{position:absolute;inset:0;background:rgba(6,13,31,0.45);display:flex;align-items:center;justify-content:center;border-radius:10px;}
.work-cover-play-btn{width:26px;height:26px;border-radius:50%;background:rgba(26,111,255,0.9);display:flex;align-items:center;justify-content:center;transition:transform 0.25s,background 0.25s;box-shadow:0 2px 8px rgba(26,111,255,0.6);}
.work-item:hover .work-cover-play-btn{transform:scale(1.15);background:var(--blue2)}
.work-cover-play-btn svg{fill:white;margin-left:2px}
.work-artist{font-size:0.72rem;color:var(--blue2);font-weight:800;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.2rem}
.work-title{font-size:0.95rem;font-weight:800;margin-bottom:0.2rem}
.work-desc{font-size:0.78rem;color:var(--white50);font-weight:500}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:12px;margin-top:40px}
.gallery-item{border-radius:var(--r2);overflow:hidden;cursor:pointer;background:var(--navy3)}
.gallery-item:first-child{grid-column:span 2;grid-row:span 2}
.gallery-item img{width:100%;height:100%;object-fit:cover;opacity:0.75;transition:opacity 0.3s,transform 0.5s}
.gallery-item:hover img{opacity:1;transform:scale(1.04)}
.pricing-tabs{display:flex;gap:8px;margin-bottom:40px;flex-wrap:wrap;}
.ptab-btn{padding:0.6rem 1.4rem;background:var(--white04);border:1px solid var(--border);border-radius:50px;color:var(--white50);font-family:var(--sans);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.25s;white-space:nowrap;}
.ptab-btn:hover{color:var(--white);border-color:var(--white15)}
.ptab-btn.active{background:var(--blue);border-color:var(--blue);color:var(--white);box-shadow:0 0 20px rgba(26,111,255,0.35);}
.pricing-panels-wrap{position:relative;min-height:100px;}
.pricing-panel{display:none;grid-template-columns:repeat(3,1fr);gap:16px;}
.pricing-panel.active{display:grid;}
@keyframes pricingFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pricing-panel.anim-in{animation:pricingFadeIn 0.35s ease forwards;}
.pricing-card{background:var(--white04);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem 2rem;position:relative;transition:all 0.3s;}
.pricing-card:hover{transform:translateY(-3px)}
.pricing-card.featured{background:linear-gradient(135deg,rgba(26,111,255,0.12),rgba(26,111,255,0.06));border-color:var(--blue)}
.pricing-badge{display:inline-block;font-size:0.7rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;background:linear-gradient(135deg,var(--blue),var(--blue2));color:var(--white);border-radius:50px;padding:0.3rem 0.9rem;margin-bottom:1.5rem;}
.pricing-name{font-family:var(--display);font-size:1.3rem;font-weight:800;margin-bottom:0.5rem}
.pricing-price{font-family:var(--display);font-size:2.4rem;font-weight:800;margin-bottom:0.3rem;line-height:1}
.pricing-period{font-size:0.8rem;color:var(--white50);margin-bottom:2rem;font-weight:600}
.pricing-list{list-style:none;margin-bottom:2rem}
.pricing-list li{font-size:0.875rem;color:var(--white80);padding:0.55rem 0;border-bottom:1px solid var(--border);display:flex;gap:0.75rem;align-items:center;font-weight:600}
.pricing-list li::before{content:'✓';color:var(--blue2);font-weight:800;flex-shrink:0}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.stat-card{background:var(--white04);border:1px solid var(--border);border-radius:var(--r2);padding:2.5rem 2rem;text-align:center;transition:all 0.3s}
.stat-card:hover{border-color:var(--border2);transform:translateY(-3px)}
.stat-num{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--blue2);line-height:1;margin-bottom:0.5rem}
.stat-lbl{font-size:0.8rem;color:var(--white50);font-weight:700}
.faq-wrap{max-width:680px;margin-top:40px}
.faq-item{border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color 0.2s}
.faq-item.open{border-color:var(--border2)}
.faq-q{width:100%;background:transparent;border:none;text-align:left;padding:1.2rem 1.5rem;color:var(--white);font-family:var(--sans);font-size:0.95rem;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:1rem;}
.faq-icon{width:28px;height:28px;border-radius:50%;background:var(--white08);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--blue2);font-size:1.1rem;flex-shrink:0;transition:transform 0.3s,background 0.2s;}
.faq-item.open .faq-icon{transform:rotate(45deg);background:var(--blue-glow)}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s;font-size:0.875rem;color:var(--white50);line-height:1.8;font-weight:500;padding:0 1.5rem}
.faq-item.open .faq-a{max-height:200px;padding:0 1.5rem 1.25rem}
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.test-card{background:var(--white04);border:1px solid var(--border);border-radius:var(--r2);padding:2rem;transition:all 0.3s}
.test-card:hover{border-color:var(--border2)}
.test-quote{font-size:0.95rem;color:var(--white80);line-height:1.8;margin-bottom:1.5rem;font-style:italic;font-weight:500}
.test-quote::before{content:'\201C';color:var(--blue2);font-size:2.5rem;line-height:0.5;vertical-align:-0.4em;margin-right:0.15em;font-family:var(--display)}
.test-author{display:flex;align-items:center;gap:0.75rem}
.test-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--navy3);border:2px solid var(--border);flex-shrink:0}
.test-avatar img{width:100%;height:100%;object-fit:cover}
.test-name{font-size:0.9rem;font-weight:800}
.test-role{font-size:0.75rem;color:var(--white50);font-weight:600}
.cta-section{text-align:center;padding:120px 5%;position:relative;overflow:hidden;background:var(--navy);}
