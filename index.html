<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRING SOUND LAB | WEYTON</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;500;700;800&family=Montserrat:wght@100;200;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================
           1. ПЕРЕМЕННЫЕ И ОСНОВНЫЕ СТИЛИ
           ========================================== */
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff003c;
            --neon-gold: #ffcc00;
            --neon-pink: #ff44aa;
            --neon-green: #00ff88;
            --youtube-red: #ff0000;
            --bg-dark: #020205;
            --transition-speed: 0.4s;
            --transition-speed-mobile: 0.6s;
            --transition-timing: cubic-bezier(0.4, 0, 0.2, 1);
            --soft-glow: rgba(0, 242, 255, 0.25);
        }

        * { 
            box-sizing: border-box; 
            scroll-behavior: smooth; 
            border-radius: 0 !important; 
            margin: 0;
            padding: 0;
        }
        
        body { 
            background-color: var(--bg-dark);
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
            width: 100%;
        }

        /* Кастомный плеер */
        .custom-audio-player {
            background: #000 !important;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .play-btn { background: none; border: none; color: #fff; cursor: pointer; width: 30px; font-size: 1.1rem; }
        .progress-container { flex-grow: 1; height: 4px; background: #222; position: relative; cursor: pointer; }
        .progress-bar { height: 100%; background: #00f2ff; width: 0%; }
        .time-display { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: #fff; min-width: 40px; }

        /* ==========================================
           2. ФОН
           ========================================== */
        .studio-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: linear-gradient(rgba(2, 2, 5, 0.75), rgba(2, 2, 5, 0.98)), url('bg.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            animation: backgroundSubtleScale 80s infinite alternate ease-in-out;
        }

        @keyframes backgroundSubtleScale { 
            0% { transform: scale(1); } 
            100% { transform: scale(1.15); } 
        }

        /* ==========================================
           3. ШАПКА
           ========================================== */
        header { 
            height: 100vh; min-height: 600px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            padding: 20px; position: relative; width: 100%;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .flicker-header {
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 22px;
            color: #ffffff; text-transform: uppercase; margin-bottom: 25px;
            opacity: 0; transform: translateY(15px);
            animation: ultraSmoothFade 1.5s 0.8s forwards;
        }

        @keyframes ultraSmoothFade { 
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); } 
        }

        h1 {
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(2.5rem, 8vw, 7.5rem); 
            background-image: linear-gradient(90deg, #ffffff, var(--neon-blue), var(--neon-purple), #ffffff);
            background-size: 300% auto; 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: flow 15s linear infinite; 
            text-transform: uppercase; letter-spacing: 15px; font-weight: 900;
            width: 100%;
        }

        @keyframes flow { 
            0% { background-position: 0% 50%; } 
            100% { background-position: 300% 50%; } 
        }

        .header-subtitle {
            font-family: 'Syne', sans-serif; font-weight: 300;
            font-size: clamp(1.2rem, 2.5vw, 1.7rem); max-width: 1100px;
            margin-top: 50px; line-height: 1.6; letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9); text-transform: uppercase;
            opacity: 0; transform: translateY(15px);
            animation: ultraSmoothFade 1.5s 1.8s forwards;
        }

        /* ==========================================
           4. СОЦИАЛЬНЫЕ СЕТИ
           ========================================== */
        .header-socials {
            display: flex; gap: 50px; margin-top: 70px;
            opacity: 0; transform: translateY(20px);
            animation: ultraSmoothFade 1.5s 2.5s forwards;
        }

        .social-btn {
            color: #ffffff; font-size: 3.5rem;
            transition: color 0.6s var(--transition-timing), transform 0.4s var(--transition-timing), filter 0.6s ease;
            text-decoration: none; display: inline-block;
        }

        .social-btn.activated.vk, .social-btn.vk:hover { color: #0077ff !important; filter: drop-shadow(0 0 8px rgba(0, 119, 255, 0.4)); }
        .social-btn.activated.tg, .social-btn.tg:hover { color: #24A1DE !important; filter: drop-shadow(0 0 8px rgba(36, 161, 222, 0.4)); }
        .social-btn.activated.yt, .social-btn.yt:hover { color: var(--youtube-red) !important; filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.4)); }
        .social-btn.activated.ig, .social-btn.ig:hover { color: #f09433 !important; filter: drop-shadow(0 0 8px rgba(230, 104, 60, 0.4)); }

        @media (min-width: 1025px) {
            .social-btn:hover { transform: scale(1.1); }
        }

        /* ==========================================
           5. ТЕЛЕФОН
           ========================================== */
        .phone-box-container {
            margin-top: 40px; padding: 20px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: inline-flex; flex-direction: column; align-items: center;
            text-decoration: none; transition: all var(--transition-speed) var(--transition-timing);
            opacity: 0; transform: translateY(20px);
            animation: ultraSmoothFade 1.5s 3s forwards;
            cursor: pointer;
        }

        .header-phone {
            font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: #ffffff;
            letter-spacing: 5px; transition: all var(--transition-speed) var(--transition-timing);
            margin-bottom: 5px;
        }

        .phone-hint {
            font-family: 'Montserrat', sans-serif; font-size: 0.6rem; letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6); text-transform: uppercase;
            transition: all var(--transition-speed) var(--transition-timing);
        }

        .phone-box-container:hover {
            border-color: var(--neon-blue); box-shadow: 0 0 10px var(--soft-glow);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .phone-box-container:hover .header-phone { color: var(--neon-blue); text-shadow: 0 0 5px var(--soft-glow); }
        .phone-box-container:hover .phone-hint { color: #ffffff; }

        /* ==========================================
           6. ОСНОВНОЙ КОНТЕНТ
           ========================================== */
        .container { 
            padding: 50px 20px; max-width: 1600px; margin: 0 auto;
            position: relative; z-index: 5; width: 100%;
        }

        section { 
            padding: 120px 0; border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 { 
            font-family: 'Orbitron', sans-serif; font-weight: 700; text-align: center;
            letter-spacing: 15px; margin-bottom: 80px; font-size: 2.8rem; text-transform: uppercase; 
        }

        /* ==========================================
           7. КАРУСЕЛЬ СЕРВИСОВ (десктоп)
           ========================================== */
        .services-carousel {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .carousel-wrapper {
            overflow: hidden;
            flex: 1;
            padding: 10px 0; /* чтобы приподнятая карточка не обрезалась */
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            transition: transform 0.4s ease;
            will-change: transform;
        }

        /* Стили карточек (единый размер) */
        .service-card {
            flex: 0 0 auto;
            width: 380px; /* чуть шире, как в оригинальной сетке */
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 25px;
            transition: all var(--transition-speed) var(--transition-timing);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            position: relative;
            height: auto; /* высота по контенту */
        }

        .service-card:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-8px);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* Индивидуальные цвета при наведении */
        .service-card.rec:hover { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
        .service-card.start:hover { border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(188, 19, 254, 0.1); }
        .service-card.artist:hover { border-color: var(--neon-red); box-shadow: 0 0 15px rgba(255, 0, 60, 0.1); }
        .service-card.platinum:hover { border-color: var(--neon-gold); box-shadow: 0 0 15px rgba(255, 204, 0, 0.2); }
        .service-card.arrangement:hover { border-color: var(--neon-blue); box-shadow: 0 0 15px var(--soft-glow); }
        .service-card.gift:hover { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 68, 170, 0.3); }
        .service-card.lesson:hover { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }

        .service-card h3 { 
            font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 3px; margin-bottom: 20px;
            font-size: 0.9rem; text-transform: uppercase; color: #ffffff;
        }

        .service-card .price { 
            font-size: 2.2rem; font-weight: 900; font-family: 'Orbitron', sans-serif; margin-bottom: 10px; color: #ffffff;
        }

        .service-card .price span { 
            font-size: 0.8rem; color: #aaaaaa; font-family: 'Montserrat', sans-serif; 
        }

        .service-card .module-description {
            font-family: 'Montserrat', sans-serif; font-size: 0.7rem; line-height: 1.6;
            color: rgba(255, 255, 255, 0.8); margin-bottom: 25px;
            text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; 
        }

        .service-card .sub-package {
            border-top: 1px solid rgba(255, 255, 255, 0.2); margin-top: 15px; padding-top: 15px; width: 100%;
        }

        .service-card .sub-package-title {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.8rem;
            margin-bottom: 8px; display: block; text-transform: uppercase;
        }

        .service-card .specs { 
            list-style-type: none; margin-top: 30px; width: 100%; 
        }

        .service-card .specs li { 
            padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;
            text-transform: uppercase; letter-spacing: 1px; color: #ffffff;
        }

        .service-card .specs li span { 
            color: var(--neon-blue); font-weight: 700; text-align: right; margin-left: 10px; 
        }

        /* Стрелки карусели */
        .carousel-arrow {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10;
            flex-shrink: 0;
        }

        .carousel-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .carousel-arrow:active { transform: scale(0.95); }

        /* ==========================================
           8. МОБИЛЬНАЯ ВЕРСИЯ (до 768px)
           ========================================== */
        @media (max-width: 768px) {
            /* Отключаем карусель, делаем вертикальный список */
            .services-carousel {
                display: block;
            }
            .carousel-wrapper {
                overflow: visible;
                padding: 0;
            }
            .carousel-track {
                display: block;
                transform: none !important; /* отменяем сдвиг */
                transition: none;
                gap: 20px;
            }
            .service-card {
                width: 100% !important;
                margin-bottom: 20px;
                flex: none;
            }
            .carousel-arrow {
                display: none; /* стрелки не нужны */
            }
            /* Уменьшаем отступы для мобильных */
            .service-card {
                padding: 30px 20px;
            }
        }

        /* ==========================================
           9. PORTFOLIO
           ========================================== */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .audio-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            transition: all var(--transition-speed) var(--transition-timing);
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .audio-card:hover, .audio-card.active-scroll {
            border-color: var(--neon-blue);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            transform: translateY(-5px);
        }

        .audio-card::after {
            content: "";
            position: absolute;
            top: -150%;
            left: -150%;
            width: 40%;
            height: 400%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.03) 70%, rgba(255,255,255,0) 100%);
            transform: rotate(35deg);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
        }

        .audio-card:hover::after {
            opacity: 1;
            left: 150%;
            top: 50%;
            transition: left 0.7s ease-in-out, top 0.7s ease-in-out;
        }

        .audio-cover {
            width: 100%;
            aspect-ratio: 1/1;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .audio-info { 
            padding: 15px 20px; height: 95px;
            display: flex; flex-direction: column; justify-content: center; overflow: hidden;
        }

        .audio-title { 
            font-family: 'Orbitron', sans-serif; font-weight: 700;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem); line-height: 1.2; letter-spacing: 1px;
            margin-bottom: 6px; text-transform: uppercase;
        }

        .neon-accent {
            color: var(--neon-blue);
            text-shadow: none !important;
            font-weight: 600;
        } 

        .audio-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem !important;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
            flex-shrink: 0;
        }

        audio {
            width: 100%; height: 40px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.2);
            outline: none; opacity: 0.8; transition: opacity 0.3s;
        }

        audio:hover { opacity: 1; }

        /* ==========================================
           10. КОНТАКТЫ
           ========================================== */
        .booking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

        .contact-card {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 80px 40px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none; color: #ffffff;
            transition: all var(--transition-speed) var(--transition-timing);
            backdrop-filter: blur(8px); display: block;
        }

        .contact-label {
            font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 3px;
            color: #aaaaaa; margin-bottom: 10px; text-transform: uppercase;
        }

        .contact-main-text { 
            color: #ffffff; font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            font-family: 'Orbitron', sans-serif; font-weight: 900; margin-bottom: 10px;
            transition: all var(--transition-speed); text-transform: uppercase;
        }

        .contact-card:hover {
            border-color: var(--neon-blue); box-shadow: 0 0 15px var(--soft-glow);
            transform: translateY(-5px); background-color: rgba(255, 255, 255, 0.05);
        }

        .contact-card:hover .contact-main-text { color: var(--neon-blue); text-shadow: 0 0 6px var(--soft-glow); }

        .contact-card.active-scroll {
            border-color: var(--neon-blue); box-shadow: 0 0 15px var(--soft-glow);
            background-color: rgba(255, 255, 255, 0.05);
        }
        .contact-card.active-scroll .contact-main-text { color: var(--neon-blue); text-shadow: 0 0 6px var(--soft-glow); }

        .work-time {
            font-family: 'Orbitron', sans-serif; font-size: 0.9rem; letter-spacing: 2px;
            color: #ffffff; margin-bottom: 20px; text-transform: uppercase;
        }

        .action-hint {
            font-family: 'Montserrat', sans-serif; font-size: 0.6rem; letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7); text-transform: uppercase;
        }

        /* ==========================================
           11. ПОДВАЛ
           ========================================== */
        footer { 
            padding: 60px 20px; text-align: center; 
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: #555555;
            letter-spacing: 5px; border-top: 1px solid #111111; text-transform: uppercase;
        }

        .header-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* ==========================================
           12. ABOUT ME (без изменений)
           ========================================== */
        #about-me { padding: 80px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; width: 100%; }
        .about-container { display: flex; align-items: stretch; justify-content: flex-start; max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 20px; }
        .fader-track { width: 12px; height: 380px; background: #000; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); position: relative; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); display: flex; justify-content: center; flex-shrink: 0; z-index: 30; }
        .fader-led-scale { position: absolute; bottom: 0; width: 4px; height: 0%; background: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); transition: height 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); opacity: 0; }
        .fader-handle { width: 50px; height: 80px; background: linear-gradient(145deg, #222, #444, #111); border: 1px solid #555; position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 35; box-shadow: 10px 10px 20px rgba(0,0,0,0.6); transition: bottom 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .fader-handle::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .about-content-wrapper { flex-grow: 1; overflow: hidden; display: flex; align-items: center; height: 380px; }
        .about-content-blur { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 20px 60px; opacity: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; transform: translateX(-100%); transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, opacity 0.8s ease 0.6s; text-align: center; position: relative; box-sizing: border-box; }
        .about-content-blur::after { content: ""; position: absolute; right: 0; top: 0; width: 2px; height: 100%; background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }
        .about-title { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; letter-spacing: 8px; color: #ffffff; margin-bottom: 20px; text-transform: uppercase; }
        .about-text { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; line-height: 1.6; color: rgba(255, 255, 255, 0.9); margin: 0 auto; max-width: 900px; }
        #about-me.is-revealed .fader-handle { bottom: 280px; }
        #about-me.is-revealed .fader-led-scale { height: 320px; opacity: 1; }
        #about-me.is-revealed .about-content-blur { opacity: 1; transform: translateX(0); }

        /* ==========================================
           13. МЕДИА-ЗАПРОСЫ (остальные)
           ========================================== */
        @media (max-width: 1024px) { 
            header { height: auto; min-height: 100vh; padding: 60px 20px; }
            .flicker-header { font-size: 0.8rem; letter-spacing: 10px; margin-bottom: 15px; opacity: 1; transform: none; animation: none; }
            h1 { font-size: 2.8rem; letter-spacing: 8px; line-height: 1.1; width: 100%; }
            .header-subtitle { font-size: 0.9rem; margin-top: 30px; letter-spacing: 1px; padding: 0 10px; opacity: 1; transform: none; animation: none; }
            .header-socials { gap: 20px; margin-top: 40px; opacity: 1; transform: none; animation: none; }
            .social-btn { font-size: 2.5rem; }
            .header-phone { font-size: 1.1rem; letter-spacing: 3px; }
            .phone-box-container { padding: 15px 25px; margin-top: 30px; width: 90%; max-width: 320px; opacity: 1; transform: none; animation: none; }
            section { padding: 60px 0; }
            h2 { font-size: 2rem; letter-spacing: 8px; margin-bottom: 40px; }
            .booking-grid { grid-template-columns: 1fr; } 
            .contact-card { padding: 50px 20px; }
            .contact-main-text { font-size: 1.4rem; }
            .service-card:hover, .social-btn:hover, .phone-box-container:hover, .contact-card:hover, .audio-card:hover { transform: none; }
            .service-card.active-scroll, .audio-card.active-scroll { background-color: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        }

        @media (max-width: 350px) {
            h1 { font-size: 2.2rem; }
            .flicker-header { letter-spacing: 5px; }
        }

        /* Цвета для мобильной активации */
