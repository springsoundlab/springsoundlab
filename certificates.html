<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRING SOUND LAB | CRM</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SSL CRM">
    
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlNQUklORyBTT1VORCBMQUIgQ1JNIiwKICAic2hvcnRfbmFtZSI6ICJTU0wgQ1JNIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwNTA1MDUiLAogICJ0aGVtZV9jb2xvciI6ICIjYmYwMGZmIgp9">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
            --azure-blue: #00ccff; --text-gray: #b0b0b0;
        }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            padding: 0 0 20px 0; 
            border-bottom: 1px solid #111; 
            flex-shrink: 0; 
        }

        @media (min-width: 993px) {
            header {
                margin-top: 30px;
            }
        }

        .logo { 
            font-family: 'Orbitron', sans-serif; 
            color: var(--neon-purple); 
            letter-spacing: 2px; 
            font-size: 14px; 
            padding-top: 15px;
        }
        
        .header-right-zone {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .total-box { 
            background: var(--neon-purple); 
            height: 70px;
            border-radius: 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(191, 0, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .total-box:hover {
            box-shadow: 0 4px 30px rgba(191, 0, 255, 0.4);
            border-color: rgba(255,255,255,0.3);
        }

        .income-amount { 
            font-family: 'Rajdhani'; 
            font-weight: 700; 
            font-size: 32px; 
            color: #fff; 
            line-height: 1;
            transition: 0.3s;
        }
        #totalLabel { 
            font-size: 9px; 
            display: block; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: rgba(255,255,255,0.8); 
            margin-top: 5px; 
            font-weight: 600; 
            font-family: 'Orbitron';
        }

        .unlock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron';
            font-size: 12px;
            letter-spacing: 4px;
            color: #fff;
            background: rgba(191, 0, 255, 0.1);
            pointer-events: none;
            z-index: 2;
            transition: 0.3s;
        }

        .privacy-blur { filter: blur(15px); opacity: 0.3; }
        .privacy-active .privacy-blur { filter: blur(0); opacity: 1; }
        .privacy-active .unlock-overlay { opacity: 0; visibility: hidden; }

        .back-btn { 
            color: #555; 
            text-decoration: none; 
            font-size: 9px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border: 1px solid #1a1a1a; 
            padding: 12px; 
            border-radius: 8px; 
            transition: 0.3s; 
            text-align: center;
            font-family: 'Orbitron';
            background: rgba(255,255,255,0.02);
        }
        .back-btn:hover { 
            color: #fff; 
            border-color: var(--neon-purple); 
            background: rgba(191, 0, 255, 0.05);
        }

        .admin-grid { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            flex-grow: 1; 
            overflow: hidden; 
            margin-top: 20px;
        }

        .crm-panel, .side-panel { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            border: 1px solid #111; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        .table-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 99999; backdrop-filter: blur(5px);
        }
        .custom-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0a0a0a; border: 1px solid var(--neon-purple); padding: 25px; border-radius: 15px;
            z-index: 100000; box-shadow: 0 0 40px rgba(191, 0, 255, 0.3); width: 320px; text-align: center;
        }
        .modal-title { font-family: 'Orbitron'; font-size: 11px; margin-bottom: 15px; color: #fff; letter-spacing: 1px; line-height: 1.4; }
        .modal-input {
            width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 12px;
            margin-bottom: 20px; border-radius: 6px; font-family: 'Rajdhani'; font-size: 20px; text-align: center; outline: none; box-sizing: border-box;
        }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .m-btn { padding: 10px 15px; border-radius: 6px; font-family: 'Orbitron'; font-size: 9px; cursor: pointer; text-transform: uppercase; border: none; flex: 1; transition: 0.2s; }
        .m-confirm { background: var(--status-green); color: #fff; }
        .m-cancel { background: #222; color: #888; }
        .m-delete { background: var(--artist-red); color: #fff; }

        .certs-dropdown {
            margin-bottom: 20px; border: 1px solid #222; border-radius: 10px; overflow: hidden;
            flex-shrink: 0; background: #000;
        }
        .certs-header {
            background: #000; padding: 12px 15px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; transition: 0.3s;
        }
        .certs-header h2 {
            font-family: 'Orbitron'; font-size: 11px; margin: 0; color: var(--neon-purple);
            letter-spacing: 2px; text-transform: uppercase;
        }
        .certs-header i { color: var(--neon-purple); font-size: 10px; transition: 0.3s; }
        .certs-content {
            display: none; max-height: 350px; overflow-y: auto; padding: 0 15px 15px 15px;
            border-top: 1px solid #111;
        }
        .certs-dropdown.active .certs-content { display: block; }
        .certs-dropdown.active .certs-header i { transform: rotate(180deg); }

        /* Стили для сертификатов (ДОБАВЛЕНО) */
        .cert-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #111;
            transition: background 0.2s;
        }
        .cert-row.inactive:hover {
            background: rgba(191, 0, 255, 0.1);
            cursor: pointer;
        }
        .cert-row.selected {
            background: rgba(184, 150, 0, 0.2);
            border-left: 3px solid var(--platinum-gold);
            padding-left: 5px;
        }
        .cert-id {
            font-family: 'Rajdhani';
            font-weight: 700;
            color: var(--neon-purple);
            font-size: 14px;
        }
        /* Конец добавленных стилей */

        .calendar-widget { flex-shrink: 0; margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { font-size: 9px; color: #666; font-weight: bold; padding-bottom: 5px; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green) !important; color: #fff !important; }
        .day.selected-day { border: 1px solid #fff; background: rgba(255,255,255,0.1); }
        .day:hover { background: #111; }

        .session-booking-widget {
            background: #000; border: 1px solid #222; border-radius: 10px; padding: 15px; margin-bottom: 20px;
        }
        .booking-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .booking-field {
            background: #080808; border: 1px solid #1a1a1a; border-radius: 6px; padding: 8px; color: #fff; 
            font-family: 'Orbitron'; font-size: 11px; outline: none; width: 100%; transition: 0.3s;
            text-align: center;
        }
        .booking-field:focus { border-color: var(--neon-purple); }
        .booking-label { font-family: 'Orbitron'; font-size: 8px; color: #444; margin-bottom: 5px; text-transform: uppercase; }

        .future-sessions-widget {
            background: rgba(0,0,0,0.5); border: 1px solid #111; border-radius: 10px; padding: 15px; margin-bottom: 20px; flex-shrink: 0;
            transition: 0.3s; max-height: 200px; overflow-y: auto;
        }
        .future-title { font-family: 'Orbitron'; font-size: 9px; color: #444; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        
        .future-item { 
            display: flex; align-items: center; gap: 12px; padding: 8px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .future-item:last-child { border-bottom: none; }
        
        .future-date { font-family: 'Rajdhani'; font-weight: 700; font-size: 18px; color: var(--neon-purple); min-width: 55px; }
        .future-client { font-family: 'Inter'; font-weight: 600; font-size: 13px; color: #fff; }

        .prepaid-toggle { display: flex; align-items: center; gap: 10px; margin-right: 15px; padding: 5px 12px; border-right: 1px solid #222; }
        .prepaid-toggle span { font-family: 'Orbitron'; font-size: 9px; color: var(--neon-purple); }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; border: 1px solid #333; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--neon-purple); }
        input:checked + .slider:before { transform: translateX(16px); }

        .controls-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: #000; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 1px solid #111; 
            flex-shrink: 0; 
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        
        .btn-wrapper { position: relative; flex-shrink: 0; }
        .action-btn { 
            background: transparent; color: #fff; padding: 10px 15px; border-radius: 6px; 
            cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; 
            transition: 0.3s; position: relative; white-space: nowrap;
        }
        
        .btn-tooltip { 
            visibility: hidden; opacity: 0; position: absolute; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 8px 12px; border-radius: 8px; z-index: 1000; width: auto; white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); transition: opacity 0.3s ease; pointer-events: none;
            font-family: 'Rajdhani'; font-weight: 700; font-size: 14px; bottom: 120%; left: 50%; transform: translateX(-50%);
        }
        .btn-wrapper:hover .btn-tooltip { visibility: visible; opacity: 1; }

        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); }
        .btn-blue { border: 1px solid var(--azure-blue); color: var(--azure-blue); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .btn-dashed-green { border: 1px dashed var(--status-green) !important; }
        .btn-dashed-gold { border: 1px dashed var(--platinum-gold) !important; }

        /* Стиль для корзины при выбранном сертификате (ДОБАВЛЕНО) */
        .current-session-box.session-gold {
            border-color: var(--platinum-gold) !important;
            box-shadow: 0 0 20px rgba(184,150,0,0.3);
        }

        .current-session-box { 
            background: rgba(191, 0, 255, 0.05); border: 1px solid var(--neon-purple); 
            padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; 
            justify-content: space-between; min-height: 140px; align-items: flex-start; position: relative; flex-shrink: 0;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .cart-info { flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; }
        #cartItems { display: flex; flex-wrap: wrap; gap: 8px; }
        .cart-tag { font-size: 10px; font-family: 'Orbitron'; padding: 6px 30px 6px 10px; border-radius: 4px; display: inline-flex; align-items: center; position: relative; background: rgba(0,0,0,0.3); }
        .tag-white { border: 1px solid #fff; color: #fff; }
        .tag-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .tag-red { border: 1px solid var(--artist-red); color: var(--artist-red); }
        .tag-green { border: 1px solid var(--status-green); color: var(--status-green); }
        .tag-blue { border: 1px solid var(--azure-blue); color: var(--azure-blue); }
        .tag-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }
        .tag-remove { position: absolute; right: 0; top: 0; bottom: 0; width: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.5; }
        
        .cart-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; align-self: flex-end; }
        .total-display-pc { font-family: 'Rajdhani'; font-weight: 700; font-size: 34px; color: #fff; height: 42px; width: 155px; margin-bottom: 8px; text-align: right; }
        .save-btn { background: var(--status-green); color: #fff; border: none; height: 42px; width: 155px; border-radius: 6px; font-family: 'Orbitron'; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }

        .progress-container { width: 100%; height: 2px; background: #111; margin-top: 5px; border-radius: 1px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--neon-purple); transition: 0.5s; width: 0%; }
        .progress-bar.complete { background: var(--status-green); }

        table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff !important; word-wrap: break-word; }
        
        .price-cell { color: #fff !important; font-weight: 700; font-size: 15px; text-align: right; padding-right: 12px; }

        th:nth-child(1), td:nth-child(1) { width: 90px; }
        th:nth-child(2), td:nth-child(2) { width: 180px; } 
        th:nth-child(3), td:nth-child(3) { width: auto; }
        th:nth-child(4), td:nth-child(4) { width: 110px; }
        th:nth-child(5), td:nth-child(5) { width: 120px; }

        .table-time-inline { font-family: 'Rajdhani'; font-weight: 700; font-size: 16px; color: var(--neon-purple); margin-left: 10px; }

        .certs-container { flex-grow: 1; overflow-y: auto; padding-right: 15px; }

        .filter-info { font-size: 10px; color: #888; margin: 0 0 10px 0; display: flex; justify-content: space-between; font-weight: 600; text-transform: uppercase; flex-shrink: 0; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

        .history-tooltip { 
            visibility: hidden; opacity: 0; position: fixed; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 9999; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            pointer-events: none; transition: opacity 0.4s ease;
        }
        .history-tooltip.active { visibility: visible; opacity: 1; }
        .history-tooltip.pos-down { transform: translate(15px, 15px); }
        .history-tooltip.pos-up { transform: translate(15px, calc(-100% - 15px)); }
        
        .tooltip-sum { filter: blur(6px); transition: 0.3s; }
        .privacy-active .tooltip-sum { filter: blur(0); }

        .summary-line { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; font-family: 'Rajdhani'; font-weight: 700; }

        .action-icons-wrap { display: flex; align-items: center; gap: 15px; justify-content: flex-end; }
        .icon-btn-box { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
        .icon-btn-box i { font-size: 12px; color: #444; }
        .icon-btn-box span { font-family: 'Orbitron'; font-size: 7px; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }
        .icon-btn-box:hover i { color: var(--neon-purple); }
        .icon-btn-box:hover span { color: var(--neon-purple); }
        .icon-delete:hover i { color: var(--artist-red); }
        .icon-delete:hover span { color: var(--artist-red); }

        @media (max-width: 992px) {
            body { 
                overflow-y: auto; 
                height: 100vh; 
                padding: 10px; 
                padding-top: max(10px, env(safe-area-inset-top)); 
                padding-bottom: env(safe-area-inset-bottom);
            }
            header { 
                margin-top: 0 !important;
                flex-direction: column; gap: 15px; align-items: center; border-bottom: none; 
            }
            .header-right-zone { width: 100%; }
            .admin-grid { display: flex !important; flex-direction: column !important; height: auto !important; overflow: visible; }
            .table-scroll-container { max-height: none; overflow-y: visible; }
            .logo { text-align: center; font-size: 16px; width: 100%; margin-bottom: 5px; }
            .side-panel { order: 1 !important; width: 100% !important; box-sizing: border-box; }
            .crm-panel { order: 2 !important; width: 100% !important; background: none; border: none; padding: 0; }
            
            .controls-row { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 8px; 
                padding: 10px; 
                overflow-x: hidden;
            }
            .prepaid-toggle { 
                grid-column: span 2; 
                border-right: none; 
                border-bottom: 1px solid #222; 
                margin-right: 0; 
                justify-content: center; 
                padding-bottom: 10px;
                margin-bottom: 5px;
            }

            .btn-order-1 { order: 1; } 
            .btn-order-2 { order: 2; } 
            .btn-order-3 { order: 3; } 
            .btn-order-4 { order: 4; } 
            .btn-order-5 { order: 5; } 
            .btn-order-6 { order: 6; } 
            .btn-order-7 { order: 7; grid-column: span 2; } 
            .btn-order-8 { order: 8; grid-column: span 2; } 
            
            .action-btn { width: 100%; }

            table, thead, tbody, th, td, tr { display: block; width: 100% !important; box-sizing: border-box; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            
            tr { 
                background: #0a0a0a; 
                border: 1px solid #111; 
                margin-bottom: 15px; 
                border-radius: 12px; 
                padding: 15px; 
                position: relative; 
                overflow: hidden; 
            }
            
            td { border: none !important; padding: 0 !important; text-align: left !important; min-height: auto !important; display: block !important; position: relative; }

            .mobile-row-date { font-family: 'Rajdhani'; font-weight: 700; font-size: 14px; color: #555; margin-bottom: 4px; }
            .mobile-row-client { font-family: 'Inter'; font-weight: 600; font-size: 18px; color: #fff; margin-bottom: 8px; }
            .mobile-row-services { font-size: 11px; color: #888; margin-bottom: 12px; line-height: 1.4; }
            
            .mobile-progress-wrapper { margin-bottom: 15px; }
            .mobile-time-label { font-family: 'Orbitron'; font-size: 10px; color: var(--neon-purple); margin-bottom: 5px; display: block; }
            
            .mobile-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; border-top: 1px solid #1a1a1a; padding-top: 15px; }
            
            .m-action-btn { 
                padding: 12px; border-radius: 6px; font-family: 'Orbitron'; font-size: 10px; 
                text-transform: uppercase; text-align: center; cursor: pointer; border: 1px solid transparent;
            }
            .m-btn-pay { border-color: var(--status-green); color: var(--status-green); }
            .m-btn-del { border-color: var(--artist-red); color: var(--artist-red); }

            .current-session-box { flex-direction: column; align-items: stretch; gap: 20px; }
            .cart-actions { align-self: center; width: 100%; align-items: center; }
            .total-display-pc { text-align: center; width: 100%; }
            .save-btn { width: 100%; }

            .mobile-details-overlay {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                background: #0a0a0a;
                z-index: 50;
                padding: 15px;
                display: none;
                box-sizing: border-box;
                flex-direction: column;
                border: 1px solid var(--neon-purple);
                border-radius: 12px;
                box-shadow: inset 0 0 20px rgba(191, 0, 255, 0.2);
            }
            .mobile-details-overlay.active { display: flex; }

                position: absolute;
                top: 8px; right: 8px;

                border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-size: 14px;

                margin-bottom: 12px; text-transform: uppercase;
            }
            .mobile-details-list { overflow-y: auto; flex-grow: 1; }
            .mobile-detail-item {
                display: flex; justify-content: space-between; align-items: center;
                margin-bottom: 6px; padding: 4px 0 4px 10px;
                border-left: 2px solid #fff; 
            }
            .mobile-detail-name { font-size: 11px; color: #fff; }
            .mobile-detail-price { font-family: 'Rajdhani'; font-weight: 700; font-size: 14px; }
            
            .mobile-summary-section {
                margin-top: 10px; border-top: 1px solid #222; padding-top: 10px;
            }
            .mobile-summary-line {
                display: flex; justify-content: space-between; 
                margin-bottom: 4px; font-size: 12px; 
                font-family: 'Rajdhani'; font-weight: 700;

        .cal-grid .day {

            border: 1px solid transparent !important;
            position: relative;
            color: #ffffff !important;

        .cal-grid .day:not(.has-data):hover {
            border: 1px solid #00ff66 !important;
            cursor: pointer;
        }

        .cal-grid .day.selected {
            background: #333 !important; 
            border: 1px solid #00ff66 !important;
            color: #ffffff !important;
        }

        .cal-grid .day.past-session {
            background: #36648B !important; 
            border: 1px solid transparent !important;
            font-weight: bold;
            color: #ffffff !important;
        }
        
        .cal-grid .day.future-session {
            background: #cc0000 !important;
            border: 1px solid transparent !important;
            color: #ffffff !important;
        }

        .cal-grid .day.today-session {
            background: #008f39 !important;
            border: 1px solid transparent !important;

        .cal-grid .day::after {
            display: none !important;

</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="customModal" class="custom-modal">
    <div id="modalTitle" class="modal-title">ДОПЛАТА</div>
    <input type="number" id="modalInput" class="modal-input" placeholder="0">
    <div class="modal-btns">
        <button class="m-btn m-cancel" onclick="closeModal()">ОТМЕНА</button>
        <button id="modalConfirmBtn" class="m-btn m-confirm">ГОТОВО</button>
    </div>
</div>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div class="header-right-zone">
        <div class="total-box" onclick="checkPrivacyPassword()">
            <div class="unlock-overlay">CLICK TO UNLOCK</div>
            <span id="monthTotal" class="income-amount privacy-blur">0 ₽</span>
            <span id="totalLabel">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти на сайт</a>
    </div>
</header>
<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <style>
                @media (min-width: 993px) {
                    .btn-order-1 { order: 1; }
                    .btn-order-2 { order: 2; }
                    .btn-order-3 { order: 3; }
                    .btn-order-4 { order: 4; }
                    .btn-order-6 { order: 5; }
                    .btn-order-7 { order: 6; }
                    .btn-order-8 { order: 7; }
                    .btn-order-5 { order: 8; }
                }
                @media (max-width: 992px) {
                    .btn-wrapper { order: unset !important; }
                }
            </style>

            <div class="prepaid-toggle">
                <span>50%</span>
                <label class="switch">
                    <input type="checkbox" id="prepaidMode" onchange="applyPrepaidToggle()">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="btn-wrapper btn-order-1">
                <button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white', true)">+ 1 ЧАС</button>
            </div>
            
            <div class="btn-wrapper btn-order-2">
                <button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button>
            </div>

            <div class="btn-wrapper btn-order-3">
                <button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button>
            </div>

            <div class="btn-wrapper btn-order-4">
                <button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button>
            </div>
            
            <div class="btn-wrapper btn-order-5">
                <button class="action-btn btn-blue" onclick="openPriceModal('АРАНЖИРОВКА', 'blue', 10000)">АРАНЖИРОВКА</button>
            </div>

            <div class="btn-wrapper btn-order-6">
                <button class="action-btn btn-green btn-dashed-green" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП. ДОРОЖКА</button>
            </div>
            
            <div class="btn-wrapper btn-order-7">
                <button class="action-btn btn-gold" onclick="openPriceModal('PLATINUM EDITION', 'gold', 10000)">PLATINUM EDITION</button>
            </div>

            <div class="btn-wrapper btn-order-8">
                <button class="action-btn btn-gold btn-dashed-gold" onclick="addToCart('ПЛАТ. ДОРОЖКА', 300, 'gold')">+ ПЛАТ. ДОРОЖКА</button>
            </div>
        </div>

        <div id="currentSession" class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #444; margin-bottom: 12px; font-family:'Orbitron'; letter-spacing: 1px;">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
            </div>
        </div>

        <div class="filter-info">
            <span id="currentViewText">ОТЧЕТ ЗА ФЕВРАЛЬ 2026</span>
        </div>

        <div class="table-scroll-container">
            <table>
                <thead><tr><th>ДАТА</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th style="text-align:right; padding-right:12px;">ВНЕСЕНО</th><th style="text-align:right">ДЕЙСТВИЯ</th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
        <button onclick="clearFullHistory()" style="margin-top:20px; background:none; border:none; color:#222; font-size:8px; cursor:pointer; text-transform:uppercase; flex-shrink:0;">Удалить всю историю</button>
    </div>

    <div class="side-panel">
        <div class="certs-dropdown" id="certsDropdown">
            <div class="certs-header" onclick="toggleCerts()">
                <h2>СЕРТИФИКАТЫ</h2>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="certs-content">
                <div class="certs-container" id="certsList"></div>
            </div>
        </div>

        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" style="cursor:pointer; font-size:12px; color:#444;" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>

        <div class="session-booking-widget">
            <div class="booking-label">Добавление на будущее</div>
            <div class="booking-row">
                <input type="text" id="bookingTime" class="booking-field" placeholder="00:00" maxlength="5" oninput="formatTimeInput(this)" onkeydown="if(event.key==='Enter') saveSession()">
                <input type="text" id="bookingClient" class="booking-field" placeholder="Имя клиента" onkeydown="if(event.key==='Enter') saveSession()">
            </div>
        </div>

        <div class="future-sessions-widget" id="nextSessionBox">
            <div class="future-title" id="futureTitleLabel">Ближайшая запись</div>
            <div id="futureListContainer">
                <div class="future-item">
                    <div class="future-date" id="nextSessionDate">--</div>
                    <div class="future-client" id="nextSessionClient">Нет записей</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ИЗМЕНЕНО: структура currentCart (убрали items, details хранит originalColor)
    window.crmData = [];
    window.currentCart = { details: [], total: 0, fullPriceTotal: 0 };
    var currentCart = window.currentCart; 
    let currentCalDate = new Date();
    let selectedDate = null;
    let hoverTimer;
    const hoverDelay = 700;
    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600', blue: '#00ccff' };

    // ДОБАВЛЕНО: переменная для выбранного сертификата
    let selectedCertId = null;

    function toggleCerts() { document.getElementById('certsDropdown').classList.toggle('active'); }
    function formatTimeInput(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length >= 2) val = val.slice(0, 2) + ':' + val.slice(2, 4);
        input.value = val;
    }

    function initTooltipLogic() {
        const tableBody = document.getElementById('crmTableBody');
        if(!tableBody) return;
        tableBody.addEventListener('mousemove', (e) => {
            const cell = e.target.closest('.services-cell');
            if (!cell || window.innerWidth <= 992) return; 
            const allTooltips = document.querySelectorAll('.history-tooltip');
            clearTimeout(hoverTimer);
            allTooltips.forEach(t => t.classList.remove('active'));
            if (cell) {
                const tooltip = cell.querySelector('.history-tooltip');
                if (tooltip) {
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = e.clientY + 'px';
                    hoverTimer = setTimeout(() => { tooltip.classList.add('active'); }, hoverDelay);
                }
            }
        });
        tableBody.addEventListener('mouseleave', () => {
            clearTimeout(hoverTimer);
            document.querySelectorAll('.history-tooltip').forEach(t => t.classList.remove('active'));
        });
    }

    function openModal(title, type, confirmCallback, defaultValue = '') {
        const modal = document.getElementById('customModal');
        const overlay = document.getElementById('modalOverlay');
        const titleEl = document.getElementById('modalTitle');
        const inputEl = document.getElementById('modalInput');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        titleEl.innerText = title;
        inputEl.value = defaultValue;
        inputEl.style.display = (type === 'confirm-delete') ? 'none' : 'block';
        confirmBtn.className = 'm-btn m-confirm';
        confirmBtn.onclick = confirmCallback;
        modal.style.display = 'block'; overlay.style.display = 'block';
        if(type !== 'confirm-delete') inputEl.focus();
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function openPriceModal(name, color, defaultPrice) {
        openModal(`УКАЖИТЕ СТОИМОСТЬ: ${name}`, "price", function() {
            const p = parseInt(document.getElementById('modalInput').value);
            if(!isNaN(p) && p > 0) {
                addToCart(name, p, color);
                closeModal();
            } else { alert('Введите корректную сумму'); }
        }, defaultPrice);
    }

    function checkPrivacyPassword() {
        if(document.body.classList.contains('privacy-active')) return;
        openModal("ВВЕДИТЕ ПАРОЛЬ АДМИНИСТРАТОРА", "password", function() {
            const pass = document.getElementById('modalInput').value;
            if (pass === '123') {
                document.body.classList.add('privacy-active');
                closeModal(); updateTable(); 
            } else { alert("Неверный пароль"); }
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays');
        if (!grid) return;
        grid.innerHTML = '';
        
        const y = currentCalDate.getFullYear();
        const m = currentCalDate.getMonth();
        
        const monthNames = ["ЯНВАРЬ", "ФЕВРАЛЬ", "МАРТ", "АПРЕЛЬ", "МАЙ", "ИЮНЬ", 
                            "ИЮЛЬ", "АВГУСТ", "СЕНТЯБРЬ", "ОКТЯБРЬ", "НОЯБРЬ", "ДЕКАБРЬ"];
        document.getElementById('calMonthName').innerText = `${monthNames[m]} ${y}`;

        const firstDay = new Date(y, m, 1).getDay();
        const lastDate = new Date(y, m + 1, 0).getDate();
        const shift = firstDay === 0 ? 6 : firstDay - 1;

        for (let i = 0; i < shift; i++) grid.innerHTML += '<div></div>';

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayStr = today.toLocaleDateString('ru-RU');

        for (let d = 1; d <= lastDate; d++) {
            const dayStr = String(d).padStart(2, '0');
            const monthStr = String(m + 1).padStart(2, '0');
            const dateStr = `${dayStr}.${monthStr}.${y}`;
            
            const hasData = window.crmData && window.crmData.some(s => s.date === dateStr);
            
            let classList = 'day';
            if (hasData) {
                classList += ' has-data';
                const [cellD, cellM, cellY] = dateStr.split('.').map(Number);
                const cellDate = new Date(cellY, cellM - 1, cellD);
                cellDate.setHours(0, 0, 0, 0);

                if (dateStr === todayStr) {
                    classList += ' today-session'; 
                } else if (cellDate < today) {
                    classList += ' past-session';   
                } else {
                    classList += ' future-session'; 
                }
            }
            
            if (selectedDate === dateStr) classList += ' selected';
            grid.innerHTML += `<div class="${classList}" onclick="selectCalendarDate('${dateStr}')">${d}</div>`;
        }
    }

    function selectCalendarDate(date) {
        selectedDate = date;
        const label = document.getElementById('sessionDateLabel');
        if(label) label.innerText = `ТЕКУЩИЙ ЧЕК (${date}):`;
        renderCalendar(); 
        updateNextSession(date); 
    }

    function changeMonth(dir) { 
        currentCalDate.setMonth(currentCalDate.getMonth() + dir); 
        selectedDate = null; 
        const label = document.getElementById('sessionDateLabel');
        if(label) label.innerText = `ТЕКУЩИЙ ЧЕК:`;
        updateTable(); renderCalendar(); 
    }

    function applyPrepaidToggle() {
        const isPrepaid = document.getElementById('prepaidMode').checked;
        window.currentCart.total = 0;
        window.currentCart.details.forEach(item => {
            const isForceFull = item.name.includes('ЧАС ЗАПИСИ');
            if (isPrepaid && !isForceFull) {
                item.price = item.basePrice / 2;
                if (!item.name.includes('(50%)')) item.name += ' (50%)';
            } else {
                item.price = item.basePrice;
                item.name = item.name.replace(' (50%)', '');
            }
            window.currentCart.total += item.price;
        });
        renderCart();
    }

    // ИЗМЕНЕНО: addToCart теперь сохраняет originalColor
    function addToCart(name, price, colorClass, forceFull = false) {
        const isPrepaid = document.getElementById('prepaidMode').checked;
        let finalPrice = (isPrepaid && !forceFull) ? price / 2 : price;
        let finalName = (isPrepaid && !forceFull) ? name + ' (50%)' : name;
        window.currentCart.details.push({ 
            name: finalName, 
            price: finalPrice, 
            basePrice: price, 
            originalColor: colorClass   // сохраняем исходный цвет
        });
        window.currentCart.total += finalPrice;
        window.currentCart.fullPriceTotal += price;
        renderCart();
    }

    // ИЗМЕНЕНО: removeFromCart работает с details
    function removeFromCart(index) {
        const item = window.currentCart.details[index];
        window.currentCart.total -= item.price;
        window.currentCart.fullPriceTotal -= item.basePrice;
        window.currentCart.details.splice(index, 1);
        renderCart();
    }

    // ИЗМЕНЕНО: renderCart использует selectedCertId для выбора цвета
    function renderCart() {
        const container = document.getElementById('cartItems');
        const total = document.getElementById('cartTotal');
        if (!container || !total) return;
        total.innerText = window.currentCart.total + ' ₽';
        container.innerHTML = window.currentCart.details.length === 0 ? 'Пусто...' : '';
        window.currentCart.details.forEach((item, i) => {
            const tag = document.createElement('div');
            // Если выбран сертификат, все теги золотые, иначе оригинальный цвет
            const color = selectedCertId ? 'gold' : item.originalColor;
            tag.className = `cart-tag tag-${color}`;
            tag.innerHTML = `${item.name}<div class="tag-remove" onclick="removeFromCart(${i})">×</div>`;
            container.appendChild(tag);
        });
    }

    // ДОБАВЛЕНО: функция выбора сертификата
    function selectCert(certId) {
        const saved = JSON.parse(localStorage.getItem('spring_certs')) || {};
        // Если сертификат уже активен, игнорируем клик
        if (saved[certId] && saved[certId].active) return;

        const sessionBox = document.getElementById('currentSession');
        if (selectedCertId === certId) {
            // Снимаем выделение
            selectedCertId = null;
            sessionBox.classList.remove('session-gold');
        } else {
            // Выделяем новый сертификат
            selectedCertId = certId;
            sessionBox.classList.add('session-gold');
        }
        renderCart();           // обновить цвета тегов
        updateCerts();          // обновить подсветку в списке сертификатов
    }

    // ИЗМЕНЕНО: полная переработка updateCerts
    function updateCerts() {
        const list = document.getElementById('certsList');
        const saved = JSON.parse(localStorage.getItem('spring_certs')) || {};
        if (!list) return;
        list.innerHTML = '';

        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0');
            const data = saved[id] || { active: false, name: '' };
            const div = document.createElement('div');
            div.className = 'cert-row';
            
            if (!data.active) {
                div.classList.add('inactive');
                // Клик по строке (кроме поля ввода) вызывает selectCert
                div.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        selectCert(id);
                    }
                };
            }

            if (selectedCertId === id) {
                div.classList.add('selected');
            }

            let innerHTML = `<span class="cert-id">${id}</span>`;

            if (data.active) {
                innerHTML += `<span style="font-size:10px; color:#555">${data.name}</span>`;
                innerHTML += `<span style="font-size:8px; color:#00ff66; border:1px solid #00ff66; padding:2px 5px; border-radius:3px;">OK</span>`;
            } else {
                // Неактивный: поле ввода (значение пока пустое, можно заполнить в любой момент)
                innerHTML += `<input type="text" id="in-${id}" style="background:#111; border:1px solid #222; color:#fff; padding:4px; font-size:10px; width:90px; outline:none;" placeholder="Имя" value="${data.name || ''}">`;
                // Кнопка АКТИВ больше не нужна – активация происходит при сохранении чека
            }

            div.innerHTML = innerHTML;
            list.appendChild(div);
        }
    }

    // ИЗМЕНЕНО: saveSession теперь активирует выбранный сертификат
    window.saveSession = async function(event) {
        if (event) event.preventDefault();
        let cart = window.currentCart;

        if (!cart || !cart.details || cart.details.length === 0) {
            alert('Чек в SSL CRM пуст! Добавьте услуги.');
            return;
        }

        // Если выбран сертификат, проверяем наличие имени и активируем
        if (selectedCertId) {
            const input = document.getElementById('in-' + selectedCertId);
            if (!input || input.value.trim() === '') {
                alert('Введите имя для сертификата');
                return;
            }
            const name = input.value.trim();
            const certs = JSON.parse(localStorage.getItem('spring_certs')) || {};
            certs[selectedCertId] = { active: true, name: name };
            localStorage.setItem('spring_certs', JSON.stringify(certs));
            // Сбрасываем выделение
            selectedCertId = null;
            document.getElementById('currentSession').classList.remove('session-gold');
            updateCerts(); // обновить отображение сертификатов
        }

        const clientName = document.getElementById('bookingClient')?.value || 'Без имени';
        const time = document.getElementById('bookingTime')?.value || '';
        const date = selectedDate || new Date().toLocaleDateString('ru-RU');

        try {
            await crmCollection.add({
                date: date,
                client: clientName,
                time: time,
                services: cart.details.map(i => i.name).join(', '),
                details: JSON.parse(JSON.stringify(cart.details)), // сохраняем с originalColor
                total: Number(cart.total),
                fullTotal: Number(cart.fullPriceTotal),
                timestamp: Date.now()
            });

            // Очищаем корзину
            window.currentCart = { details: [], total: 0, fullPriceTotal: 0 };
            if (document.getElementById('bookingClient')) document.getElementById('bookingClient').value = '';
            if (document.getElementById('bookingTime')) document.getElementById('bookingTime').value = '';
            renderCart();
        } catch (error) {
            console.error("Ошибка сохранения:", error);
        }
    };

    window.addPayment = function(id) {
        const row = window.crmData.find(r => r.id === id);
        const full = row.fullTotal || row.total;
        const remaining = full - row.total;
        if (remaining <= 0) return alert('Заказ уже полностью оплачен');
        
        openModal(`ДОПЛАТА: ${row.client}\nОСТАТОК: ${remaining} ₽`, "pay", function() {
            const amount = parseInt(document.getElementById('modalInput').value);
            if (!isNaN(amount) && amount > 0) {
                crmCollection.doc(id).update({ total: row.total + amount });
                closeModal();
            }
        }, remaining);
    };

    window.deleteRow = function(id) {
        openModal("УДАЛИТЬ ЗАПИСЬ?", "confirm-delete", function() {
            crmCollection.doc(id).delete();
            closeModal();
        });
    };

    // Остальные функции (updateTable, updateMonthTotal, updateNextSession, toggleMobileDetails и т.д.) остаются без изменений,
    // но для полноты я приведу их ниже (они уже были в вашем коде). 
    // В целях экономии места я не буду копировать их сюда, если вы не против.
    // Однако, чтобы код был полностью рабочим, убедитесь, что все функции из оригинального скрипта присутствуют.
    // Ниже я кратко перечислю их: updateTable, updateMonthTotal, updateCerts, activateCert (уже не нужна), updateNextSession, toggleMobileDetails и т.д.
    // Вы можете оставить их без изменений, кроме activateCert – её можно удалить, так как мы больше не используем кнопку.
    // Но если оставите, она не помешает.
