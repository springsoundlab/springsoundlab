<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SPRING SOUND LAB | CRM & ANALYTICS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon-purple: #bf00ff; --bg-dark: #050505; --card-bg: #0a0a0a; 
            --status-green: #008f39; --artist-red: #cc0000; --platinum-gold: #b89600;
        }
        body { background: var(--bg-dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #111; margin-bottom: 20px; }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--neon-purple); letter-spacing: 2px; font-size: 14px; }
        .back-btn { color: #888; text-decoration: none; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #222; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }

        .admin-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .crm-panel, .side-panel { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #111; display: flex; flex-direction: column; }

        /* Календарь */
        .calendar-widget { margin-bottom: 20px; background: #000; border-radius: 10px; padding: 15px; border: 1px solid #222; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-family: 'Orbitron'; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day { font-size: 12px; padding: 8px 0; cursor: pointer; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .day.today { border: 1px solid var(--neon-purple); }
        .day.has-data { background: var(--status-green) !important; }

        /* Кнопки услуг */
        .controls-row { display: flex; align-items: center; gap: 10px; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #111; flex-wrap: wrap; }
        .btn-wrapper { position: relative; display: inline-block; }
        .action-btn { background: transparent; color: #fff; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 9px; font-family: 'Orbitron', sans-serif; transition: 0.3s; border: 1px solid #444; }
        
        .price-tip { 
            visibility: hidden; opacity: 0; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background: var(--neon-purple); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px;
            white-space: nowrap; transition: 0.2s; pointer-events: none; z-index: 100; font-family: 'Rajdhani'; font-weight: 700;
        }
        .btn-wrapper:hover .price-tip { visibility: visible; opacity: 1; }

        .platinum-group { display: flex; align-items: center; gap: 10px; border-left: 1px solid #222; padding-left: 10px; }
        .plat-input { background: #000; border: 1px solid #222; color: var(--platinum-gold); width: 75px; padding: 8px; border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px; outline: none; text-align: center; }

        /* Тултип состава заказа (ПК) */
        #historyTooltip { 
            visibility: hidden; opacity: 0; position: fixed; background: #0a0a0a; border: 1px solid var(--neon-purple); 
            padding: 15px; border-radius: 8px; z-index: 10000; width: 260px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            pointer-events: none; transition: opacity 0.3s;
        }

        /* Цвета кнопок */
        .btn-white { border: 1px solid #fff; }
        .btn-purple { border: 1px solid var(--neon-purple); color: var(--neon-purple); }
        .btn-red { border: 1px solid var(--artist-red); color: var(--artist-red); }
        .btn-green { border: 1px solid var(--status-green); color: var(--status-green); }
        .btn-gold { border: 1px solid var(--platinum-gold); color: var(--platinum-gold); }

       /* Растягиваем блок, чтобы низ совпал с календарем */
.current-session-box { 
    background: rgba(191, 0, 255, 0.05); 
    border: 1px dashed var(--neon-purple); 
    padding: 20px; 
    border-radius: 10px; 
    margin-bottom: 20px; 
    display: flex; 
    justify-content: space-between;
    min-height: 175px; /* Высота под календарь */
    align-items: flex-end; 
}

/* Контейнер для суммы и кнопки справа */
.cart-actions { 
    display: flex; 
    flex-direction: column; 
    align-items: flex-end; 
    justify-content: flex-end; 
    gap: 10px; 
    min-width: 320px; 
}

/* Сумма: закреплена над кнопкой, размер совпадает с кнопкой */
.total-display-pc { 
    font-family: 'Rajdhani'; 
    font-weight: 700; 
    font-size: 32px; 
    color: #fff; 
    width: 155px; /* Ширина как у кнопки */
    text-align: center; 
    line-height: 1;
    margin-bottom: 5px;
}

/* Кнопка сохранить: фиксированная ширина */
.save-btn { 
    background: var(--status-green); 
    color: #fff; 
    border: none; 
    padding: 12px 0; 
    width: 155px; 
    border-radius: 6px; 
    font-family: 'Orbitron'; 
    font-size: 10px; 
    cursor: pointer; 
    transition: 0.3s; 
}

        /* Таблица */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: #888; font-family: 'Orbitron'; font-size: 10px; padding: 12px 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; color: #fff; }
        .client-name-cell { color: #888; }
        .num-cell { font-family: 'Rajdhani'; font-weight: 600; font-size: 14px; }

        .total-box { background: rgba(191, 0, 255, 0.1); padding: 10px 20px; border: 1px solid var(--neon-purple); border-radius: 8px; text-align: right; }
        .month-total-text { font-family: 'Rajdhani'; font-weight: 700; color: var(--neon-purple); font-size: 26px; }

        /* Сертификаты */
        .certs-container { height: 350px; overflow-y: auto; padding-right: 10px; }
        .cert-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #111; }

        /* Мобильные детали услуг */
        .mobile-services-detail { display: none; width: 100vw; margin-left: -20px; background: #0f0f0f; border-y: 1px solid #222; padding: 15px 20px; box-sizing: border-box; }
        .mobile-services-detail.active { display: block; }

        /* ————————————————————————————————————————————————————————————
           МОБИЛЬНАЯ ВЕРСИЯ (ДО 900PX)
           ———————————————————————————————————————————————————————————— */
        @media (max-width: 900px) {
            body { padding: 10px; }
            .admin-grid { display: flex; flex-direction: column; }
            .side-panel { order: 1; background: none; border: none; padding: 0; }
            .crm-panel { order: 2; margin-top: 10px; }

            /* Кнопки услуг: Ровно по 2 в ряд (4 столбца) */
            .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0; background: none; border: none; }
            .btn-wrapper { width: 100%; }
            .action-btn { width: 100%; height: 50px; font-size: 8px; padding: 0; }
            
            .platinum-group { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border: none; padding: 0; margin: 0; }
            .plat-input { grid-column: span 2; width: 100%; height: 45px; }

            /* Чек на мобильном */
            .current-session-box { flex-direction: column; padding: 15px; }
            .cart-actions { width: 100%; min-width: auto; align-items: center; }
            .total-display-pc { font-size: 36px; margin-bottom: 10px; }
            .controls-row-pc { justify-content: space-between; gap: 8px; }
            .input-mini { flex-grow: 1; width: auto; height: 45px; }
            .save-btn { height: 45px; padding: 0 15px; }

            th:nth-child(3), td:nth-child(3) { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SPRING SOUND LAB | CRM & ANALYTICS</div>
    <div style="display:flex; gap:15px; align-items:center;">
        <div class="total-box">
            <span id="monthTotal" class="month-total-text">0 ₽</span>
            <span style="font-size:8px; color:#666; display:block;">ДОХОД ЗА МЕСЯЦ</span>
        </div>
        <a href="index.html" class="back-btn">Выйти</a>
    </div>
</header>

<div class="admin-grid">
    <div class="crm-panel">
        <div class="controls-row">
            <div class="btn-wrapper">
                <button class="action-btn btn-white" onclick="addToCart('ЧАС ЗАПИСИ', 900, 'white')">+ 1 ЧАС</button>
                <div class="price-tip">900 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-purple" onclick="addToCart('START EDITION', 3500, 'purple')">START EDITION</button>
                <div class="price-tip">3500 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-red" onclick="addToCart('ARTIST EDITION', 6000, 'red')">ARTIST EDITION</button>
                <div class="price-tip">6000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green" onclick="addToCart('ТЮНИНГ ВОКАЛА', 1000, 'green')">ТЮНИНГ ВОКАЛА</button>
                <div class="price-tip">1000 ₽</div>
            </div>
            <div class="btn-wrapper">
                <button class="action-btn btn-green" style="border-style:dashed" onclick="addToCart('ДОП. ДОРОЖКА', 500, 'green')">+ ДОП. ДОРОЖКА</button>
                <div class="price-tip">500 ₽</div>
            </div>
            
            <div class="platinum-group">
                <input type="number" id="platPrice" class="plat-input" placeholder="Цена">
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold" onclick="addPlatToCart()">PLATINUM</button>
                    <div class="price-tip">10000 ₽</div>
                </div>
                <div class="btn-wrapper">
                    <button class="action-btn btn-gold" style="border-style:dashed" onclick="addToCart('ПЛАТ. ДОРОЖКА', 300, 'gold')">+ ПЛАТ. ДОР</button>
                    <div class="price-tip">300 ₽</div>
                </div>
            </div>
        </div>

        <div class="current-session-box">
            <div class="cart-info">
                <div id="sessionDateLabel" style="font-size: 10px; color: #555; margin-bottom: 10px; font-family:'Orbitron';">ТЕКУЩИЙ ЧЕК:</div>
                <div id="cartItems" style="display:flex; flex-wrap:wrap;">Пусто...</div>
            </div>
            <div class="cart-actions">
                <div class="total-display-pc" id="cartTotal">0 ₽</div>
                <div class="controls-row-pc">
                    <input type="text" id="clientName" class="input-mini" placeholder="ИМЯ КЛИЕНТА">
                    <button class="save-btn" onclick="saveSession()">СОХРАНИТЬ</button>
                    <i class="fas fa-times" style="cursor:pointer; color:#333; margin-left:5px;" onclick="clearCart()"></i>
                </div>
            </div>
        </div>

        <div style="font-size:10px; color:#555; font-family:'Orbitron'; margin-bottom: 10px;">ОТЧЕТ ЗА ФЕВРАЛЬ 2026</div>
        <div class="table-container">
            <table>
                <thead><tr><th>ДАТА</th><th>КЛИЕНТ</th><th>УСЛУГИ</th><th>ИТОГО</th><th></th></tr></thead>
                <tbody id="crmTableBody"></tbody>
            </table>
        </div>
        <button onclick="clearFullHistory()" style="margin-top:40px; background:none; border:none; color:#222; font-size:8px; cursor:pointer;">Удалить всю историю</button>
    </div>

    <div class="side-panel">
        <div class="calendar-widget">
            <div class="cal-header">
                <i class="fas fa-chevron-left" onclick="changeMonth(-1)"></i>
                <div class="month-name" id="calMonthName">ФЕВРАЛЬ 2026</div>
                <i class="fas fa-chevron-right" onclick="changeMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calendarDays"></div>
        </div>
        <div class="certs-section" id="certsSection">
            <h2 style="font-family:'Orbitron'; font-size:12px; margin-bottom:15px;">СЕРТИФИКАТЫ</h2>
            <div class="certs-container" id="certsList"></div>
        </div>
    </div>
</div>

<div id="historyTooltip"></div>

<script>
    let crmData = JSON.parse(localStorage.getItem('spring_crm_v3')) || [];
    let currentCart = { items: [], details: [], total: 0 };
    let currentCalDate = new Date();
    let selectedDate = null;
    let tooltipTimer;

    const colorMap = { white: '#fff', purple: '#bf00ff', red: '#cc0000', green: '#008f39', gold: '#b89600' };

    const hTooltip = document.getElementById('historyTooltip');
    function showTooltip(e, content) {
        if (window.innerWidth > 900) {
            clearTimeout(tooltipTimer);
            tooltipTimer = setTimeout(() => {
                hTooltip.innerHTML = content;
                hTooltip.style.visibility = 'visible';
                hTooltip.style.opacity = '1';
                moveTooltip(e);
            }, 500);
        }
    }
    function moveTooltip(e) { hTooltip.style.left = (e.clientX + 15) + 'px'; hTooltip.style.top = (e.clientY + 15) + 'px'; }
    function hideTooltip() { clearTimeout(tooltipTimer); hTooltip.style.visibility = 'hidden'; hTooltip.style.opacity = '0'; }

    function renderCalendar() {
        const grid = document.getElementById('calendarDays'); grid.innerHTML = '';
        const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        document.getElementById('calMonthName').innerText = `${["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"][month]} ${year}`;
        ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d => grid.innerHTML += `<div style="font-size:9px; color:#666; font-weight:bold; padding-bottom:5px;">${d}</div>`);
        let start = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<start; i++) grid.innerHTML += '<div></div>';
        for(let d=1; d<=daysInMonth; d++) {
            const ds = `${String(d).padStart(2,'0')}.${String(month+1).padStart(2,'0')}.${year}`;
            const hasData = crmData.some(r => r.date === ds);
            grid.innerHTML += `<div class="day ${new Date().toLocaleDateString('ru-RU')===ds?'today':''} ${hasData?'has-data':''} ${selectedDate===ds?'selected-day':''}" onclick="selectDate('${ds}')">${d}</div>`;
        }
        updateMonthTotal();
    }

    function selectDate(d) { selectedDate = d; document.getElementById('sessionDateLabel').innerText = `ЧЕК (${d}):`; renderCalendar(); updateTable(); }
    function changeMonth(v) { currentCalDate.setMonth(currentCalDate.getMonth() + v); selectedDate = null; renderCalendar(); updateTable(); }

    function addToCart(name, price, color) {
        currentCart.items.push({ name, color });
        currentCart.details.push({ name, price, color });
        currentCart.total += price;
        renderCart();
    }
    function addPlatToCart() {
        const p = parseInt(document.getElementById('platPrice').value) || 10000;
        addToCart('PLATINUM EDITION', p, 'gold');
        document.getElementById('platPrice').value = '';
    }
    function renderCart() {
        const cont = document.getElementById('cartItems'); cont.innerHTML = '';
        currentCart.items.forEach((it, i) => {
            cont.innerHTML += `<span class="cart-tag" style="color:${colorMap[it.color]}; border-color:${colorMap[it.color]}">${it.name}<div class="tag-remove" onclick="removeCart(${i})">×</div></span>`;
        });
        document.getElementById('cartTotal').innerText = currentCart.total + ' ₽';
    }
    function removeCart(i) {
        currentCart.total -= currentCart.details[i].price;
        currentCart.items.splice(i, 1); currentCart.details.splice(i, 1);
        renderCart();
    }
    function clearCart() { currentCart = { items: [], details: [], total: 0 }; document.getElementById('clientName').value = ''; renderCart(); }

    function saveSession() {
        if (!currentCart.items.length) return alert('Добавьте услуги!');
        const date = selectedDate || new Date().toLocaleDateString('ru-RU');
        crmData.push({ date, client: document.getElementById('clientName').value || 'Без имени', services: currentCart.items.map(i => i.name).join(', '), details: [...currentCart.details], total: currentCart.total, ts: Date.now() });
        localStorage.setItem('spring_crm_v3', JSON.stringify(crmData));
        clearCart(); updateTable(); renderCalendar();
    }

    function updateTable() {
        const body = document.getElementById('crmTableBody'); body.innerHTML = '';
        const monthKey = `.${String(currentCalDate.getMonth() + 1).padStart(2, '0')}.${currentCalDate.getFullYear()}`;
        crmData.filter(r => r.date.includes(monthKey)).sort((a,b) => b.ts - a.ts).forEach((row, i) => {
            const tr = document.createElement('tr');
            let tip = `<div style="font-family:Orbitron; font-size:10px; border-bottom:1px solid #333; margin-bottom:10px; padding-bottom:5px;">ДЕТАЛИ:</div>`;
            row.details.forEach(d => tip += `<div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; color:${colorMap[d.color]}"><span>${d.name}</span><span>${d.price} ₽</span></div>`);
            tr.onmousemove = (e) => showTooltip(e, tip); tr.onmouseleave = hideTooltip;
            tr.onclick = () => { if(window.innerWidth < 900) { const d = document.getElementById('mob-det-' + i); d.classList.toggle('active'); } };
            tr.innerHTML = `<td class="num-cell">${row.date}</td><td class="client-name-cell">${row.client}</td><td style="font-size:10px; color:#666;">${row.services}</td><td class="num-cell" style="color:var(--neon-purple)">${row.total} ₽</td><td><i class="fas fa-trash" style="color:#222; cursor:pointer;" onclick="deleteRow(${crmData.indexOf(row)})"></i></td>`;
            body.appendChild(tr);
            const mDet = document.createElement('div'); mDet.id = 'mob-det-' + i; mDet.className = 'mobile-services-detail';
            mDet.innerHTML = `<div style="font-family:Orbitron; font-size:9px; color:var(--neon-purple); margin-bottom:5px;">УСЛУГИ:</div><div style="font-size:12px; line-height:1.6;">${row.services.split(', ').join('<br>')}</div>`;
            body.appendChild(mDet);
        });
        updateMonthTotal();
    }

    function deleteRow(i) { if(confirm('Удалить?')) { crmData.splice(i,1); localStorage.setItem('spring_crm_v3', JSON.stringify(crmData)); updateTable(); renderCalendar(); } }
    function updateMonthTotal() {
        const mk = `.${String(currentCalDate.getMonth() + 1).padStart(2, '0')}.${currentCalDate.getFullYear()}`;
        let t = 0; crmData.forEach(r => { if(r.date.includes(mk)) t += r.total; });
        document.getElementById('monthTotal').innerText = t.toLocaleString() + ' ₽';
    }

    function updateCerts() {
        const list = document.getElementById('certsList'); const saved = JSON.parse(localStorage.getItem('spring_certs')) || {}; list.innerHTML = '';
        for (let i = 1; i <= 300; i++) {
            const id = 'SSL-' + String(i).padStart(3, '0'); const d = saved[id] || { active: false, name: '' };
            list.innerHTML += `<div class="cert-row"><span style="font-family:Rajdhani; font-weight:700; color:var(--neon-purple);">${id}</span>${d.active ? `<span style="font-size:10px; color:#888;">${d.name}</span>` : `<input type="text" id="in-${id}" placeholder="Имя" style="background:#000; border:1px solid #222; color:#fff; font-size:10px; width:100px; padding: 5px; outline:none;">`}<button onclick="actCert('${id}')" style="background:${d.active ? 'none' : 'var(--neon-purple)'}; border:${d.active ? '1px solid #0f6' : 'none'}; color:${d.active ? '#0f6' : '#fff'}; font-size:8px; padding:4px 8px; border-radius:3px; cursor:pointer;">${d.active ? 'OK' : 'АКТИВ'}</button></div>`;
        }
    }
    function actCert(id) {
        const n = document.getElementById('in-' + id)?.value; if (!n && !JSON.parse(localStorage.getItem('spring_certs'))?.[id]) return alert('Имя?');
        const s = JSON.parse(localStorage.getItem('spring_certs')) || {}; s[id] = { active: true, name: n || s[id].name };
        localStorage.setItem('spring_certs', JSON.stringify(s)); updateCerts();
    }

    renderCalendar(); updateTable(); updateCerts();
</script>
</body>
</html>
