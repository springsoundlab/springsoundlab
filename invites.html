<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSL CRM — Инвайт-коды</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--accent:#6c5ce7;--accent-light:#eef0ff;--bg:#f5f6fa;--card-bg:#fff;--border:#eaecf2;--text:#1a1d29;--text-soft:#6b7280;--text-faint:#a0a4b1;--status-green:#16a34a;--status-green-bg:#e9f8ee;--artist-red:#e02f5a;--radius:14px;--shadow:0 1px 3px rgba(20,20,43,0.04);--shadow-lg:0 10px 30px rgba(20,20,43,0.08);}
  *{box-sizing:border-box;}
  body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:30px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;font-weight:800;margin-bottom:4px;}
  .sub{color:var(--text-soft);font-size:13px;margin-bottom:24px;}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
  label{font-size:12px;font-weight:700;color:var(--text-soft);display:block;margin-bottom:6px;}
  input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-family:'Manrope',sans-serif;margin-bottom:14px;outline:none;}
  input:focus{border-color:var(--accent);}
  button{background:var(--accent);color:#fff;border:none;padding:13px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;width:100%;}
  button:hover{background:#5849c4;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .code{font-family:monospace;font-weight:800;font-size:15px;letter-spacing:1px;color:var(--accent);}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;text-transform:uppercase;}
  .badge.free{background:var(--status-green-bg);color:var(--status-green);}
  .badge.used{background:#fdeaef;color:var(--artist-red);}
  #msg{font-size:12px;color:var(--text-soft);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Инвайт-коды SSL CRM</h1>
  <div class="sub">Создайте код-приглашение и передайте его преподавателю для регистрации.</div>

  <div class="card">
    <label>Новый код (например ROMAN2026, можно оставить пустым для случайного)</label>
    <input type="text" id="newCode" placeholder="GUITAR-IVAN" style="text-transform:uppercase;">
    <button onclick="createInvite()">Создать код</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div style="font-weight:800;font-size:13px;margin-bottom:10px;text-transform:uppercase;color:var(--text-faint);">Существующие коды</div>
    <div id="list"><div class="row">Загрузка...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCW2q-IhIUw8Tcgvgcg02BiLEMkoZHbIu0",authDomain:"crm-a9450.firebaseapp.com",projectId:"crm-a9450",storageBucket:"crm-a9450.firebasestorage.app",messagingSenderId:"971140334464",appId:"1:971140334464:web:dde090a90bdcd5563cb765"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const invites=db.collection("invites");

function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function createInvite(){
  let code=document.getElementById('newCode').value.trim().toUpperCase();
  if(!code)code=randomCode();
  const msg=document.getElementById('msg');
  try{
    const existing=await invites.doc(code).get();
    if(existing.exists){msg.textContent='Такой код уже существует.';msg.style.color='var(--artist-red)';return;}
    await invites.doc(code).set({createdAt:Date.now(),used:false,singleUse:true});
    msg.textContent='Код создан: '+code;
    msg.style.color='var(--status-green)';
    document.getElementById('newCode').value='';
    loadInvites();
  }catch(e){msg.textContent='Ошибка: '+e.message;msg.style.color='var(--artist-red)';}
}

async function loadInvites(){
  const list=document.getElementById('list');
  list.innerHTML='';
  const snap=await invites.orderBy('createdAt','desc').get();
  if(snap.empty){list.innerHTML='<div class="row">Нет кодов</div>';return;}
  snap.forEach(doc=>{
    const d=doc.data();
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`<span class="code">${doc.id}</span><span class="badge ${d.used?'used':'free'}">${d.used?'использован':'свободен'}</span>`;
    list.appendChild(row);
  });
}
loadInvites();
</script>
</body>
</html>
